records:
  - record_key: ADMIN-AUTHZ-0001
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      The system SHALL restrict access to the AdminRequestProcessor servlet to users
      with the "administrator" role. GET and POST methods to /AdminRequestProcessor
      MUST be protected by role-based authorization.
    confidence: high
    confidence_basis: >
      Both passes should agree on this rule. It is declared in web.xml with explicit
      security-constraint configuration, which is the highest-confidence evidence in
      a J2EE application.
    risk_class: operational
    basis: >
      web.xml defines security-constraint for /AdminRequestProcessor with auth-constraint
      limiting access to administrator role. This is declarative, framework-enforced authorization.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
            <user-data-constraint>
              <transport-guarantee>NONE</transport-guarantee>
            </user-data-constraint>
          </security-constraint>
    stack_metadata:
      web.xml.security-constraint: "yes"
      roles_involved: "administrator"

