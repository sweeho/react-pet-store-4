      response with revenue amounts per category and total revenue. However, the
      full calculation logic in OPCAdminFacadeEJB is not fully visible in
      available excerpts.
    risk_class: operational
    basis: >
      The getChartInfo() method in ApplRequestProcessor parses XML for Start,
      End, and ReqCategory elements. It calls AdminRequestBD.getChartInfo()
      passing request type "REVENUE", date range, and category. The response
      iterates through a HashMap of chart data, calculating totalAmount by
      summing Float values for each category.
