  - record_key: AO-REQ-0007
    kind: requirement
    capability_key: order-approval
    requirement: >
      The admin system SHALL allow authenticated administrators to retrieve
      purchase orders filtered by status (PENDING, APPROVED, DENIED, COMPLETED,
      SHIPPED_PART) via XML-based requests.
    confidence: high
    confidence_basis: >
      The ApplRequestProcessor.getOrders() method processes XML requests with
      a Status element, calls AdminRequestBD.getOrdersByStatus(status), and
      returns order details in XML format. The method iterates through OrderDetails
      objects and extracts order ID, user ID, order date, order value, and status.
    risk_class: operational
    basis: >
      The ApplRequestProcessor servlet handles XML POST requests with request
      type "GETORDERS". The getOrders() method reads the Status XML element,
      passes it to AdminRequestBD, and receives an OrdersTO collection. It
      iterates through OrderDetails objects to construct XML response with
      each order's ID, user ID, date, amount, and status.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 166
        line_end: 203
        excerpt: |
          String getOrders(Element root) {
              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  NodeList nl = root.getElementsByTagName("Status");
                  String status = getValue(nl.item(0));
                  OrdersTO orders = bd.getOrdersByStatus(status);
                  if (orders == null) {
                      return null;
                  }
                  StringBuffer responseBuffer = new StringBuffer(replyHeader);
                  responseBuffer.append("<Type>GETORDERS</Type>\n");
                  responseBuffer.append("<Status>" + status + "</Status>\n");
                  responseBuffer.append("<TotalCount>" + orders.size() +
                                        "</TotalCount>\n" );
                  for (Iterator it = orders.iterator(); it.hasNext(); ) {
                      OrderDetails o = (OrderDetails) it.next();
                      responseBuffer.append("<Order>\n");
                      responseBuffer.append("<OrderId>" + o.getOrderId()
                                            + "</OrderId>\n");
                      responseBuffer.append("<UserId>" + o.getUserId()
                                            + "</UserId>\n");
                      responseBuffer.append("<OrderDate>" + o.getOrderDate()
                                            + "</OrderDate>\n");
                      responseBuffer.append("<OrderAmount>" + o.getOrderValue()
                                            + "</OrderAmount>\n");
                      responseBuffer.append("<OrderStatus>" + o.getOrderStatus()
                                            + "</OrderStatus>\n");
                      responseBuffer.append("</Order>\n");
                  }
                  responseBuffer.append("</Response>\n");
                  return responseBuffer.toString();
              }
              catch (AdminBDException e) {
                  e.printStackTrace();
                  return null;
              }
          }
    stack_metadata:
      servlet: ApplRequestProcessor
      framework: XML request/response

  - record_key: AO-REQ-0008
    kind: requirement
    capability_key: order-approval
    requirement: >
      The admin system SHALL allow administrators to update order statuses
      (approve or deny) via XML requests containing order ID and new status,
      and forward the update to the AsyncSender EJB for asynchronous processing.
    confidence: high
    confidence_basis: >
      The ApplRequestProcessor.updateOrders() method processes XML requests with
      request type "UPDATESTATUS", extracts Order elements containing OrderId and
      OrderStatus, creates an OrderApproval XML document, and sends it via
      AdminRequestBD.updateOrders(). AdminRequestBD then uses ServiceLocator to
      get AsyncSenderLocalHome and sends the XML message asynchronously.
    risk_class: operational
    basis: >
      The updateOrders() method in ApplRequestProcessor iterates through XML
      Order elements to extract OrderId and OrderStatus, creates a ChangedOrder
      for each, and adds them to an OrderApproval XML document. AdminRequestBD
      looks up the AsyncSender EJB via JNDI and calls sender.sendAMessage()
      to queue the approval/denial for asynchronous processing.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 205
        line_end: 237
        excerpt: |
          String updateOrders(Element root) {
              OrderApproval oa = new OrderApproval();
              NodeList nl = root.getElementsByTagName("Order");
              for (int i = 0; i < nl.getLength(); i++) {
                  Element e = (Element) nl.item(i);
                  String orderId =
                      getValue((Element) e.getElementsByTagName("OrderId").item(0));
                  String orderStatus =
                      getValue((Element) e.getElementsByTagName("OrderStatus").item(0));
                  if (orderId != null && orderStatus != null) {
                      oa.addOrder(new ChangedOrder(orderId, orderStatus));
                  }
              }
              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  bd.updateOrders(oa);
                  return replyHeader + "<Type>UPDATEORDERS</Type>\n"
                      + "<Status>SUCCESS</Status>\n"
                      + "</Response>\n";
              } catch (AdminBDException e) {
                  return replyHeader
                      + "<Error>Exception while processing :  " + e.getMessage()
                      + ". Please try again</Error>\n</Response>\n";
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
        line_start: 115
        line_end: 130
        excerpt: |
          public void updateOrders(OrderApproval oa) throws AdminBDException {
              try {
                  AsyncSenderLocalHome home = (AsyncSenderLocalHome)
                      ServiceLocator.getInstance().getLocalHome(JNDINames.ASYNCSENDER_LOCAL_EJB_HOME);
                  AsyncSender sender= home.create();
                  sender.sendAMessage(oa.toXML());
              } catch (ServiceLocatorException sle) {
                  sle.printStackTrace();
                  throw new AdminBDException(sle.getMessage());
              } catch (XMLDocumentException xde) {
                  xde.printStackTrace();
                  throw new AdminBDException(xde.getMessage());
              }  catch (CreateException ce) {
                  throw new AdminBDException(ce.getMessage());
              }
          }
    stack_metadata:
      servlet: ApplRequestProcessor
      ejb.bean: AsyncSender
      framework: XML request/response, asynchronous messaging

