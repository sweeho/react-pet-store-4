records:
  - record_key: AO-REQ-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The admin system SHALL require users to authenticate via form-based login
      using username and password credentials before accessing any admin
      functionality.
    confidence: high
    confidence_basis: >
      The web.xml declares form-based login configuration with login.jsp and
      error.jsp pages. The AdminRequestProcessor servlet is protected by a
      security-constraint requiring the 'administrator' role. Login handling is
      enforced at the servlet container level.
    risk_class: operational
    basis: >
      The web.xml security configuration specifies <auth-method>FORM</auth-method>
      with <form-login-page>/login.jsp</form-login-page>. The login form uses
      standard J2EE form-based authentication via j_security_check. The
      AdminRequestProcessor servlet is protected by <security-constraint> with
      <auth-constraint><role-name>administrator</role-name></auth-constraint>.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 97
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
            <user-data-constraint>
              <transport-guarantee>NONE</transport-guarantee>
            </user-data-constraint>
          </security-constraint>
          <login-config>
            <auth-method>FORM</auth-method>
            <realm-name>default</realm-name>
            <form-login-config>
              <form-login-page>/login.jsp</form-login-page>
              <form-error-page>/error.jsp</form-error-page>
            </form-login-config>
          </login-config>
    stack_metadata:
      jsp.page: login.jsp
      jsp.page: error.jsp
      framework: form-based authentication

  - record_key: AO-REQ-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      User sessions in the admin system SHALL expire after 54 minutes of
      inactivity.
    confidence: high
    confidence_basis: >
      The session timeout is explicitly configured in web.xml with a numeric
      value of 54, which represents the number of minutes before session
      invalidation. This is a declarative configuration at the servlet
      container level.
    risk_class: operational
    basis: >
      The web.xml contains a session-config element specifying the timeout
      duration. The value 54 represents minutes of inactivity before the
      container invalidates the session.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 67
        line_end: 69
        excerpt: |
          <session-config>
            <session-timeout>54</session-timeout>
          </session-config>
    stack_metadata:
      framework: servlet session management

