  - record_key: AO-REQ-0013
    kind: requirement
    capability_key: admin-operations
    requirement: >
      All communication from the rich client to the server SHALL use XML format
      for both requests and responses, with responses prefixed by an XML
      declaration and response wrapper element.
    confidence: high
    confidence_basis: >
      The ApplRequestProcessor processes incoming XML via DocumentBuilder and
      returns responses with the replyHeader string ("<?xml version=\"1.0\"
      standalone=\"yes\"?>\n<Response>\n") prepended. All successful responses
      wrap their data in <Response> elements and close with </Response>.
    risk_class: operational
    basis: >
      The replyHeader string literal is defined at the servlet class level and
      used for all responses. Request processing parses XML via
      DocumentBuilderFactory.newInstance().newDocumentBuilder() and extracts
      elements by tag name. All response methods append to a StringBuffer
      starting with replyHeader.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 71
        line_end: 147
        excerpt: |
          String replyHeader = "<?xml version=\"1.0\" standalone=\"yes\"?>\n" +
              "<Response>\n";
          String processRequest(String xmlString) {
              try {
                  InputSource source =
                      new InputSource(new ByteArrayInputStream(xmlString.
                                                               getBytes()));
                  DocumentBuilder db =
                      DocumentBuilderFactory.newInstance().newDocumentBuilder();
                  Element root =
                      db.parse(source).getDocumentElement();
                  String reqType = getValue(root.getElementsByTagName("Type")
                                            .item(0));
                  if (reqType.equals("GETORDERS")) {
                      return getOrders(root);
                  }
                  else if (reqType.equals("UPDATESTATUS")) {
                      return updateOrders(root);
                  }
                  else if (reqType.equals("REVENUE") || reqType.equals("ORDERS")) {
                      return getChartInfo(root, reqType);
                  }
    stack_metadata:
      servlet: ApplRequestProcessor
      framework: XML request/response

