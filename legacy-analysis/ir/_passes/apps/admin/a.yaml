  - record_key: AO-REQ-0005
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The admin system SHALL dynamically generate a JNLP (Java Network Launch
      Protocol) file for Java Web Start deployment containing application
      metadata, resource specifications (JAR files), and session ID for
      authentication persistence.
    confidence: high
    confidence_basis: >
      The AdminRequestProcessor.buildJNLP() method is explicitly visible and
      constructs a complete JNLP XML document. The method is called when
      currentScreen equals "manageorders". The JNLP includes codebase from the
      request server name and port, application descriptor with session ID, and
      resource JARs.
    risk_class: operational
    basis: >
      The buildJNLP() method constructs an XML JNLP document including:
      - Codebase from request.getServerName() and request.getServerPort()
      - Application information (title, vendor, description)
      - Resources: j2se versions and required JARs (AdminApp.jar, jaxp.jar, crimson.jar)
      - Application descriptor: main class PetStoreAdminClient with arguments
        for proxy class, hostname, port, and session ID from req.getSession().getId()
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 63
        line_end: 95
        excerpt: |
          protected String buildJNLP(HttpServletRequest req) throws ServletException {
              String serverName = req.getServerName();
              int serverPort = req.getServerPort();
              StringBuffer jnlp = new StringBuffer();
              jnlp.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n");
              jnlp.append("<jnlp codebase=\"http://").append(serverName).append(":").append(serverPort).append("/admin\">\n");
              jnlp.append("<information>\n").append("<title>Pet Store Admin Rich Client</title>\n");
              jnlp.append("<vendor>J2EE BluePrints</vendor>\n");
              jnlp.append("<description>Example of Java Web Start Enabled Rich Client For a J2EE application</description>\n");
              jnlp.append("</information>\n");
              jnlp.append("<resources>\n");
              jnlp.append("<j2se version=\"1.4\"/>\n");
              jnlp.append("<j2se version=\"1.3\"/>\n");
              jnlp.append("<jar href=\"AdminApp.jar\"/>\n");
              jnlp.append("<jar href=\"jaxp.jar\"/>\n");
              jnlp.append("<jar href=\"crimson.jar\"/>\n");
              jnlp.append("</resources>\n");
              jnlp.append("<application-desc main-class=\"com.sun.j2ee.blueprints.admin.client.PetStoreAdminClient\">\n");
              jnlp.append("<argument>com.sun.j2ee.blueprints.admin.client.HttpPostPetStoreProxy</argument>\n");
              jnlp.append("<argument>").append(serverName).append("</argument>\n");
              jnlp.append("<argument>").append(serverPort).append("</argument>\n");
              jnlp.append("<argument>").append(req.getSession().getId()).append("</argument>\n");
              jnlp.append("</application-desc>\n</jnlp>\n");
              return(jnlp.toString());
          }
    stack_metadata:
      framework: Java Web Start (JNLP)
      servlet: AdminRequestProcessor

