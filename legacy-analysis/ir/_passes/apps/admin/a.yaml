  - record_key: AO-REQ-0011
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      The admin system SHALL parse date values in mm/dd/yyyy format from XML
      requests and convert them to Java Date objects using a custom date parser.
    confidence: medium
    confidence_basis: >
      The ApplRequestProcessor.getProperDate() method explicitly parses a date
      string using StringTokenizer with "/" as delimiter, extracts month, day,
      and year, and constructs a Date object using the Date(int year, int month,
      int day) constructor. The method expects mm/dd/yyyy format as evidenced
      by the token ordering and subtraction of 1900 from year.
    risk_class: operational
    basis: >
      The getProperDate() method tokenizes input on "/" delimiter, converts
      tokens to integers for month, day, and year. It constructs a Date using
      Date(year-1900, month-1, day), adjusting for the deprecated Date
      constructor's year-from-1900 and zero-based month convention.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 319
        line_end: 326
        excerpt: |
          Date getProperDate(String inpDate) {
              StringTokenizer tokens = new StringTokenizer(inpDate, "/");
              Integer month = new Integer((String)tokens.nextElement());
              Integer day = new Integer((String)tokens.nextElement());
              Integer year = new Integer((String)tokens.nextElement());
              return(new Date(year.intValue()-1900, month.intValue()-1,
                              day.intValue()));
          }
    stack_metadata:
      servlet: ApplRequestProcessor

