  - record_key: AO-SCREEN-0004
    kind: screen
    capability_key: admin-operations
    requirement: >
      After successful authentication, the admin system SHALL display a welcome
      screen with two primary actions: "Launch Rich Client" to access the admin
      client application, and "logout" to end the session.
    confidence: high
    confidence_basis: >
      The index.jsp file is the welcome page served after login. It describes
      the admin client interface and provides two forms: one with
      currentScreen=manageorders (rich client launch) and one with
      currentScreen=logout (logout). The AdminRequestProcessor servlet handles
      both actions.
    risk_class: operational
    basis: >
      The index.jsp describes the Pet Store Admin Page and provides two POST
      forms to AdminRequestProcessor: one passes currentScreen="manageorders"
      to launch the rich client, the other passes currentScreen="logout" to
      logout.
