records:
  - record_key: OA-REQ-0001
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL accept purchase orders from the Java Pet Store and create
      a workflow instance with initial status PENDING.
    confidence: high
    confidence_basis: >
      Both the PurchaseOrderMDB.onMessage() method and the doWork() method clearly
      implement this. The code creates a PurchaseOrder EJB and calls
      processManager.createManager() with PENDING status. This is enforced in the
      declarative transaction model with Required semantics.
    risk_class: operational
    basis: >
      The onMessage() method receives TextMessage containing purchase order XML,
      parses it via PurchaseOrder.fromXML(), creates the EJB, and starts the
      workflow. This is the entry point to the entire order fulfillment process.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 151
        line_end: 156
        excerpt: |
          private String doWork(String xmlMessage) throws XMLDocumentException, CreateException {
            String ret = null;
            PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
            poHome.create(purchaseOrder);
            //update process manager to start workflow for this purchase order
            processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      jms.queue: PurchaseOrderQueue
      ejb.transaction: Required

  - record_key: OA-REQ-0002
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve orders with total value less than
      500 USD (for US locale) or less than 50,000 JPY (for Japan locale) and
      send an approval message directly to the order approval workflow.
    confidence: medium
    confidence_basis: >
      The threshold values and locale logic are hardcoded literals in the
      canIApprove() method with no configuration or test visible. The logic is
      clear but the thresholds have no documented justification. Risk: these
      thresholds may be demo-only and not reflect production business rules.
    risk_class: financial
    basis: >
      The canIApprove() method implements locale-based thresholds. For US locale,
      it returns true if totalPrice < 500; for JAPAN locale, it returns true if
      totalPrice < 50000. When true, an OrderApproval XML is generated and sent
      to doTransition().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB

  - record_key: OA-REQ-0003
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL validate that only purchase orders with status PENDING can
      be updated by an order approval message. Orders already APPROVED, DENIED, or
      COMPLETED SHALL be skipped.
    confidence: high
    confidence_basis: >
      The OrderApprovalMDB.doWork() method contains an explicit status check that
      continues (skips) non-PENDING orders. This is enforced at the message
      processing layer and prevents reprocessing of finalized orders. The logic
      is declarative and visible in the code.
    risk_class: operational
    basis: >
      The while loop in doWork() calls processManager.getStatus() for each order
      and compares it against OrderStatusNames.PENDING. If the status does not
      equal PENDING, the continue statement skips that order.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 207
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            //if order alreay APPROVED or DENIED or COMPLETED, then order
            //already processed so dont process again
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      jms.queue: OrderApprovalQueue
      ejb.transaction: Required

  - record_key: OA-REQ-0004
    kind: requirement
    capability_key: order-approval
    requirement: >
      For each approved order in an order approval message, the system SHALL
      generate a supplier purchase order containing order ID, date, shipping
      address, and all line items with quantity and unit price.
    confidence: high
    confidence_basis: >
      The getXmlPO() method in OrderApprovalMDB explicitly builds a supplier
      purchase order by extracting all required fields from the PurchaseOrder
      EJB and calling supplierOrderXDE methods to construct the XML. This is
      called for every order with status APPROVED. The mapping is declarative
      and traceable.
    risk_class: operational
    basis: >
      When processing an approved order, the code calls getXmlPO() which uses a
      TPASupplierOrderXDE to build the supplier PO. It retrieves order ID, date,
      contact info, address, and all line items, then calls methods to set each
      field in the XDE.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 218
        line_end: 268
        excerpt: |
          //for all approved orders, send a PO to supplier
          if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
            po = poHome.findByPrimaryKey(co.getOrderId());
            String xmlPO = getXmlPO(po, supplierOrderXDE);
            supplierPoList.add(xmlPO);
          }
          ...
          private String getXmlPO(PurchaseOrderLocal po, TPASupplierOrderXDE supplierOrderXDE) throws XMLDocumentException{
            supplierOrderXDE.newDocument();
            supplierOrderXDE.setOrderId(po.getPoId());
            Date tmpDate = new Date(po.getPoDate());
            supplierOrderXDE.setOrderDate(tmpDate);
            ContactInfoLocal cinfo = po.getContactInfo();
            AddressLocal addr = cinfo.getAddress();
            supplierOrderXDE.setShippingAddress(cinfo.getGivenName(), cinfo.getFamilyName(),
                                                addr.getStreetName1(), addr.getCity(),
                                                addr.getState(), addr.getCountry(),
                                                addr.getZipCode(), cinfo.getEmail(), cinfo.getTelephone());
            Collection liColl = po.getData().getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItem li = (LineItem) liIt.next();
              supplierOrderXDE.addLineItem(li.getCategoryId(), li.getProductId(), li.getItemId(),
                                           li.getLineNumber(), li.getQuantity(), li.getUnitPrice());
            }
    stack_metadata:
      ejb.bean: OrderApprovalMDB

