  - record_key: OM-REQ-0007
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL support partial shipment of orders. When an invoice is
      received for an order, the system SHALL update the order status to
      SHIPPED_PART if not all items have been shipped, or COMPLETED if all
      items have been shipped.
    confidence: high
    confidence_basis: >
      The InvoiceMDB.doWork() method calls poHelper.processInvoice() and
      evaluates the boolean return value to determine if the order is complete.
      Based on this, it updates the status to either COMPLETED or SHIPPED_PART.
      This logic is clear and deterministic.
    risk_class: operational
    basis: >
      The InvoiceMDB receives invoices via JMS Topic and for each invoice calls
      processInvoice() which processes the line item IDs. The method returns
      true if all items for the order have been shipped, false otherwise. The
      status is updated accordingly via processManager.updateStatus().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 172
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());

            //update process manager if this order is completely done, or partially done
            //for this purchase order
            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
    stack_metadata:
      ejb.bean: InvoiceMDB
      jms.queue: InvoiceQueue (JMS Topic)
      ejb.transaction: Required

