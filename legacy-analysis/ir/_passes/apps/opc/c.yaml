  # Order Approval - Status guard for reprocessing
  - record_key: OA-C-0004
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL reject processing of approval messages for orders that are not
      in PENDING status, preventing reprocessing of orders already APPROVED, DENIED,
      or COMPLETED.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB.doWork() implements an explicit guard condition checking
      processManager.getStatus() against OrderStatusNames.PENDING before processing each
      order. Non-PENDING orders are skipped via continue statement. This is the sole
      gate preventing reprocessing and is implemented deterministically.
    risk_class: operational
    basis: >
      The while loop in OrderApprovalMDB.doWork() retrieves current status for each order
      in the approval batch and skips (continue) any that do not equal PENDING. The skip
      is unconditional and immediate.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 224
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
            oaMailList.addOrder(co);
            processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      jms.queue: OrderApprovalQueue
      ejb.transaction: Required

  # Order Approval - Supplier PO generation for approved orders
  - record_key: OA-C-0005
    kind: requirement
    capability_key: order-approval
    requirement: >
      For each order in an approval message with status APPROVED, the system SHALL
      generate a supplier purchase order containing the order ID, order date, customer
      contact and shipping address, and all line items with their category, product,
      item ID, line number, quantity, and unit price.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB.doWork() implements an explicit conditional that checks
      co.getOrderStatus().equals(OrderStatusNames.APPROVED), then calls getXmlPO() to
      build the supplier PO. The getXmlPO() method explicitly extracts all required
      fields (order ID, date, contact, address, line items with all attributes) and
      adds them to the supplier order XDE before serializing to XML.
    risk_class: operational
    basis: >
      OrderApprovalMDB processes each approved order by retrieving the PurchaseOrder EJB,
      calling getXmlPO() with TPASupplierOrderXDE builder, which extracts order ID, date,
      contact info (given/family name, street, city, state, country, zip, email, phone),
      and iterates through line items to call addLineItem() with all line item attributes.
      Each supplier PO is added to a list for transmission.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 218
        line_end: 268
        excerpt: |
          if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
            po = poHome.findByPrimaryKey(co.getOrderId());
            String xmlPO = getXmlPO(po, supplierOrderXDE);
            supplierPoList.add(xmlPO);
          }
          ...
          private String getXmlPO(PurchaseOrderLocal po, TPASupplierOrderXDE supplierOrderXDE) throws XMLDocumentException{
            supplierOrderXDE.newDocument();
            supplierOrderXDE.setOrderId(po.getPoId());
            Date tmpDate = new Date(po.getPoDate());
            supplierOrderXDE.setOrderDate(tmpDate);
            ContactInfoLocal cinfo = po.getContactInfo();
            AddressLocal addr = cinfo.getAddress();
            supplierOrderXDE.setShippingAddress(cinfo.getGivenName(), cinfo.getFamilyName(),
                                                addr.getStreetName1(), addr.getCity(),
                                                addr.getState(), addr.getCountry(),
                                                addr.getZipCode(), cinfo.getEmail(), cinfo.getTelephone());
            Collection liColl = po.getData().getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItem li = (LineItem) liIt.next();
              supplierOrderXDE.addLineItem(li.getCategoryId(), li.getProductId(), li.getItemId(),
                                           li.getLineNumber(), li.getQuantity(), li.getUnitPrice());
            }
    stack_metadata:
      ejb.bean: OrderApprovalMDB

  # Order Management - Status updates from approval processing
  - record_key: OM-C-0001
    kind: requirement
    capability_key: order-management
    requirement: >
      When an approval message is processed, the system SHALL update the order fulfillment
      workflow status to match the approval decision (APPROVED, DENIED, or other status
      values from the approval message).
    confidence: high
    confidence_basis: >
      OrderApprovalMDB.doWork() explicitly calls processManager.updateStatus() for every
      order in the approval message that passes the PENDING status guard. The status
      parameter is co.getOrderStatus(), which comes from the approval message. The update
      is transactional (Required in ejb-jar.xml).
    risk_class: operational
    basis: >
      For each ChangedOrder in the approval message, after verifying PENDING status,
      processManager.updateStatus(co.getOrderId(), co.getOrderStatus()) is called to
      persist the new status. The ordering shows status is updated before downstream
      actions (supplier PO generation).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 224
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
            oaMailList.addOrder(co);
            processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
            if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
              po = poHome.findByPrimaryKey(co.getOrderId());
              String xmlPO = getXmlPO(po, supplierOrderXDE);
              supplierPoList.add(xmlPO);
            }
    stack_metadata:
      ejb.bean: OrderApprovalMDB

  # Order Management - Fulfillment workflow (state machine)
  - record_key: OM-C-0002
    kind: workflow
    capability_key: order-management
    requirement: >
      The order fulfillment process SHALL progress through states: PENDING (initial),
      APPROVED or DENIED (after approval processing), SHIPPED_PART (when invoice received
      for partial fulfillment), and COMPLETED (when all items shipped). No other state
      transitions are reachable.
    confidence: high
    confidence_basis: >
      OrderStatusNames constants (PENDING, APPROVED, DENIED, SHIPPED_PART, COMPLETED) are
      used consistently across three MDBs (PurchaseOrderMDB, OrderApprovalMDB, InvoiceMDB)
      with explicit state update calls. The progression is sequential and guarded by status
      checks. No alternative paths or state names are found in the codebase.
    risk_class: operational
    basis: >
      PurchaseOrderMDB creates orders with PENDING status (line 156). OrderApprovalMDB
      updates to the approval decision status from the message (line 216). InvoiceMDB
      updates to SHIPPED_PART if partial (line 170) or COMPLETED if all items shipped
      (line 167). The ProcessManager maintains the state machine across these transitions.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 156
        line_end: 156
        excerpt: |
          processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 216
        line_end: 216
        excerpt: |
          processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 166
        line_end: 171
        excerpt: |
          if(orderDone) {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
            completedOrder = invoiceXDE.getOrderId();
          } else {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
          }
    stack_metadata:
      ejb.bean: ProcessManagerEJB

  # Order Management - Query by status
  - record_key: OM-C-0003
    kind: requirement
    capability_key: order-management
    requirement: >
      The admin facade SHALL provide a method to retrieve orders filtered by their current
      status, returning order ID, user ID, order date, total value, and status for each
      matching order.
    confidence: high
    confidence_basis: >
      OPCAdminFacadeEJB.getOrdersByStatus() is explicitly implemented as a stateless
      session bean method with container-managed transactions (Required in ejb-jar.xml).
      The method signature, parameter type (String status), and return type (OrdersTO) are
      declared. The implementation iterates through matching ManagerLocal objects and
      constructs OrderDetails for each, extracting all required fields.
    risk_class: operational
    basis: >
      OPCAdminFacadeEJB.getOrdersByStatus(String status) calls processManager.getOrdersByStatus()
      to retrieve a collection of ManagerLocal objects filtered by status. For each manager,
      it retrieves the associated PurchaseOrder via findByPrimaryKey() and extracts order ID,
      user ID, formatted date, value, and status into OrderDetails objects. Returns OrdersTO.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 131
        line_end: 157
        excerpt: |
          public OrdersTO getOrdersByStatus(String status)
                                                        throws OPCAdminFacadeException {
              OrdersTO.MutableOrdersTO retVal = new OrdersTO.MutableOrdersTO();
              PurchaseOrderLocal po;
              ProcessManagerLocal mgr = getProcMgr();
              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection orders = mgr.getOrdersByStatus(status);
                  Iterator it = orders.iterator();
                  while((it!= null) && (it.hasNext())) {
                      ManagerLocal mgrEjb = (ManagerLocal) it.next();
                      po = pohome.findByPrimaryKey(mgrEjb.getOrderId());
                      Date gotDate = new Date(po.getPoDate());
                      String podate = (gotDate.getMonth()+1) + "/" +
                          gotDate.getDate() + "/" + (gotDate.getYear()+1900);
                      retVal.add(new OrderDetails(po.getPoId(), po.getPoUserId(),
                                                  podate, po.getPoValue(), status));
                  }
    stack_metadata:
      ejb.bean: OPCAdminFacadeEJB
      ejb.transaction: Required

  # Order Management - Analytics query (revenue/orders by date and category)
  - record_key: OM-C-0004
    kind: requirement
    capability_key: order-management
    requirement: >
      The admin facade SHALL provide a method to query and aggregate order and revenue
      analytics within a date range, returning either total revenue or total order quantity
      by category or individual item. The request type (REVENUE or ORDERS) and optional
      category filter determine the aggregation.
    confidence: high
    confidence_basis: >
      OPCAdminFacadeEJB.getChartInfo() is implemented as a transactional session bean method
      (Required in ejb-jar.xml) with a complete implementation. The method accepts four
      parameters (request type, start date, end date, category), retrieves purchase orders
      in the date range, and iterates through line items to aggregate revenue (quantity * unit price)
      or order quantities, grouped by category or item ID depending on parameters.
    risk_class: operational
    basis: >
      OPCAdminFacadeEJB.getChartInfo() retrieves PurchaseOrders via findPOBetweenDates() with
      date range, then iterates through all line items. For REVENUE requests: if category is null,
      aggregates revenue by category ID; if category is specified, aggregates by item ID. For ORDERS
      (non-REVENUE) requests: aggregates quantity by category or item ID. Uses HashMap to accumulate
      totals, adding to existing entries or creating new ones.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 169
        line_end: 247
        excerpt: |
          public Map getChartInfo(String request,
                                  Date start,
                                  Date end,
                                  String categ)
              throws OPCAdminFacadeException {
              String id;
              Float tmpValue;
              Integer tmpQty;
              PurchaseOrderLocal po;
              Map chartDetails = new HashMap();
              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection poColl = pohome.findPOBetweenDates(start.getTime(), end.getTime());
                  Iterator it = poColl.iterator();
                  while((it!= null) && (it.hasNext())) {
                      po = (PurchaseOrderLocal) it.next();
                      Collection liColl = po.getAllItems();
                      Iterator lit = liColl.iterator();
                      while((lit!=null) && (lit.hasNext())) {
                          LineItem loc = (LineItem) lit.next();
                          if(request.equals("REVENUE")) {
                              if(categ == null) {
                                  id = loc.getCategoryId();
                                  if(chartDetails.containsKey(id)) {
                                      tmpValue = (Float) chartDetails.get(id);
                                      chartDetails.put(id, new Float(tmpValue.floatValue() +
                                          (loc.getQuantity()*loc.getUnitPrice())));
                                  } else {
                                      chartDetails.put(id, new Float((loc.getQuantity()*
                                                              loc.getUnitPrice())));
                                  }
                              } else {
                                  if(loc.getCategoryId().equals(categ)) {
                                      id = loc.getItemId();
                                      if(chartDetails.containsKey(id)) {
                                          tmpValue = (Float) chartDetails.get(id);
                                          chartDetails.put(id, new Float(tmpValue.floatValue() +
                                              (loc.getQuantity()*loc.getUnitPrice())));
                                      } else {
                                          chartDetails.put(id, new Float(loc.getQuantity()*loc.getUnitPrice()));
                                      }
                                  }
                              }
                          } else {
                              if(categ == null) {
                                  id = loc.getCategoryId();
                                  if(chartDetails.containsKey(id)) {
                                      tmpQty = (Integer) chartDetails.get(id);
                                      chartDetails.put(id, new Integer(tmpQty.intValue() + loc.getQuantity()));
                                  } else {
                                      chartDetails.put(id, new Integer(loc.getQuantity()));
                                  }
    stack_metadata:
      ejb.bean: OPCAdminFacadeEJB
      ejb.transaction: Required

  # Supplier Integration - Send supplier POs to supplier queue
  - record_key: SI-C-0001
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      For each approved order processed by the order approval system, the system SHALL send
      the generated supplier purchase order to the supplier purchase order queue for
      fulfillment processing.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB.doWork() generates supplier POs and collects them in a list, then
      passes them to doTransition() which calls the OrderApprovalTD transition delegate. The
      transition delegate (referenced via JNDI configuration) is responsible for sending to the
      supplier queue. The resource reference is declared in ejb-jar.xml (SupplierPurchaseOrderQueue).
    risk_class: operational
    basis: >
      OrderApprovalMDB collects supplier POs in the supplierPoList ArrayList and passes
      them to doTransition(supplierPoList, xmlMailOrderApprovals). The OrderApprovalTD
      transition delegate is instantiated via TransitionDelegateFactory using a class name
      from environment entry JNDINames.TRANSITION_DELEGATE_ORDER_APPROVAL, then setup()
      and doTransition() are called to handle message transmission.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 185
        line_end: 240
        excerpt: |
          private WorkResult doWork(String xmlMessage) throws XMLDocumentException, FinderException {
            ArrayList supplierPoList = new ArrayList();
            ...
            while(...) {
              if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
                po = poHome.findByPrimaryKey(co.getOrderId());
                String xmlPO = getXmlPO(po, supplierOrderXDE);
                supplierPoList.add(xmlPO);
              }
            }
            return new WorkResult(xmlMailOrderApprovals, supplierPoList);
          }
          ...
          private void doTransition(Collection supplierPoList, String xmlMailOrderApprovals) throws TransitionException {
            TransitionInfo info = new TransitionInfo(xmlMailOrderApprovals, supplierPoList);
            transitionDelegate.doTransition(info);
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      jms.queue: SupplierPurchaseOrderQueue

  # Inventory & Fulfillment - Invoice processing and status tracking
  - record_key: IF-C-0001
    kind: requirement
    capability_key: inventory-fulfillment
    requirement: >
      The system SHALL receive invoices from suppliers via JMS Topic, update line item
      shipment status in the purchase order, and update the order fulfillment status to
      SHIPPED_PART if some items remain unshipped, or COMPLETED if all items have been
      shipped.
    confidence: high
    confidence_basis: >
      InvoiceMDB.doWork() receives invoice XML, calls PurchaseOrderHelper.processInvoice()
      to update line items and determine completion status, then updates ProcessManager
      status based on the completion flag. Both the partial and complete paths are explicitly
      implemented with clear conditional logic. The transaction type is Required.
    risk_class: operational
    basis: >
      InvoiceMDB receives TextMessage from JMS Topic (SupplierInvoiceTopic), calls
      invoiceXDE.setDocument(xmlInvoice) to parse, retrieves the PurchaseOrder, calls
      poHelper.processInvoice() which returns a boolean orderDone flag. If orderDone is true,
      status is updated to COMPLETED and completedOrder is returned for transition. If false,
      status is updated to SHIPPED_PART.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 173
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());

            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
            return completedOrder;
          }
    stack_metadata:
      ejb.bean: InvoiceMDB
      jms.topic: SupplierInvoiceTopic
      ejb.transaction: Required

  # Notification & Messaging - Invoice shipment notifications
