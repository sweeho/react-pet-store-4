      The threshold 50000 is a hardcoded bare literal with no surrounding comment or
      configuration mechanism. The currency assumption (JPY) is inferred from locale but
      not explicitly stated in code. Magnitude and currency units are undocumented. Risk:
      unclear whether this is production rule or demo value, and currency conversion is
      not visible.
    risk_class: financial
    basis: >
      PurchaseOrderMDB.canIApprove() checks locale.equals(Locale.JAPAN) and
      purchaseOrder.getTotalPrice() < 50000. If both are true, auto-approval proceeds.
      The number and currency unit are bare literals.
