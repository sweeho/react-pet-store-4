    requirement: >
      The system SHALL support sending email notifications to customers when invoices are
      received from suppliers, controlled by a sendConfirmationMail boolean configuration
      parameter.
    confidence: high
    confidence_basis: >
      MailInvoiceMDB is declared in ejb-jar.xml as a message-driven bean with container-managed
      transactions (Required). The configuration parameter SendConfirmationMail is declared
      as an environment entry (lines 414-418). The onMessage() method checks this flag before
      processing and sending mail, making the implementation explicit and verifiable.
    risk_class: operational
    basis: >
      MailInvoiceMDB listens to SupplierInvoiceTopic (JMS Topic destination). In onMessage(),
      the sendConfirmationMail flag is checked (retrieved from ServiceLocator). Only if true,
      doWork() is called to generate mail content via mailContentXDE, and doTransition() sends
      it to the mail queue.
