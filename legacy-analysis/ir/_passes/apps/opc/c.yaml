  # Order Approval - Core workflow entry
  - record_key: OA-C-0001
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL receive purchase orders from the Java Pet Store via JMS queue,
      parse the XML content, create a PurchaseOrder EJB, and initialize the order
      fulfillment workflow in PENDING status.
    confidence: high
    confidence_basis: >
      PurchaseOrderMDB.doWork() and onMessage() explicitly implement this sequence with
      no conditional logic. The transaction type is declaratively Required in ejb-jar.xml,
      ensuring ACID semantics. Both code and declarative configuration are present.
    risk_class: operational
    basis: >
      PurchaseOrderMDB receives TextMessage from JMS queue, calls PurchaseOrder.fromXML()
      with validation flag, creates PurchaseOrder EJB via poHome.create(), and initializes
      ProcessManager workflow with OrderStatusNames.PENDING. Transition delegate sends
      auto-approval messages downstream if applicable.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 114
        line_end: 136
        excerpt: |
          public void onMessage(Message recvMsg) {
            TextMessage recdTM = null;
            String recdText = null;
            String approval = null;
            try {
              recdTM = (TextMessage)recvMsg;
              recdText = recdTM.getText();
              approval = doWork(recdText);
              if(approval != null) {
                doTransition(approval);
              }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 151
        line_end: 165
        excerpt: |
          private String doWork(String xmlMessage) throws XMLDocumentException, CreateException {
            String ret = null;
            PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
            poHome.create(purchaseOrder);
            processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
            if(canIApprove(purchaseOrder)) {
              ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);
              OrderApproval oa = new OrderApproval();
              oa.addOrder(co);
              ret = oa.toXML();
            }
            return ret;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      jms.queue: PurchaseOrderQueue
      ejb.transaction: Required

  # Order Approval - Auto-approval threshold (US)
  - record_key: OA-C-0002
    kind: requirement
    capability_key: order-approval
    requirement: >
      Orders from US locale with total price less than 500 USD SHALL be automatically
      approved during purchase order receipt processing.
    confidence: medium
    confidence_basis: >
      The threshold 500 is a hardcoded bare literal in the canIApprove() method with no
      configuration, test, or comment explaining its business justification. The code path
      is reachable and deterministic, but the meaning of the bare number is unclear. Risk:
      this value may be demo-only or production-critical; distinction is not documented.
    risk_class: financial
    basis: >
      PurchaseOrderMDB.canIApprove() checks locale.equals(Locale.US) and
      purchaseOrder.getTotalPrice() < 500. If both conditions are true, an OrderApproval
      XML message is generated and sent to the OrderApprovalQueue via doTransition().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB

  # Order Approval - Auto-approval threshold (Japan)
