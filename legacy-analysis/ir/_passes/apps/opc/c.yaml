findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
    description: >
      The auto-approval thresholds (500 for US locale, 50000 for Japan locale) are bare
      literal numbers with no surrounding comment, configuration mechanism, or test. The
      comment on line 179 says "Just a stub for converting currency" and "demonstrating
      the petstore", suggesting these may be demo values. However, it is unclear whether
      these represent actual production business rules or are intentionally approximate.
      Additionally, the Japan threshold has no explicit currency designation (assumed JPY
      but not stated). A human should confirm the business intent and production values.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
    description: >
      The logic determining order completion (orderDone boolean flag returned by
      PurchaseOrderHelper.processInvoice()) is not visible in InvoiceMDB. The helper method
      is in a separate module (purchaseorder component). It is unclear whether an order is
      complete only when all line items are shipped by quantity, or if partial invoices
      with all quantities can mark completion. This logic is critical to the fulfillment
      workflow state machine but cannot be verified from OPC module code alone.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
    description: >
      Multiple XML validation configuration flags are declared (param/xml/validation/PurchaseOrder,
      Invoice, OrderApproval; param/xml/XSDValidation) in different MDBs. It is unclear whether
      these validation toggles are independent, mutually exclusive, or have precedence rules. Also
      unclear whether validation failures cause message rejection (rollback) or silent degradation
      (log and continue). The redacted environment entry values prevent verification of the current
      state.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
    description: >
      In the getChartInfo() method, when category is null, the method aggregates by category ID
      (for both REVENUE and ORDERS requests). When category is specified, it aggregates by item ID.
      However, the scope of "category" filtering (whether it pre-filters before aggregation or
      filters line items after retrieval) is not explicit in the visible code. Additionally, the
      exact calculation for REVENUE (quantity * unitPrice) uses no rounding or precision
      specification, which could lead to floating-point precision issues in financial calculations.
