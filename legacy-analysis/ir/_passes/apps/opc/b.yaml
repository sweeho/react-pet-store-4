  - record_key: inventory-fulfillment-req-0002
    kind: requirement
    capability_key: inventory-fulfillment
    requirement: >
      The system SHALL track invoice updates from suppliers, updating line item shipment
      status for partial fulfillment, and transitioning orders to SHIPPED_PART status
      when some but not all items have been shipped.
    confidence: high
    confidence_basis: >
      Implemented in InvoiceMDB with explicit status branching: order is marked
      SHIPPED_PART unless all items are shipped (orderDone flag). Confirmed in both
      doWork() logic and status update calls.
    risk_class: operational
    basis: >
      InvoiceMDB receives invoice from supplier, calls PurchaseOrderHelper.processInvoice()
      which updates line item shipment states, returns boolean orderDone flag. If false,
      ProcessManager.updateStatus() is called with OrderStatusNames.SHIPPED_PART.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 173
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());

            //update process manager if this order is completely done, or partially done
            //for this purchase order
            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
            return completedOrder;
          }
    stack_metadata:
      ejb.bean: InvoiceMDB
      jms.topic: SupplierInvoiceTopic
      ejb.transaction: Required

  - record_key: inventory-fulfillment-req-0003
    kind: requirement
    capability_key: inventory-fulfillment
    requirement: >
      When all ordered items have been shipped per invoice updates, the system SHALL
      mark the order as COMPLETED and initiate customer notification workflow.
    confidence: high
    confidence_basis: >
      Implemented in InvoiceMDB with explicit completion detection: PurchaseOrderHelper
      .processInvoice() returns orderDone=true when all line items shipped. Completion
      status change and notification transition are paired in same transaction.
    risk_class: operational
    basis: >
      InvoiceMDB receives invoice, processes it to update line items, detects completion
      when all items shipped (orderDone=true), updates status to COMPLETED, and calls
      doTransition() to send completion message to customer relations.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 183
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());

            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
            return completedOrder;
          }

          private void doTransition(String completedOrder) throws TransitionException {
              TransitionInfo info = new TransitionInfo(completedOrder);
              transitionDelegate.doTransition(info);
          }
    stack_metadata:
      ejb.bean: InvoiceMDB
      jms.topic: SupplierInvoiceTopic
      ejb.transaction: Required

