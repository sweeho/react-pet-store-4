  - record_key: order-approval-req-0003
    kind: requirement
    capability_key: order-approval
    requirement: >
      Orders not meeting automatic approval criteria SHALL be placed in PENDING status
      and await administrator approval or denial.
    confidence: high
    confidence_basis: >
      Implemented in two independent locations: PurchaseOrderMDB initializes order
      in PENDING status, and OrderApprovalMDB only processes orders currently in
      PENDING status. Consistent across configuration and code.
    risk_class: operational
    basis: >
      PurchaseOrderMDB.doWork() always calls processManager.createManager() with
      OrderStatusNames.PENDING. OrderApprovalMDB.doWork() explicitly checks that
      only orders with PENDING status are processed for approval/denial.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 151
        line_end: 165
        excerpt: |
          private String doWork(String xmlMessage) throws XMLDocumentException, CreateException {
            String ret = null;
            PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
            poHome.create(purchaseOrder);
            //update process manager to start workflow for this purchase order
            processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);

            if(canIApprove(purchaseOrder)) {
              ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);
              OrderApproval oa = new OrderApproval();
              oa.addOrder(co);
              ret = oa.toXML();
            }
            return ret;
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 224
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            //if order alreay APPROVED or DENIED or COMPLETED, then order
            //already processed so dont process again
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      jms.queue: PurchaseOrderQueue
      ejb.transaction: Required

  - record_key: order-approval-req-0004
    kind: requirement
    capability_key: order-approval
    requirement: >
      Administrator approval decisions SHALL update the order status to either APPROVED
      or DENIED, preventing reprocessing of orders already in terminal approval state.
    confidence: high
    confidence_basis: >
      Implemented in OrderApprovalMDB with explicit guard conditions checking current
      status before processing. Status update occurs via processManager.updateStatus()
      called within a single transactional onMessage() handler.
    risk_class: operational
    basis: >
      OrderApprovalMDB.doWork() processes each order approval in the message, retrieves
      current status, and only processes if status equals PENDING. For each approved
      order, processManager.updateStatus() is called with the new status.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 224
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
            oaMailList.addOrder(co);
            processManager.updateStatus(co.getOrderId(), co.getOrderStatus());

            //for all approved orders, send a PO to supplier
            if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
              po = poHome.findByPrimaryKey(co.getOrderId());
              String xmlPO = getXmlPO(po, supplierOrderXDE);
              supplierPoList.add(xmlPO);
            }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      jms.queue: OrderApprovalQueue
      ejb.transaction: Required

