records:
  # Order Management - Admin retrieval capability
  - record_key: order-management-req-0001
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL retrieve orders by their current status, returning a collection
      of orders with order ID, user ID, date, value, and status.
    confidence: high
    confidence_basis: >
      Implemented in OPCAdminFacadeEJB.getOrdersByStatus() and explicitly referenced
      in both Java code and ejb-jar.xml configuration. Method is declared as a
      transactional business operation with container-managed transactions.
    risk_class: operational
    basis: >
      OPCAdminFacadeEJB queries PurchaseOrderLocalHome to find orders matching status
      via ProcessManager.getOrdersByStatus(), then retrieves full PurchaseOrder details
      for each matching order.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 131
        line_end: 157
        excerpt: |
          public OrdersTO getOrdersByStatus(String status)
                                                        throws OPCAdminFacadeException {
              OrdersTO.MutableOrdersTO retVal = new OrdersTO.MutableOrdersTO();
              PurchaseOrderLocal po;
              ProcessManagerLocal mgr = getProcMgr();

              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection orders = mgr.getOrdersByStatus(status);
                  Iterator it = orders.iterator();
                  while((it!= null) && (it.hasNext())) {
                      ManagerLocal mgrEjb = (ManagerLocal) it.next();
                      po = pohome.findByPrimaryKey(mgrEjb.getOrderId());
                      Date gotDate = new Date(po.getPoDate());
                      String podate = (gotDate.getMonth()+1) + "/" +
                          gotDate.getDate() + "/" + (gotDate.getYear()+1900);
                      retVal.add(new OrderDetails(po.getPoId(), po.getPoUserId(),
                                                  podate, po.getPoValue(), status));
                  }
              }
    stack_metadata:
      ejb.bean: OPCAdminFacadeEJB
      ejb.transaction: Required

  - record_key: order-management-req-0002
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL support querying order and revenue data by date range and category,
      calculating totals by aggregating line item quantities and unit prices, with
      optional filtering by specific category.
    confidence: high
    confidence_basis: >
      Implemented in OPCAdminFacadeEJB.getChartInfo() with complete logic for both
      REVENUE and ORDERS aggregation. Method is declared as transactional business
      operation with explicit container transaction control.
    risk_class: operational
    basis: >
      getChartInfo() retrieves PurchaseOrders between start and end dates, iterates
      through line items, and aggregates either revenue (quantity * unit price) or
      quantity by category or item.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 169
        line_end: 256
        excerpt: |
          public Map getChartInfo(String request,
                                  Date start,
                                  Date end,
                                  String categ)
              throws OPCAdminFacadeException {
              String id;
              Float tmpValue;
              Integer tmpQty;
              PurchaseOrderLocal po;

              Map chartDetails = new HashMap();

              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection poColl =
                      pohome.findPOBetweenDates(start.getTime(), end.getTime());

                  Iterator it = poColl.iterator();
                  while((it!= null) && (it.hasNext())) {
                      po = (PurchaseOrderLocal) it.next();
                      Collection liColl = po.getAllItems();
                      Iterator lit = liColl.iterator();
                      while((lit!=null) && (lit.hasNext())) {
                          LineItem loc = (LineItem) lit.next();
                          if(request.equals("REVENUE")) {
                              if(categ == null) {
                                  id = loc.getCategoryId();
                                  if(chartDetails.containsKey(id)) {
                                      tmpValue = (Float) chartDetails.get(id);
                                      chartDetails.put(id,
                                           new Float(tmpValue.floatValue() +
                                           (loc.getQuantity()*loc.getUnitPrice())));
                                  } else {
                                      chartDetails.put(id, new Float((loc.getQuantity()*
                                                              loc.getUnitPrice())));
                                  }
    stack_metadata:
      ejb.bean: OPCAdminFacadeEJB
      ejb.transaction: Required

  # Order Approval - automatic approval for small orders
  - record_key: order-approval-req-0001
    kind: requirement
    capability_key: order-approval
    requirement: >
      Orders from US locale with total price less than 500 USD SHALL be automatically
      approved during purchase order processing.
    confidence: medium
    confidence_basis: >
      Implemented in hardcoded thresholds in PurchaseOrderMDB.canIApprove() with
      single source point. No configuration or test found to validate this specific
      threshold; marked medium confidence due to bare literal threshold.
    risk_class: financial
    basis: >
      PurchaseOrderMDB.canIApprove() contains locale-specific threshold check.
      When order is received, if locale is US and totalPrice < 500, order is
      automatically approved and OrderApproval message is generated.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      jms.queue: PurchaseOrderQueue

