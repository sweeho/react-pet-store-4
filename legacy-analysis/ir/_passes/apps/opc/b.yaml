findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
    description: >
      The auto-approval thresholds (500 USD for US, 50000 for Japan) are hardcoded
      bare literals with no surrounding comment or configuration mechanism. It is
      ambiguous whether these represent intentional business policy (e.g., currency is
      JPY for Japan threshold) or approximate demo values. No test or documentation
      confirms the interpretation of the Japan threshold units.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
    description: >
      The logic determining order completion (orderDone flag returned from
      PurchaseOrderHelper.processInvoice()) is not visible in the extracted code.
      It is unclear whether an order is considered complete only when all line items
      are shipped, or whether partial invoices with all quantities can mark completion.
      The helper method implementation is in a separate module.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
    description: >
      Multiple XML validation flags are present (param/xml/validation/*,
      param/xml/XSDValidation) for PurchaseOrder, Invoice, and OrderApproval messages.
      It is unclear whether these are independent toggles or mutually exclusive, and
      whether validation failures cause message rejection or silent degradation.
