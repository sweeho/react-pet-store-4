  # Order Management Capabilities
  - record_key: ORDM-REQ-0001
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL create a purchase order with a unique order ID, associated user ID,
      order date, billing address, shipping address, credit card, and line items.
    confidence: high
    confidence_basis: >
      OrderEJBAction creates PurchaseOrder object and populates: orderId (from UniqueIdGenerator),
      userId (from facade), orderDate (new Date()), shippingInfo (ContactInfo), billingInfo
      (ContactInfo), creditCard (CreditCard). Line items added from cart items with quantity and cost.
    risk_class: financial
    basis: >
      OrderEJBAction lines 92-144 show purchase order creation and field population.
      Unique ID generation from UniqueIdGenerator.create() with seed "1001".
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 90
        line_end: 145
        excerpt: |
          OrderEvent oe = (OrderEvent)e;
          PurchaseOrder purchaseOrder = new PurchaseOrder();
          ContactInfo billTo = oe.getBillTo();
          ContactInfo shipTo = oe.getShipTo();
          CreditCard creditCard = oe.getCreditCard();
          ...
          orderIdString = uidgen.getUniqueId("1001");
          String userId = scf.getUserId();
          purchaseOrder.setOrderId(orderIdString);
          purchaseOrder.setUserId(userId);
          purchaseOrder.setEmailId(billTo.getEmail());
          purchaseOrder.setOrderDate(new Date());
          purchaseOrder.setShippingInfo(shipTo);
          purchaseOrder.setBillingInfo(billTo);
          purchaseOrder.setCreditCard(creditCard);
          ...
          purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                 item.getProductId(),
                                                 item.getItemId(),
                                                 (lineItemCount++) + "",
                                                 item.getQuantity(),
                                                 cost));

  - record_key: ORDM-REQ-0002
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL calculate the total order price by summing unit cost multiplied by
      quantity for each line item.
    confidence: high
    confidence_basis: >
      OrderEJBAction lines 137-138 show totalCost accumulation by multiplying item.getUnitCost()
      by item.getQuantity() and summing. totalCost set on purchaseOrder at line 146.
    risk_class: financial
    basis: >
      OrderEJBAction calculation logic directly visible in code with explicit multiplication
      and addition of line item costs.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 137
        line_end: 146
        excerpt: |
          float cost = new Float(item.getUnitCost()).floatValue();
          totalCost += (cost*item.getQuantity());
          purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                 item.getProductId(),
                                                 item.getItemId(),
                                                 (lineItemCount++) + "",
                                                 item.getQuantity(),
                                                 cost));
          ...
