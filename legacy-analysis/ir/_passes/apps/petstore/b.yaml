  # Checkout & Payment Capabilities
  - record_key: CKPT-REQ-0001
    kind: requirement
    capability_key: checkout-payment
    requirement: >
      The system SHALL validate that the shopping cart contains at least one item before
      allowing order placement, and reject orders with empty carts.
    confidence: high
    confidence_basis: >
      OrderEJBAction line 130 checks if items.size() == 0 and throws ShoppingCartEmptyOrderException.
      Exception mapped in mappings.xml line 110 to cart_empty_order_error.screen.
    risk_class: operational
    basis: >
      OrderEJBAction lines 128-132 perform empty cart validation. exception-mapping in mappings.xml
      shows dedicated error screen for this condition.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 128
        line_end: 132
        excerpt: |
          Collection items = cart.getItems();
          // if the cart is empty throw an exception saying so
          if (items.size() == 0) {
              throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 110
        line_end: 110
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>

