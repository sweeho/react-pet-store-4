  - record_key: CART-REQ-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support updating quantities for multiple items in the shopping cart
      atomically in a single transaction.
    confidence: high
    confidence_basis: >
      CartEvent.UPDATE_ITEMS action accepts HashMap of itemId -> quantity pairs.
      CartEJBAction.perform() iterates through items and calls updateItemQuantity() for each.
      EJB has Required transaction attribute for processEvent() method.
    risk_class: financial
    basis: >
      CartEvent lines 59 and 127-130 show UPDATE_ITEMS with HashMap. CartEJBAction lines 78-87
      show iteration and updateItemQuantity() calls. ejb-jar.xml lines 237-242 show processEvent
      with Required transaction.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/events/CartEvent.java
        line_start: 59
        line_end: 130
        excerpt: |
          public static final int UPDATE_ITEMS = 3;
          public CartEvent(int actionType, HashMap items) {
              this.actionType = actionType;
              this.items = items;
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 78
        line_end: 87
        excerpt: |
          case  CartEvent.UPDATE_ITEMS : {
              Map items = ce.getItems();
              Iterator it = null;
              if (items != null) it = items.keySet().iterator();
              while ((it != null) && it.hasNext()) {
                  String itemId = (String)it.next();
                  int quantity = ((Integer)items.get(itemId)).intValue();
                  cart.updateItemQuantity(itemId, quantity);
              }

