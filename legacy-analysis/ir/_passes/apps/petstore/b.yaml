records:
  # Product Catalog Capabilities
  - record_key: PROD-REQ-0001
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL retrieve and display product categories localized for the selected locale
      (en_US, ja_JP, or zh_CN), sorted alphabetically by name.
    confidence: high
    confidence_basis: >
      GET_CATEGORIES SQL statement directly queries category_details table with locale parameter.
      TemplateServlet configured with explicit locale list (en_US, ja_JP, zh_CN). Multiple locale-specific
      JSP files present (ja/, zh/ subdirectories).
    risk_class: operational
    basis: >
      CatalogDAOSQL.xml GET_CATEGORIES method joins category and category_details tables on
      locale parameter. Web.xml TemplateServlet lists supported locales. JSPs in ja/ and zh/
      subdirectories confirm implementation.
    traces:
      - path: legacy-source/petstore1.3.2/src/docroot/CatalogDAOSQL.xml
        line_start: 71
        line_end: 76
        excerpt: |
          <SQLStatement method="GET_CATEGORIES">
              <SQLFragment parameterNb="1">
                  select a.catid, name, descn
                      from (category a join category_details b on a.catid=b.catid)
                      where locale = ?  order by name
              </SQLFragment>
          </SQLStatement>
      - path: legacy-source/petstore1.3.2/src/docroot/WEB-INF/web.xml
        line_start: 109
        line_end: 111
        excerpt: |
          <init-param>
              <param-name>locales</param-name>
              <param-value>en_US,ja_JP,zh_CN</param-value>
          </init-param>

  - record_key: PROD-REQ-0002
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL retrieve products within a category by category ID and display them
      in a paginated list with configurable page size.
    confidence: high
    confidence_basis: >
      product.jsp uses CatalogHelper bean with start and count properties for pagination.
      GET_PRODUCT SQL statement in DAOConfiguration file. Test default shows 2 items per page.
    risk_class: operational
    basis: >
      product.jsp lines 66-72 show start and count property assignment with default count=2.
      JSP caching directive on line 48 indicates 5-minute cache duration (300000ms).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/product.jsp
        line_start: 65
        line_end: 76
        excerpt: |
          <c:choose>
           <c:when test="${param.count != null}">
              <c:set value="${param.start}" target="${catalog}" property="start"/>
              <c:set value="${param.count}" target="${catalog}" property="count"/>
           </c:when>
           <c:otherwise>
              <c:set value="0" target="${catalog}" property="start"/>
              <c:set value="2" target="${catalog}" property="count"/>

  - record_key: PROD-REQ-0003
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL support searching items by keyword(s) and display matching results
      with pagination, showing items where keywords match product name or description.
    confidence: high
    confidence_basis: >
      search.jsp implements keyword search using CatalogHelper.searchQuery property.
      SEARCH_ITEMS method declared in CatalogDAOSQL.xml. Default page size is 2 items,
      with start/count parameters for pagination.
    risk_class: operational
    basis: >
      search.jsp lines 74-76 show keyword parameter binding. No results message on line 79
      when keywords empty or result size zero. Pagination support visible in lines 137-156.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/search.jsp
        line_start: 63
        line_end: 76
        excerpt: |
          <fmt:setLocale value="en_US" />
          <c:choose>
           <c:when test="${param.count != null}">
              <c:set value="${param.start}" target="${catalog}" property="start"/>
              <c:set value="${param.count}" target="${catalog}" property="count"/>
           </c:when>
           <c:otherwise>
              <c:set value="0" target="${catalog}" property="start"/>
              <c:set value="2" target="${catalog}" property="count"/>
          </c:choose>
          <c:set value="en_US" target="${catalog}" property="locale"/>
          <c:set value="${param.keywords}" target="${catalog}" property="searchQuery"/>
          <c:set value="${catalog.searchItems}" var="pageResults" />

  - record_key: PROD-REQ-0004
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL retrieve and display item details including item ID, category,
      product name, description, unit cost, and item attributes for display.
    confidence: high
    confidence_basis: >
      cart.jsp and search.jsp display item properties: itemId, category, productId, productName,
      description, unitCost, attribute. Currency formatting applied to unitCost via
      fmt:formatNumber tag.
    risk_class: operational
    basis: >
      search.jsp lines 104-116 show item property access. cart.jsp lines 66-87 show similar
      access pattern. fmt tag used for currency formatting on both pages.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/search.jsp
        line_start: 102
        line_end: 116
        excerpt: |
          <c:forEach var="item" items="${pageResults.list}" >
           <tr>
            <td class="petstore_listing">
             <c:url value="/item.screen" var="itemURL">
              <c:param name="item_id" value="${item.itemId}"/>
             </c:url>
             <a href='<c:out value="${itemURL}"/>'>
               <c:out value="${item.attribute}"/>
               <c:out value="${item.productName}"/>
             </a>
             <br>
             <c:out value="${item.description}"/>
            </td>
            <td class="petstore_listing" align="right">
            <fmt:formatNumber value="${item.unitCost}" type="currency" />

  # Shopping Cart Capabilities
  - record_key: CART-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support adding an item to the shopping cart by item ID and default
      quantity of 1.
    confidence: high
    confidence_basis: >
      CartEvent supports ADD_ITEM action with itemId parameter. CartEJBAction.perform() handles
      ADD_ITEM case by calling cart.addItem(). search.jsp line 119 shows cart.do?action=purchase
      URL for adding to cart.
    risk_class: operational
    basis: >
      CartEvent lines 57-93 define ADD_ITEM action with single itemId constructor.
      CartEJBAction lines 68-70 handle ADD_ITEM case. search.jsp line 118-124 shows add to cart link.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/events/CartEvent.java
        line_start: 57
        line_end: 94
        excerpt: |
          public static final int ADD_ITEM = 1;
          public CartEvent(int actionType, String itemId) {
              this.actionType = actionType;
              this.itemId = itemId;
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 68
        line_end: 71
        excerpt: |
          case  CartEvent.ADD_ITEM  : {
              cart.addItem(ce.getItemId());
          }

