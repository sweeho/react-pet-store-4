  - record_key: shopping-cart-requirement-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support updating item quantities in the shopping cart by accepting
      action=update parameter with itemQuantity_<itemId> parameters for each item,
      creating a CartEvent with update quantities map.
    confidence: high
    confidence_basis: >
      Reachable code path from web tier form submission. Quantity parsing and validation present.
    risk_class: operational
    basis: >
      CartHTMLAction processes action=update and iterates through request parameters,
      extracting parameters with prefix "itemQuantity_" and parsing them as Integer quantities.
      Invalid quantities default to zero.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 99
        line_end: 120
        excerpt: |
          else if (actionType.equals("update")) {
            Map quantities = new HashMap();
            Map parameters = request.getParameterMap();
            for (Iterator it = parameters.keySet().iterator();
                 it.hasNext(); ) {
              String name = (String) it.next();
              String value = ((String[]) parameters.get(name))[0];
              final String ITEM_QTY = "itemQuantity_";
              if (name.startsWith(ITEM_QTY)) {
                String itemID = name.substring(ITEM_QTY.length());
                Integer quantity = null;
                try {
                  quantity = new Integer(value);
                }
                catch (NumberFormatException nfe) {
                  quantity = new Integer(0);
                }
                quantities.put(itemID, quantity);

