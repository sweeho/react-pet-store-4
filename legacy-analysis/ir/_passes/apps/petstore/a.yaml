  - record_key: checkout-payment-requirement-0003
    kind: requirement
    capability_key: checkout-payment
    requirement: >
      The system SHALL calculate the total order price by multiplying each line item's
      unitCost by its quantity and summing all line items.
    confidence: medium
    confidence_basis: >
      Calculation is present but no explicit rounding rules or tax/shipping logic found.
      Order of operations is implicit in statement sequence; no tests or configuration found.
    risk_class: financial
    basis: >
      OrderEJBAction iterates through cart items, casts unitCost to float, multiplies by
      quantity, and accumulates in totalCost variable. No tax or shipping applied.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 123
        line_end: 146
        excerpt: |
          int lineItemCount = 0;
          float totalCost = 0;
          Collection items = cart.getItems();
          Iterator it = items.iterator();
          while (it.hasNext()) {
            CartItem item = (CartItem)it.next();
            float cost = new Float(item.getUnitCost()).floatValue();
            totalCost += (cost*item.getQuantity());
            purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                   item.getProductId(),
                                                   item.getItemId(),
                                                   (lineItemCount++) + "",
                                                   item.getQuantity(),
                                                   cost));
          }
          purchaseOrder.setTotalPrice(totalCost);

