  - record_key: ORD-MGT-0001
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL create a purchase order record for each order containing a
      unique order ID, order date, user ID, email address, shipping address, billing
      address, credit card information, and all cart line items with quantities and unit costs.
    confidence: high
    confidence_basis: >
      OrderEJBAction (lines 92-145) demonstrates order creation. A PurchaseOrder object
      is created and populated with all required fields (lines 92-127): orderId,
      orderDate, userId, emailId, shippingInfo, billingInfo, creditCard. Line items
      are added from cart items (lines 134-145). Line item includes category,
      productId, itemId, lineItemCount, quantity, and unit cost. The total price is
      calculated as sum of (cost*quantity) for all items (lines 137-138).
    risk_class: financial
    basis: >
      OrderEJBAction creates PurchaseOrder and sets each field individually. The
      constructor receives shipper (billing), receiver (shipping), and creditCard from
      the OrderEvent. Items are extracted from cart and converted to LineItem objects
      with quantity and cost information.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 110
        line_end: 146
        excerpt: |
          orderIdString = uidgen.getUniqueId("1001");
          // get ther userId
          ShoppingClientFacadeLocal scf = null;
          scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
          String userId = scf.getUserId();
          purchaseOrder.setOrderId(orderIdString);
          purchaseOrder.setUserId(userId);
          purchaseOrder.setEmailId(billTo.getEmail());
          purchaseOrder.setOrderDate(new Date());
          purchaseOrder.setShippingInfo(shipTo);
          purchaseOrder.setBillingInfo(billTo);
          purchaseOrder.setCreditCard(creditCard);
          // Add the items from the shopping cart
          ShoppingCartLocal cart = scf.getShoppingCart();
          Locale locale = (Locale)machine.getAttribute(PetstoreKeys.LOCALE);
          purchaseOrder.setLocale(locale);
          Collection items = cart.getItems();
          Iterator it = items.iterator();
          while (it.hasNext()) {
            CartItem item = (CartItem)it.next();
            float cost = new Float(item.getUnitCost()).floatValue();
            totalCost += (cost*item.getQuantity());
            purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                               item.getProductId(),
                                               item.getItemId(),
                                               (lineItemCount++) + "",
                                               item.getQuantity(),
                                               cost));
          }
          purchaseOrder.setTotalPrice(totalCost);

  - record_key: ORD-MGT-0002
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL generate a unique order ID for each order using a unique ID
      generator service.
    confidence: high
    confidence_basis: >
      OrderEJBAction (lines 98-110) looks up the UniqueIdGeneratorLocalHome service,
      creates an instance, and calls getUniqueId("1001") to obtain orderIdString. This
      is a deterministic pattern used for all orders. The JNDI name is obtained from
      JNDINames.UIDG_EJBHOME constant (line 103).
    risk_class: operational
    basis: >
      OrderEJBAction explicitly retrieves UniqueIdGeneratorLocal EJB via service
      locator and calls getUniqueId("1001") to generate unique order IDs. The "1001"
      appears to be a partition or sequence identifier.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 98
        line_end: 110
        excerpt: |
          // get the UniqueIdGenerator EJB
          UniqueIdGeneratorLocal uidgen = null;
          try {
            ServiceLocator sl = new ServiceLocator();
            UniqueIdGeneratorLocalHome home =
              (UniqueIdGeneratorLocalHome)sl.getLocalHome(JNDINames.UIDG_EJBHOME);
            uidgen = home.create();
          } catch (javax.ejb.CreateException cx) {
            cx.printStackTrace();
          } catch (ServiceLocatorException slx) {
            slx.printStackTrace();
          }
          orderIdString = uidgen.getUniqueId("1001");

  - record_key: ORD-MGT-0003
