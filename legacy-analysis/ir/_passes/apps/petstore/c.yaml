  - record_key: CUST-ACCT-0003
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL authenticate users by username and password upon sign-on and
      associate the authenticated user with the shopping session.
    confidence: high
    confidence_basis: >
      SignOnEJBAction (lines 77-97) demonstrates the authentication flow where the
      username from SignOnEvent is extracted and associated with the shopping facade
      (line 83). The signon.jsp page (lines 53-86) shows the HTML form that collects
      credentials (j_username and j_password fields) and posts to j_signon_check action.
      The ejb-jar.xml method-permission (lines 171-177) confirms ShoppingControllerEJB
      all methods are unchecked, meaning authentication is enforced at filter or
      component level.
    risk_class: operational
    basis: >
      SignOnEJBAction explicitly retrieves userName from SignOnEvent and stores it in
      ShoppingClientFacadeLocal. The signon.jsp form demonstrates the password is
      collected. The SignOnFilter in web.xml (line 64) applies to all URL patterns (/*),
      confirming authentication is a global requirement.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java
        line_start: 77
        line_end: 83
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
            SignOnEvent cue = (SignOnEvent)e;
            String userId = cue.getUserName();
            // put a copy of the userName in the shopping client facade for future retrival
             ShoppingClientFacadeLocal scf = null;
             scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
             scf.setUserId(userId);
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/signon.jsp
        line_start: 64
        line_end: 86
        excerpt: |
          <td class="petstore_form">
          <c:choose>
          <c:when  test="${cookie['bp_signon'] != null && cookie['bp_signon'] !=''}">
           <waf:input cssClass="petstore_form"
                                 type="text"
                                  size="15"
                               name="j_username"
                        validation="validation">
           <waf:value><c:out value="${cookie['bp_signon'].value}"/></waf:value>
          </waf:input>
          </td>
          </tr>
          <tr>
           <td class="petstore_form" align="right">
            <b>Password:</b>
           </td>
           <td class="petstore_form">
             <waf:input cssClass="petstore_form"
                             type="password"
                              size="15"
                            name="j_password"
                     validation="validation"
                             value=""/>

  - record_key: CUST-ACCT-0004
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL retrieve and apply the user's preferred language (locale) upon
      successful sign-on and make it available to all components including the shopping
      cart.
    confidence: high
    confidence_basis: >
      SignOnEJBAction (lines 85-95) explicitly retrieves the profile and preferred
      language, converts it to a Locale object, stores it in machine attributes, and
      applies it to the shopping cart. This is enforced for authenticated users. The
      supported locales are declared in web.xml (line 110): en_US, ja_JP, zh_CN.
    risk_class: presentational
    basis: >
      SignOnEJBAction retrieves profile.getPreferredLanguage() and converts it using
      I18nUtil.getLocaleFromString(). The locale is then stored as machine attribute
      and propagated to cart.setLocale(locale). This pattern is also used in
      CustomerEJBAction (line 143) when updating customer profile.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java
        line_start: 85
        line_end: 91
        excerpt: |
          try {
             ProfileLocal profile = scf.getCustomer().getProfile();
             Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());
             machine.setAttribute(PetstoreKeys.LOCALE, locale);
              // notify the shopping cart of the locale change
             ShoppingCartLocal cart = scf.getShoppingCart();
             cart.setLocale(locale);
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 108
        line_end: 111
        excerpt: |
          <init-param>
             <param-name>locales</param-name>
             <param-value>en_US,ja_JP,zh_CN</param-value>
          </init-param>

  - record_key: CUST-ACCT-0005
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL allow customers to update their profile information including
      preferred language, favorite category, my list preference, and banner preference.
    confidence: high
    confidence_basis: >
      CustomerEJBAction (lines 136-141) demonstrates explicit setting of all four
      profile preferences via ProfileLocal EJB entity. The updateCustomer method is
      called from two actions: CREATE (line 87) and UPDATE (line 91), showing this is
      a primary customer operation. The ejb-jar.xml confirms these methods use Required
      transaction attribute (lines 213-223).
    risk_class: operational
    basis: >
      CustomerEJBAction retrieves the customer's profile and sets each preference field
      individually. The code shows setPreferredLanguage, setFavoriteCategory,
      setMyListPreference, and setBannerPreference are all supported operations on the
      ProfileLocal entity.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CustomerEJBAction.java
        line_start: 136
        line_end: 141
        excerpt: |
          ProfileInfo profileInfo = ce.getProfileInfo();
          ProfileLocal profileLocal = customer.getProfile();
          profileLocal.setPreferredLanguage(profileInfo.getPreferredLanguage());
          profileLocal.setFavoriteCategory(profileInfo.getFavoriteCategory());
          profileLocal.setMyListPreference(profileInfo.getMyListPreference());
          profileLocal.setBannerPreference(profileInfo.getBannerPreference());

