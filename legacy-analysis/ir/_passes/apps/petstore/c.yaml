  - record_key: CUST-ACCT-0001
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL create a new user account when provided a username and password
      during user registration.
    confidence: high
    confidence_basis: >
      The CreateUserEJBAction demonstrates this requirement at lines 94-101 where it
      explicitly calls signOn.createUser(userName, password), and the exception handling
      at line 99 throws DuplicateAccountException for CreateException, confirming account
      creation is enforced. Both ejb-jar.xml (lines 206-211) and the EJB class confirm
      this through the createUser method with Required transaction attribute.
    risk_class: operational
    basis: >
      CreateUserEJBAction demonstrates direct invocation of SignOn EJB to create user
      accounts. The SignOn service is referenced throughout the application for user
      management, and CreateException handling confirms the constraint is enforced.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CreateUserEJBAction.java
        line_start: 93
        line_end: 101
        excerpt: |
          try {
             signOn.createUser(userName, password);
             // put a copy of the userName in the statemachine atttirbute table for future retrival
             ShoppingClientFacadeLocal scf = null;
             scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
             scf.setUserId(userName);
        } catch (CreateException ce) {
            throw new DuplicateAccountException("Bad UserName or password");

