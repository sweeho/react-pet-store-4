      The system SHALL allow customers to update quantities of items already in their
      shopping cart by item ID and quantity.
    confidence: high
    confidence_basis: >
      CartEJBAction (lines 78-88) explicitly handles UPDATE_ITEMS action and iterates
      over a Map of item IDs to Integer quantities. For each item, it calls
      cart.updateItemQuantity(itemId, quantity). The Map is populated from the request
      by CartHTMLAction, showing this is a standard cart update operation.
    risk_class: operational
