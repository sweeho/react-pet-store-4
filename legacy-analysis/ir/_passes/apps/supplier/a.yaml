  - record_key: SI-REQ-0012
    kind: requirement
    capability_key: inventory-fulfillment
    requirement: >
      The supplier system SHALL allow authorized users to update inventory
      quantities via the web application for specific items by entering new
      quantity values and selecting items to update.
    confidence: high
    confidence_basis: >
      The RcvrRequestProcessor.updateInventory method directly implements this.
      It parses request parameters starting with "item_", extracts the item ID,
      retrieves the corresponding "qty_" parameter for the new quantity, and updates
      the inventory quantity if it is a non-negative integer. The inventory is
      updated only for items where the checkbox was submitted.
    risk_class: operational
    basis: >
      The RcvrRequestProcessor.updateInventory method:
      - Iterates through all request parameter names
      - Filters for parameters starting with "item_"
      - Extracts itemId from the parameter name
      - Retrieves the new quantity from "qty_" + itemId parameter
      - Validates the quantity is a non-negative integer (qty.intValue() >= 0)
      - Finds the InventoryLocal by itemId
      - Calls inventory.setQuantity(qty.intValue())
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 110
        line_end: 137
        excerpt: |
          private void updateInventory(HttpServletRequest req) {
            String itemId;
            InventoryLocal inventory;
            try {
              Enumeration e = req.getParameterNames();
              while ((e != null) && e.hasMoreElements()) {
                String param = ((String)e.nextElement()).trim();
                if ((param != null) && param.startsWith("item_")) {
                  // get the item id number from the parameter
                  itemId = param.substring("item_".length(),param.length());
                  if(itemId != null) {
                    String newQty = req.getParameter("qty_" + itemId);
                    if((newQty == null) || (newQty.length() <= 0))
                      continue;
                    Integer qty = new Integer(newQty);
                    if(qty.intValue() >= 0 ) {
                      inventory = inventoryHomeRef.findByPrimaryKey(itemId);
                      inventory.setQuantity(qty.intValue());
                    }
                  }
                }
              }
            } catch (FinderException ne) {
              ne.printStackTrace();
            }
    stack_metadata:
      jsp.page: displayinventory.jsp
      servlet: RcvrRequestProcessor

