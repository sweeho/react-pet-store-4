  - record_key: SI-WORKFLOW-0002
    kind: workflow
    capability_key: supplier-integration
    requirement: >
      When a purchase order is received via JMS Queue, the supplier system
      SHALL process the order by checking inventory availability, reducing
      inventory quantities for items that can be fulfilled, and generating
      an invoice for any items shipped.
    confidence: high
    confidence_basis: >
      The workflow is explicitly implemented across multiple methods in the
      OrderFulfillmentFacadeEJB with clear logic flow: processPO validates
      and persists the order, processAnOrder checks inventory and updates
      quantities, and createInvoice generates the invoice. The checkInventory
      method performs the actual quantity reduction. All are directly traceable
      in the source code.
    risk_class: financial
    basis: >
      The SupplierOrderMDB.onMessage calls doWork which invokes poProcessor.processPO.
      OrderFulfillmentFacadeEJB.processPO converts XML to SupplierOrder object,
      persists it, then calls processAnOrder. processAnOrder iterates through
      line items, calls checkInventory for each item. checkInventory finds the
      Inventory entity and calls reduceQuantity(item.getQuantity()) if sufficient
      stock exists. createInvoice builds the invoice XML with shipped items.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 237
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;
            // Convert Po in XML to PO as Java Obj
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            //persist order
            order = supplierOrderLocalHome.create(supplierOrder);
            //fullfil order
            invoiceXml = processAnOrder(order);
            return invoiceXml;
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
              if(invoiceReqd) {
                invoiceXml = (createInvoice(po, items));
              }
              return invoiceXml;
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              // swallow the finder exception because this means
              // supplier has not been populated; So we cant fulfill
              // this part of the order now
              return(false);
            }
            return(true);
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required

