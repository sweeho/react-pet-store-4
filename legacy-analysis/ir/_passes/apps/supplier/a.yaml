      The ejb-jar.xml declares InventoryEJB as an entity bean with persistence-type
      of Container, prim-key-class java.lang.String (the itemId), and two CMP fields:
      itemId and quantity. The InventoryEJB.reduceQuantity method retrieves current
      quantity, subtracts the reduction amount, and calls setQuantity. The
      checkInventory method finds the inventory record and calls reduceQuantity.
