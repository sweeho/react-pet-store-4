    requirement: >
      The supplier system SHALL maintain inventory records with an item ID
      and quantity available for each item. Inventory quantities SHALL be
      reduced when orders are fulfilled.
    confidence: high
    confidence_basis: >
      The InventoryEJB is a Container-Managed Persistence (CMP) entity bean
      with two abstract fields: itemId (String) and quantity (int). The entity
      is created with both values and persisted by the container. The reduceQuantity
      method is explicitly called during order fulfillment. The efb-jar.xml declares
      the persistence type as Container.
    risk_class: operational
