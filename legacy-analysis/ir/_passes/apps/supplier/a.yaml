      - Calls ut.begin() to start the transaction
      - Calls updateInventory(req) to modify inventory
      - Calls procPO.processPendingPO() to fulfill orders
      - Calls sendInvoices(invoices) to publish invoices
      - Calls ut.commit() to commit the transaction
      The OrderFulfillmentFacadeEJB processPendingPO method is configured with
      container-managed transaction type and trans-attribute Required in ejb-jar.xml
