  - record_key: SI-REQ-0001
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The supplier system SHALL receive purchase orders from the OPC component
      via JMS Queue messaging as XML documents.
    confidence: high
    confidence_basis: >
      The SupplierOrderMDB is explicitly configured as a message-driven bean
      listening to a JMS Queue in ejb-jar.xml. The onMessage method receives
      TextMessage containing XML purchase orders. The code directly accesses
      message content and passes it to the processing facade.
    risk_class: operational
    basis: >
      The ejb-jar.xml declares SupplierOrderMDB as a message-driven bean with
      message-driven-destination of type javax.jms.Queue. The SupplierOrderMDB.onMessage
      method receives Message parameter containing the purchase order XML.
      The OrderFulfillmentFacadeEJB.processPO method accepts a String parameter
      for the XML document.
