  - record_key: SI-BR-0005
    kind: business-rule
    capability_key: inventory-fulfillment
    requirement: >
      When fulfilling an order, the inventory quantity for an item SHALL only
      be reduced if the available quantity is greater than or equal to the
      requested quantity.
    confidence: high
    confidence_basis: >
      The checkInventory method explicitly performs a numeric comparison:
      if(inv.getQuantity() < item.getQuantity()) return(false). Only if this
      condition is false (meaning available >= requested) does the method
      proceed to call reduceQuantity. This guard is enforced in code.
    risk_class: financial
    basis: >
      The OrderFulfillmentFacadeEJB.checkInventory method retrieves the
      InventoryLocal object and compares its quantity to the line item quantity.
      The reduceQuantity operation only executes if the condition inv.getQuantity() >= item.getQuantity()
      is true. If the condition is false, the method returns false without
      modifying inventory.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              // swallow the finder exception because this means
              // supplier has not been populated; So we cant fulfill
              // this part of the order now
              return(false);
            }
            return(true);
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required

  - record_key: SI-BR-0006
    kind: business-rule
    capability_key: inventory-fulfillment
    requirement: >
      A supplier order SHALL transition to COMPLETED status only when all
      line items in the order have been shipped.
    confidence: medium
    confidence_basis: >
      The processAnOrder method sets po.setPoStatus(OrderStatusNames.COMPLETED)
      only if the flag allItemsAvailable remains true throughout the iteration.
      The flag is only kept true if all items pass the checkInventory test.
      However, the code checks if allItemsAvailable remains true at the end,
      but this logic may have edge cases with partial shipments marked COMPLETED
      at the line item level.
    risk_class: operational
    basis: >
      The OrderFulfillmentFacadeEJB.processAnOrder method initializes
      allItemsAvailable to true, iterates through line items, and sets it to
      false if any checkInventory call fails. After the loop, it checks:
      if(allItemsAvailable) po.setPoStatus(OrderStatusNames.COMPLETED). At the
      line item level, when an item can be fulfilled, it calls
      li.setQuantityShipped(li.getQuantity()) and marks the item COMPLETED.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB

  - record_key: SI-REQ-0007
    kind: requirement
    capability_key: inventory-fulfillment
    requirement: >
      The supplier system SHALL support processing of pending orders after
      new inventory has been received and entered into the system via the
      supplier web application.
    confidence: high
    confidence_basis: >
      The processPendingPO method is explicitly implemented in OrderFulfillmentFacadeEJB
      and is called from the RcvrRequestProcessor servlet when inventory is updated.
      The method queries all orders with PENDING status, attempts to fulfill each one,
      and returns a collection of newly generated invoices. This is directly testable
      via the web UI inventory update flow.
    risk_class: operational
    basis: >
      The OrderFulfillmentFacadeEJB.processPendingPO method calls
      supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING).
      It iterates through all pending orders and calls processAnOrder on each one.
      Any newly generated invoices are collected and returned. The RcvrRequestProcessor
      invokes this method after updating inventory and sends any generated invoices.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 247
        line_end: 269
        excerpt: |
          public Collection processPendingPO() throws FinderException {
            ArrayList invoices = new ArrayList();
            Collection coll =
              supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING);
            if(coll != null) {
              Iterator it = coll.iterator();
              while((it!=null) && (it.hasNext())) {
                SupplierOrderLocal order = (SupplierOrderLocal) it.next();
                String newInvoice = null;
                try {
                  newInvoice = processAnOrder(order);
                } catch (XMLDocumentException xe) {
                  // ignore since means we cant fulfill this order now
                  System.out.println("OrderFulfillmentFacade:" + xe);
                }
                if(newInvoice != null) {
                  invoices.add(newInvoice);
                }
              }
            }
            return invoices;
