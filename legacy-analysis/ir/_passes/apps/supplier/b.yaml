    confidence_basis: >
      web.xml declares a security-constraint for /RcvrRequestProcessor with an
      auth-constraint limiting access to the "administrator" role. This is declarative,
      container-enforced evidence at the highest confidence level.
    risk_class: operational
    basis: >
