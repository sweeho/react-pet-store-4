  - record_key: SUPP-INV-0001
    kind: entity
    capability_key: inventory-fulfillment
    requirement: >
      The system SHALL maintain an Inventory entity with two primary fields: itemId
      (String, primary key) and quantity (integer). Each inventory entry represents
      the available stock for a single item in the supplier's warehouse.
    confidence: high
    confidence_basis: >
      The Inventory CMP Entity EJB is explicitly defined in ejb-jar.xml with named
      CMP fields (itemId, quantity) and persistence configuration. The schema is
      declarative and enforced by the container. Both passes should identify this.
    risk_class: operational
    basis: >
      ejb-jar.xml defines InventoryEJB as a CMP Entity with abstract-schema-name
      "Inventory", two cmp-field declarations (itemId, quantity), and itemId as
      the primkey-field. InventoryEJB.java implements abstract accessors and setters
      for both fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/ejb-jar.xml
        line_start: 49
        line_end: 81
        excerpt: |
          <entity>
            <description>Inventory CMP EJB</description>
            <display-name>InventoryEB</display-name>
            <ejb-name>InventoryEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.supplier.inventory.ejb.InventoryLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.supplier.inventory.ejb.InventoryLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.supplier.inventory.ejb.InventoryEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <reentrant>False</reentrant>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>Inventory</abstract-schema-name>
            <cmp-field>
              <field-name>itemId</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>quantity</field-name>
            </cmp-field>
            <primkey-field>itemId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 49
        line_end: 85
        excerpt: |
          public abstract class InventoryEJB implements EntityBean {
              public abstract String getItemId();
              public abstract void setItemId(String itemId);
              public abstract int getQuantity();
              public abstract void setQuantity(int quantity);
              public void reduceQuantity(int quantity) {
                  int q = this.getQuantity();
                  setQuantity(q-quantity);
              }
    stack_metadata:
      ejb.type: "Entity (CMP 2.x)"
      persistence_type: "Container"
      primary_key_type: "java.lang.String"

  - record_key: SUPP-INV-REDUCE-0001
    kind: business-rule
    capability_key: inventory-fulfillment
    requirement: >
      The system SHALL provide an operation to reduce inventory quantity by a specified
      amount. Given an item in inventory and a quantity value, the system SHALL
      decrement the current quantity by the specified amount in an atomic transaction.
    confidence: high
    confidence_basis: >
      The reduceQuantity(int) method is explicitly implemented in InventoryEJB and is
      called during order fulfillment in OrderFulfillmentFacadeEJB.checkInventory().
      The method is transactional with attribute "Required" per ejb-jar.xml. Both passes
      should identify this operation.
    risk_class: financial
    basis: >
      InventoryEJB.reduceQuantity() subtracts a given quantity from the current quantity
      and updates the field via setQuantity(). The method is wrapped in container-managed
      transactions (trans-attribute: Required) per ejb-jar.xml configuration.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 77
        line_end: 85
        excerpt: |
          public void reduceQuantity(int quantity) {
              int q = this.getQuantity();
              setQuantity(q-quantity);
          }
