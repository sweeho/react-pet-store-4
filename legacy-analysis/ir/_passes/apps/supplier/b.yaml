  - record_key: SUPP-INVOICE-CREATE-0001
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The system SHALL generate an invoice XML document for items that can be shipped.
      The invoice SHALL include: order ID, user ID ("Dear PetStore Customer"), order
      date (from purchase order), current shipping date, and line items for all items
      that were fulfilled (category, product, item ID, line number, quantity, unit price).
    confidence: high
    confidence_basis: >
      OrderFulfillmentFacadeEJB.createInvoice() explicitly builds the invoice using
      TPAInvoiceXDE (a specialized XML document handler for invoices). The method sets
      all required fields and iterates through line items to add only those in the
      items map (filtered fulfillment). The implementation is visible.
    risk_class: operational
    basis: >
      createInvoice(SupplierOrderLocal po, HashMap newLis) creates an invoice document
      via invoiceXDE.newDocument(), sets order/user/date fields, and adds line items
      via invoiceXDE.addLineItem() for each item in the po whose ID is in newLis.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 145
        line_end: 171
        excerpt: |
          private String createInvoice(SupplierOrderLocal po, HashMap newLis)
            throws XMLDocumentException {
              invoiceXDE.newDocument();
              invoiceXDE.setOrderId(po.getPoId());
              invoiceXDE.setUserId("Dear PetStore Customer");
              Date poDate = new Date(po.getPoDate());
              invoiceXDE.setOrderDate(poDate);
              Date curDate = new Date();
              invoiceXDE.setShippingDate(curDate);
              Collection items = po.getLineItems();
              Iterator it = items.iterator();
              while((it != null) && (it.hasNext())) {
                LineItemLocal anItem = (LineItemLocal)it.next();
                if(newLis.containsKey(anItem.getItemId())) {
                  invoiceXDE.addLineItem(anItem.getCategoryId(),
                                         anItem.getProductId(),
                                         anItem.getItemId(),
                                         anItem.getLineNumber(),
                                         anItem.getQuantity(),
                                         anItem.getUnitPrice());
                }
              }
              String invDoc = invoiceXDE.getDocumentAsString();
              return(invDoc);
          }
    stack_metadata:
      xml_document_type: "TPAInvoiceXDE"
      invoice_fields: ["orderId", "userId", "orderDate", "shippingDate", "lineItems"]

  - record_key: SUPP-INVOICE-RETURN-0001
    kind: workflow
    capability_key: supplier-integration
    requirement: >
      The system SHALL send generated invoices back to the Order Processing Center.
      When an invoice is generated by the SupplierOrderMDB, the invoice XML SHALL be
      sent via a transition delegate that queues the invoice for delivery to the OPC.
      If no items were shipped, no invoice SHALL be sent.
    confidence: high
    confidence_basis: >
      SupplierOrderMDB.onMessage() checks if invoice is non-null before calling
      doTransition(invoice). The doTransition() method wraps the invoice in a
      TransitionInfo object and calls transitionDelegate.doTransition(). The pattern
      is explicit and consistent with transition-based message routing.
    risk_class: operational
    basis: >
      SupplierOrderMDB.onMessage() calls doWork(recdText) which returns an invoice
      (or null). It checks if(invoice!=null) before calling doTransition(invoice).
      doTransition() creates TransitionInfo(xmlMessage) and delegates to
      transitionDelegate.doTransition(info). The transition delegate is loaded from
      JNDI at bean creation time.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 155
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();

              // Do processing work on received message
              String invoice = doWork(recdText);

              // If orders were shipped, do the transition
              if(invoice!=null) {
                doTransition(invoice);
              }
            }
          }

          private void doTransition(String xmlMessage) throws TransitionException  {
            TransitionInfo info = new TransitionInfo(xmlMessage);
            transitionDelegate.doTransition(info);
          }
    stack_metadata:
      transition_pattern: "message-driven"
      message_format: "XML"

