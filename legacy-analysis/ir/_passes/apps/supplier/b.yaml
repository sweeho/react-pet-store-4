  - record_key: SUPP-SESSION-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      Session timeout for supplier module SHALL be 54 minutes. Users whose session
      expires must re-authenticate at the login page.
    confidence: high
    confidence_basis: >
      Declared in web.xml session-config with explicit session-timeout value of 54 minutes.
      This is declarative configuration enforced by the container. The 54-minute value
      is a bare literal with no surrounding comment, but confidence is high due to
      declarative source.
