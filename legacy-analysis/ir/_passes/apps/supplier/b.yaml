  - record_key: SUPP-INVENTORY-UPDATE-0001
    kind: workflow
    capability_key: inventory-fulfillment
    requirement: >
      The supplier SHALL be able to update inventory quantities via the inventory
      management screen. When the user selects an item (via checkbox) and enters a
      new quantity, clicking submit SHALL update the item's quantity in the inventory
      database. The system SHALL then attempt to fulfill any pending orders with the
      newly available stock.
    confidence: high
    confidence_basis: >
      RcvrRequestProcessor.doPost() explicitly handles currentScreen="updateinventory".
      It calls updateInventory(req) which iterates through request parameters matching
      "item_*" pattern, retrieves the corresponding quantity via "qty_*", and updates
      each inventory item via inventory.setQuantity(). It then calls processPendingPO()
      and sendInvoices() within a UserTransaction.
    risk_class: operational
    basis: >
      RcvrRequestProcessor.updateInventory() extracts item IDs from parameter names
      starting with "item_", retrieves corresponding quantities from "qty_*" parameters,
      and calls inventory.setQuantity() on each selected item. The entire update and
      pending fulfillment workflow is wrapped in a UserTransaction.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 110
        line_end: 137
        excerpt: |
          private void updateInventory(HttpServletRequest req) {
            String itemId;
            InventoryLocal inventory;

            try {
              Enumeration e = req.getParameterNames();
              while ((e != null) && e.hasMoreElements()) {
                String param = ((String)e.nextElement()).trim();
                if ((param != null) && param.startsWith("item_")) {
                  // get the item id number from the parameter
                  itemId = param.substring("item_".length(),param.length());
                  if(itemId != null) {
                    String newQty = req.getParameter("qty_" + itemId);
                    if((newQty == null) || (newQty.length() <= 0))
                      continue;
                    Integer qty = new Integer(newQty);
                    if(qty.intValue() >= 0 ) {
                      inventory = inventoryHomeRef.findByPrimaryKey(itemId);
                      inventory.setQuantity(qty.intValue());
                    }
                  }
                }
              }
            } catch (FinderException ne) {
              ne.printStackTrace();
            }
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 179
        line_end: 207
        excerpt: |
          if(curScreen.equals("updateinventory")) {
            UserTransaction ut = null;
            try {
              InitialContext ic = new InitialContext();
              ut = (UserTransaction) ic.lookup(JNDINames.USER_TRANSACTION);
              ut.begin();
              updateInventory(req);
              Collection invoices = procPO.processPendingPO();
              sendInvoices(invoices);
              ut.commit();
              getServletConfig().getServletContext().getRequestDispatcher("/back.jsp").forward(req, resp);
