              <method-intf>Local</method-intf>
              <method-name>reduceQuantity</method-name>
              <method-params>
                <method-param>int</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      transaction_attribute: "Required"
      method_scope: "Local"

  - record_key: SUPP-PO-RECEIVE-0001
    kind: workflow
    capability_key: supplier-integration
    requirement: >
      The system SHALL receive purchase orders from the Order Processing Center (OPC)
      via a JMS message queue. The SupplierOrderMDB message-driven bean SHALL listen
      to the queue, extract the purchase order XML from each TextMessage, and delegate
      processing to the OrderFulfillmentFacade.
    confidence: high
    confidence_basis: >
      SupplierOrderMDB is explicitly declared as a message-driven bean in ejb-jar.xml
      with message-driven-destination type "javax.jms.Queue". The onMessage() method
      implementation extracts TextMessage content and calls OrderFulfillmentFacadeLocal.
      Both passes should identify this workflow.
    risk_class: operational
    basis: >
      ejb-jar.xml defines SupplierOrderMDB with destination-type Queue and required
      JMS resource references. SupplierOrderMDB.onMessage() is the listener method
      that receives messages, extracts XML via TextMessage.getText(), and calls
      poProcessor.processPO(recdText) on the OrderFulfillmentFacadeLocal.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/ejb-jar.xml
        line_start: 85
        line_end: 100
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>SupplierOrderMDB</display-name>
            <ejb-name>SupplierOrderMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.supplier.processpo.ejb.SupplierOrderMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 123
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();

              // Do processing work on received message
              String invoice = doWork(recdText);

              // If orders were shipped, do the transition
              if(invoice!=null) {
                doTransition(invoice);
              }
    stack_metadata:
      jms.destination_type: "Queue"
      transaction_type: "Container"
      message_type: "TextMessage"

  - record_key: SUPP-PO-PROCESS-0001
    kind: requirement
    capability_key: inventory-fulfillment
    requirement: >
      The system SHALL process each incoming purchase order by: (1) parsing the XML
      document into a SupplierOrder object, (2) persisting the order, (3) checking
      inventory availability for each line item, (4) reducing inventory for items that
      can be fulfilled, (5) generating an invoice for items that were shipped. The
      processPO method SHALL return the invoice XML if any items were shipped, or null
      if no items could be fulfilled at this time.
    confidence: high
    confidence_basis: >
      OrderFulfillmentFacadeEJB.processPO() is the explicit implementation of this
      workflow. The method calls supplierOrderXDE.setDocument() and getSupplierOrder(),
      creates the order via supplierOrderLocalHome.create(), then calls processAnOrder()
      which handles the fulfillment logic. The sequence is visible and well-structured.
    risk_class: financial
    basis: >
      OrderFulfillmentFacadeEJB.processPO() converts XML to SupplierOrder via
      TPASupplierOrderXDE, persists it via SupplierOrderLocalHome.create(), then
      delegates fulfillment to processAnOrder() which checks inventory, reduces
      quantities via inv.reduceQuantity(), marks line items as shipped, and builds
      an invoice via createInvoice() if shipment occurred.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 237
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;

            // Convert Po in XML to PO as Java Obj
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            //persist order
            order = supplierOrderLocalHome.create(supplierOrder);
            //fullfil order
            invoiceXml = processAnOrder(order);
            return invoiceXml;
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;

              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
              if(invoiceReqd) {
                invoiceXml = (createInvoice(po, items));
              }
              return invoiceXml;
          }
    stack_metadata:
      ejb_method: "OrderFulfillmentFacadeEJB.processPO(String)"
      transaction_scope: "Required"
      return_type: "String (XML or null)"

  - record_key: SUPP-INV-CHECK-0001
    kind: business-rule
    capability_key: inventory-fulfillment
    requirement: >
      The system SHALL check inventory availability before fulfilling a line item.
      Given a line item with a requested quantity, the system SHALL verify that the
      inventory quantity for that item is greater than or equal to the requested
      quantity. If insufficient stock exists, the system SHALL mark the check as failed
      and NOT reduce inventory.
    confidence: high
    confidence_basis: >
      OrderFulfillmentFacadeEJB.checkInventory() explicitly implements this logic with
      a comparison (inv.getQuantity() < item.getQuantity()). The method returns false
      if insufficient stock, true if stock is adequate. Exception handling for missing
      inventory items returns false. Both passes should agree.
    risk_class: financial
    basis: >
      checkInventory(LineItemLocal item) retrieves the inventory for the item's ID,
      compares quantity to line item quantity, and only calls inv.reduceQuantity() if
      stock is sufficient. A FinderException (item not in inventory) also returns false.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              return(false);
            }
            return(true);
          }
    stack_metadata:
      method_scope: "private"
      returns: "boolean"

  - record_key: SUPP-INV-PARTIAL-FULFILL-0001
    kind: business-rule
    capability_key: inventory-fulfillment
    requirement: >
      The system SHALL support partial fulfillment of purchase orders. If some line
      items can be fulfilled from inventory and others cannot, the system SHALL ship
      the available items and create an invoice for only those items. The order status
      SHALL be marked COMPLETED only if all line items were fulfilled.
    confidence: high
    confidence_basis: >
      OrderFulfillmentFacadeEJB.processAnOrder() explicitly implements partial
      fulfillment logic: it iterates through line items, attempts to fulfill each,
      sets invoiceReqd flag when items can be shipped, and only marks po.setPoStatus()
      as COMPLETED if allItemsAvailable is true. Code is visible and unambiguous.
    risk_class: operational
    basis: >
      processAnOrder() uses a HashMap to track items that can be shipped (items.put())
      and a boolean invoiceReqd flag. It creates an invoice via createInvoice(po, items)
      only if invoiceReqd is true, using the items map to filter what goes into the
      invoice. Order status is set to COMPLETED only if allItemsAvailable remains true.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;

              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
              if(invoiceReqd) {
                invoiceXml = (createInvoice(po, items));
              }
              return invoiceXml;
          }
    stack_metadata:
      fulfillment_mode: "partial"
      status_values: "OrderStatusNames.COMPLETED"

  - record_key: SUPP-INV-RETRY-PENDING-0001
    kind: workflow
    capability_key: inventory-fulfillment
    requirement: >
      The system SHALL retry fulfillment of pending orders when new inventory arrives.
      When the inventory receiver updates inventory quantities, the system SHALL query
      for all orders with status PENDING and attempt to fulfill them with the newly
      arrived stock. Generated invoices SHALL be sent back to the OPC.
    confidence: high
    confidence_basis: >
      OrderFulfillmentFacadeEJB.processPendingPO() explicitly handles this workflow:
      it calls supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING),
      iterates through each pending order, calls processAnOrder() on each, collects
      invoices, and returns them. RcvrRequestProcessor.doPost() calls this method
      when currentScreen="updateinventory" and sends the invoices via sendInvoices().
    risk_class: operational
    basis: >
      processPendingPO() iterates through pending orders found via
      findOrdersByStatus(OrderStatusNames.PENDING), attempts fulfillment via
      processAnOrder(order), and collects returned invoices in an ArrayList.
      RcvrRequestProcessor calls procPO.processPendingPO() and passes invoices
      to sendInvoices() which sends each via transitionDelegate.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 247
        line_end: 269
        excerpt: |
          public Collection processPendingPO() throws FinderException {
            ArrayList invoices = new ArrayList();

            Collection coll =
              supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING);
            if(coll != null) {
              Iterator it = coll.iterator();
              while((it!=null) && (it.hasNext())) {
                SupplierOrderLocal order = (SupplierOrderLocal) it.next();
                String newInvoice = null;
                try {
                  newInvoice = processAnOrder(order);
                } catch (XMLDocumentException xe) {
                  System.out.println("OrderFulfillmentFacade:" + xe);
                }
                if(newInvoice != null) {
                  invoices.add(newInvoice);
                }
              }
            }
            return invoices;
          }
