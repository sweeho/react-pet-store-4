  - record_key: CA-AUTHN-0006
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system MAY optionally persist the username in a cookie when the user
      checks "Remember My User Name" during sign-on, with a cookie expiration
      of 2678400 seconds (approximately one month).
    confidence: high
    confidence_basis: >
      This feature is explicitly implemented in SignOnFilter.validateSignOn()
      with specific cookie handling logic. The max age value is a hardcoded
      literal with no configuration option.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn() checks the REMEMBER_USERNAME parameter and
      creates a cookie named "bp_signon" with the username value and a max age
      of 2678400 seconds. If the remember checkbox is not checked, the filter
      removes any existing bp_signon cookie. On the sign-on page (signon.jsp),
      the cookie value is used to pre-populate the username field.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 186
        excerpt: |
          // check if the user wants userName set in cookie
          String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);
          if (rememberUserName != null) {
            // set a cookie with the username in it
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
            // set cookie to last for one month
            userNameCookie.setMaxAge(2678400);
            hres.addCookie(userNameCookie);
          } else {
              // see if the cookie exists and remove accordingly
              Cookie[] cookies = hreq.getCookies();
              if (cookies != null) {
                  for (int loop=0; loop < cookies.length; loop++) {
                      if (cookies[loop].getName().equals(COOKIE_NAME)) {
                          cookies[loop].setMaxAge(0);
                          hres.addCookie(cookies[loop]);

                      }
                  }
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/signon.jsp
        line_start: 65
