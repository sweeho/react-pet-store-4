  - record_key: CA-AUTHN-0003
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL reject usernames containing '%' or '*' characters.
    confidence: high
    confidence_basis: >
      This validation is explicitly enforced in the UserEJB.ejbCreate() method with
      a specific check and named exception. It is a declarative business rule with
      only one enforcement point but that point is transaction-managed and required.
    risk_class: operational
    basis: >
      UserEJB.ejbCreate() contains explicit indexOf checks for '%' and '*' characters
      and throws CreateException if either is found. This prevents invalid usernames
      from being stored.
