  - record_key: CA-AUTHN-0005
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL enforce access control by requiring authentication before
      allowing access to protected resources defined in the signon-config.xml file.
    confidence: high
    confidence_basis: >
      Access control is enforced by the SignOnFilter servlet filter, which
      is applied to all requests. The protected resources are declaratively
      defined in signon-config.xml. The filter checks the session state and
      redirects unauthenticated users to the signon page.
    risk_class: operational
    basis: >
      SignOnFilter.doFilter() intercepts all requests and checks against protected
      resources loaded from signon-config.xml. If the target URL matches a protected
      resource pattern and the user is not authenticated, the filter forwards to the
      signon page. Protected resources include customer.screen, customer.do,
      enter_order_information.screen, and signon_welcome.screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 136
        line_end: 155
        excerpt: |
          // find out if the patterns match the target URL
          Iterator it = null;
          if (protectedResources != null) it = protectedResources.keySet().iterator();
          while ((it != null) && it.hasNext()) {
              String protectedName = (String)it.next();
              ProtectedResource resource  = (ProtectedResource)protectedResources.get(protectedName);
              String urlPattern = resource.getURLPattern();

              // now check agains the targetURL
              if (urlPattern.equals(targetURL)) {
                  // put the orginal url in the session so others can access
                  hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
                  config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
                  // Jump out of the filter and go to the next page
                  return;
              }
          }
