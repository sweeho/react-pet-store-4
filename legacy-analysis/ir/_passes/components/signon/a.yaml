      ejb.bean: SignOnEJB
      ejb.transaction: Required
      framework: J2EE EJB 2.0

  - record_key: CA-AUTHN-0002
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL create a new user account when provided with a valid username
      and password, enforcing length constraints on both fields.
    confidence: high
    confidence_basis: >
      User creation is declaratively enforced through validation in the UserEJB
      ejbCreate() method, which throws CreateException if constraints are violated.
      Both the JSP form and CreateUserServlet servlet use this method. The constraints
      are defined as class constants in UserLocal.java.
    risk_class: operational
    basis: >
      UserEJB.ejbCreate() checks username length <= 25 characters and password length
      is constrained by MAX_PASSWD_LENGTH. CreateUserServlet calls createUser() on the
      SignOn EJB, which calls UserLocalHome.create(). Invalid inputs result in
      CreateException being thrown.
