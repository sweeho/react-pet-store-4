  - record_key: CA-AUTHN-0004
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL maintain user authentication state in the HTTP session,
      storing a boolean flag indicating whether the user is signed on.
    confidence: high
    confidence_basis: >
      Session state is enforced in two independent places: the SignOnFilter
      initializes and checks the session attribute on every request, and the
      CreateUserServlet also references session state. The mechanism is consistent
      and required by all protected resource access.
    risk_class: operational
    basis: >
      SignOnFilter.doFilter() checks for SIGNED_ON_USER session attribute (a Boolean)
      on every request. If the attribute is null, it is initialized to false.
      After successful authentication, it is set to true. The session attribute
      USER_NAME stores the authenticated username.
