  - record_key: CUST-AUTH-0008
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL optionally persist the username in a browser cookie
      when the user selects the "Remember My User Name" checkbox, with the
      cookie expiring after 30 days (2678400 seconds).
    confidence: high
    confidence_basis: >
      Cookie handling is explicit in SignOnFilter.validateSignOn (lines 167-186).
      Cookie name, max-age value, and conditional logic are all clearly implemented.
      No conflicting implementations exist.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn checks for REMEMBER_USERNAME parameter
      (line 167). When set, creates cookie COOKIE_NAME (bp_signon) with
      setMaxAge(2678400) (lines 168-173). When unchecked, removes existing
      cookie by setting maxAge to 0 (lines 175-186).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 186
        excerpt: |
          // check if the user wants userName set in cookie
          String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);
          if (rememberUserName != null) {
            // set a cookie with the username in it
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
            // set cookie to last for one month
            userNameCookie.setMaxAge(2678400);
            hres.addCookie(userNameCookie);
          } else {
              // see if the cookie exists and remove accordingly
              Cookie[] cookies = hreq.getCookies();
              if (cookies != null) {
                  for (int loop=0; loop < cookies.length; loop++) {
                      if (cookies[loop].getName().equals(COOKIE_NAME)) {
                          cookies[loop].setMaxAge(0);
                          hres.addCookie(cookies[loop]);
                      }
                  }
              }
          }

