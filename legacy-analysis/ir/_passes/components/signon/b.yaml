records:
  - record_key: CUST-AUTH-0001
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL present a sign-in form that accepts a username and password
      for authentication of existing customers.
    confidence: high
    confidence_basis: >
      Both JSP UI (signon.jsp lines 47-128) and filter implementation (SignOnFilter.java
      lines 118-119, 157-210) show form-based authentication as primary entry point.
      Multiple implementations converge on same UI pattern.
    risk_class: operational
    basis: >
      Form UI defined in signon.jsp with fields j_username (line 70) and j_password
      (line 84). SignOnFilter.doFilter validates against FORM_SIGNON_URL constant
      and delegates to validateSignOn method.
    traces:
      - path: legacy-source/petstore1.3.2/src/docroot/signon.jsp
        line_start: 47
        line_end: 128
        excerpt: |
          <p class="petstore_title">Sign In</p>
          ...
          <waf:form  name="existingcustomer" action="j_signon_check" method="POST">
            <waf:input ... name="j_username" ...>
            <waf:input ... type="password" name="j_password" ...>
          </waf:form>
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 71
        line_end: 74
        excerpt: |
          public static final String FORM_SIGNON_URL = "j_signon_check";
          public static final String FORM_USER_NAME = "j_username";
          public static final String FORM_PASSWORD = "j_password";
          public static final String REMEMBER_USERNAME = "j_remember_username";

  - record_key: CUST-AUTH-0002
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL authenticate a user by verifying the provided password
      matches the stored password for the given username via case-sensitive string comparison.
    confidence: high
    confidence_basis: >
      The authentication logic is implemented in two places (SignOnEJB and UserEJB)
      with consistent behavior. The matchPassword method uses direct equals() call
      with no hashing or transformation, strongly indicating case-sensitive comparison.
    risk_class: financial
    basis: >
      SignOnEJB.authenticate (line 71-77) calls UserLocal.findByPrimaryKey and then
      user.matchPassword(). UserEJB.matchPassword (line 88-89) uses direct string
      equals comparison with no transformation or hashing.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 77
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false;
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 89
        excerpt: |
          public boolean matchPassword(String password) {
              return password.equals(getPassword());
          }

