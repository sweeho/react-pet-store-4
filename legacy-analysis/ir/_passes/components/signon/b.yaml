  - record_key: CUST-AUTH-0010
    kind: business-rule
    capability_key: customer-account
    requirement: >
      When a user attempts to sign in with a non-existent username, the system SHALL
      return false from the authenticate method and redirect to the error page.
    confidence: high
    confidence_basis: >
      Error handling for missing users is explicit in SignOnEJB.authenticate
      (lines 75-77). FinderException is caught and false is returned. This
      implements the expected failure case.
    risk_class: operational
    basis: >
      SignOnEJB.authenticate calls findByPrimaryKey which throws FinderException
      when user does not exist (line 75). Catch block returns false (line 76),
      which causes validateSignOn to redirect to error page.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 77
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }

