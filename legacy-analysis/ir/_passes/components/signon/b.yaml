  - record_key: CUST-AUTH-0005
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL maintain a session-scoped flag indicating whether the current
      user is authenticated, initialized to false for new sessions.
    confidence: high
    confidence_basis: >
      Session flag management is explicit and consistent in SignOnFilter
      (lines 125-130, 201). Both initialization and update are clearly implemented.
    risk_class: operational
    basis: >
      SignOnFilter checks and initializes SIGNED_ON_USER flag in session
      (lines 126-130). On successful authentication, flag is updated to true
      (line 201). Flag controls protected resource access (line 132-135).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 124
        line_end: 135
        excerpt: |
          // check if the user is signed on
          boolean signedOn = false;
          if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
              signedOn =((Boolean)hreq.getSession().getAttribute(SIGNED_ON_USER)).booleanValue();
          } else {
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(false));
          }
          // jump to the resource if signed on
          if (signedOn) {
                  chain.doFilter(request,response);
                  return;
          }

  - record_key: CUST-AUTH-0006
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL enforce access control to protected resources, redirecting
      unauthenticated users to the sign-in page before allowing access.
    confidence: high
    confidence_basis: >
      Access control is implemented as servlet filter intercepting all requests
      (SignOnFilter.doFilter). Protected resources are explicitly listed in
      configuration file (signon-config.xml) and matched against request URL.
      Implementation converges with configuration.
    risk_class: operational
    basis: >
      SignOnFilter loads protected resources from signon-config.xml (line 94-97).
      doFilter method checks if current URL matches protected resource patterns
      (lines 137-152). Protected resources defined in config include
      customer.screen, customer.do, enter_order_information.screen, and
      signon_welcome.screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 88
        line_end: 102
        excerpt: |
          public void init(FilterConfig config) throws ServletException {
              this.config = config;
              URL protectedResourcesURL = null;
              try {
                  protectedResourcesURL = config.getServletContext().getResource("/WEB-INF/signon-config.xml");
                  if (protectedResourcesURL != null) {
                      SignOnDAO dao = new SignOnDAO(protectedResourcesURL);
                      signOnErrorPage = dao.getSignOnErrorPage();
                      signOnPage = dao.getSignOnPage();
                      protectedResources = dao.getProtectedResources();
                  }
              }
