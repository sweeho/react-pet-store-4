  - record_key: CUST-AUTH-0014
    kind: workflow
    capability_key: customer-account
    requirement: >
      GIVEN an unauthenticated user attempts to access a protected resource,
      WHEN the filter intercepts the request, THEN the system SHALL redirect to
      the sign-in page, preserving the original URL for post-authentication redirect.
    confidence: high
    confidence_basis: >
      Workflow is explicit in SignOnFilter.doFilter (lines 136-152). Protected
      resource matching, original URL storage, and redirect are clearly implemented
      in sequence.
    risk_class: operational
    basis: >
      SignOnFilter.doFilter iterates through protected resources (lines 137-152).
      When URL pattern matches and user is not signed on, original URL is stored
      in session (line 147) and request is forwarded to sign-in page (line 148).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 136
        line_end: 152
        excerpt: |
          // find out if the patterns match the target URL
          Iterator it = null;
          if (protectedResources != null) it = protectedResources.keySet().iterator();
          while ((it != null) && it.hasNext()) {
              String protectedName = (String)it.next();
              ProtectedResource resource  = (ProtectedResource)protectedResources.get(protectedName);
              String urlPattern = resource.getURLPattern();
              // now check agains the targetURL
              if (urlPattern.equals(targetURL)) {
                  // put the orginal url in the session so others can access
                  hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
                  config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
                  // Jump out of the filter and go to the next page
                  return;
              }
          }

  - record_key: CUST-AUTH-0015
    kind: workflow
    capability_key: customer-account
    requirement: >
      GIVEN a user submits the sign-in form with username and password,
      WHEN the authenticate method returns true, THEN the system SHALL
      set the session authentication flag, store the username, and redirect to
      the original protected resource.
    confidence: high
    confidence_basis: >
      Successful authentication workflow is explicit in SignOnFilter.validateSignOn
      (lines 191-205). Session state updates and redirect are clearly implemented.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn checks authentication result (line 191).
      On success, sets USER_NAME session attribute (line 196), sets SIGNED_ON_USER
      to true (line 201), retrieves ORIGINAL_URL (line 203), and redirects
      (line 204).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 188
        line_end: 210
        excerpt: |
          //validate against the registered users
          SignOnLocal signOn = getSignOnEjb();
          boolean authenticated = signOn.authenticate(userName, password);
          if (authenticated) {
              // place a true boolean in the session
              if (hreq.getSession().getAttribute(USER_NAME) != null) {
                  hreq.getSession().removeAttribute(USER_NAME);
              }
              hreq.getSession().setAttribute(USER_NAME, userName);
              // remove the sign on user key before putting it back in
              if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
                  hreq.getSession().removeAttribute(SIGNED_ON_USER);
              }
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
              // redirect to the original destination
              String targetURL = (String)hreq.getSession().getAttribute(ORIGINAL_URL);
              hres.sendRedirect(targetURL);
              return;
          }

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/docroot/signon.jsp
    description: >
      Default values for username and password fields (j2ee/j2ee) are hardcoded in
      the JSP template at lines 96 and 109. Purpose and intended use are unclear.
      Decision needed: Are these demo/test defaults, and should they be removed
      in production? Or are they intentional for a specific user role?

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CreateUserHTMLAction.java
    description: >
      CreateUserHTMLAction.perform (lines 73-88) extracts j_password and j_password_2
      but performs no validation that they match before creating the user. The repeat
      password field exists in UI but is never checked. Validation responsibility is
      unclear - whether it belongs in the action, event handler, or elsewhere.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
    description: >
      Password matching uses case-sensitive direct string comparison (line 89)
      with no hashing or salting. This represents a significant security deviation
      from modern practices (the system stores plaintext passwords). The implementation
      is unambiguous but the risk profile is high for any actual customer data.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
    description: >
      Filter initialization loads protected resources from signon-config.xml (line 94),
      but no error handling exists if this file is missing or unparseable. SignOnDAO
      logs errors but does not throw exceptions. Behavior when config is malformed
      is undefined - filter may silently proceed with empty protected resources list.

