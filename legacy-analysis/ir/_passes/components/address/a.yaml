findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
    description: >
      The primary key class is declared as java.lang.Object (line 53), which is unusual
      and likely a container-generated class. The actual primary key field name is not
      declared in the CMP fields or the abstract bean class. This is typical for CMP 2.x
      but makes the primary key identity unclear without examining the deployment
      descriptor vendor-specific mappings (not visible in this extraction).
