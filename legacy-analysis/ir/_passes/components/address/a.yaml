records:
  - record_key: ADDRESS-ENT-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL maintain an Address entity with required fields: street name line 1,
      city, state, and zip code. Optional fields: street name line 2 and country.
    confidence: high
    confidence_basis: >
      The DTD schema explicitly defines required and optional elements. The CMP field declarations
      in ejb-jar.xml confirm persistence of all six fields. Both Address.java serialization and
      AddressEJB implementation consistently enforce this structure across XML, in-memory, and
      persistent representations.
    risk_class: operational
    basis: >
      DTD declares: StreetName (1 or 2 occurrences, first required), City, State, ZipCode
      (all required); Country as optional. Address.java constructor accepts all six fields.
      AddressEJB declares six CMP fields. Address.java toDOM() method conditionally includes
      streetName2 only if not null/empty (line 147-149), and includes Country (line 153).
      fromDOM() processes Country element (line 175-176).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 43
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
          <!ELEMENT StreetName (#PCDATA)>
          <!ELEMENT City (#PCDATA)>
          <!ELEMENT State (#PCDATA)>
          <!ELEMENT ZipCode (#PCDATA)>
          <!ELEMENT Country (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 56
        line_end: 80
        excerpt: |
          <cmp-field>
            <field-name>zipCode</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>streetName2</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>state</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>streetName1</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>city</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>country</field-name>
          </cmp-field>
    stack_metadata:
      ejb.bean: AddressEJB
      ejb.persistence-type: Container
      cmp.version: "2.x"

  - record_key: ADDRESS-BR-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      GIVEN an address is serialized to XML, WHEN the second street line is null or empty,
      THEN the second StreetName element SHALL NOT be included in the XML output.
    confidence: high
    confidence_basis: >
      The Address.java toDOM() method explicitly checks for null and empty string before
      appending the second street name. This check is consistently applied at serialization
      time, and the conditional output is the only logic controlling streetName2 serialization.
    risk_class: operational
    basis: >
      Address.java toDOM() method includes conditional logic at lines 147-149 that only adds
      a second StreetName element if streetName2 is not null and not empty.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 155
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ADDRESS);
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
            if (streetName2 != null && !streetName2.equals("")) {
              XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
            }
            XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
            XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
            XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
            XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
            return root;
          }
    stack_metadata:
      ejb.bean: AddressEJB

  - record_key: ADDRESS-BR-0002
    kind: business-rule
    capability_key: customer-account
    requirement: >
      GIVEN address serialization from DOM, WHEN a second StreetName element is present,
      THEN the second street line field SHALL be populated from that element;
      WHEN a second StreetName element is absent, THEN the second street line field SHALL
      remain null.
    confidence: high
    confidence_basis: >
      The Address.java fromDOM() method uses an optional sibling lookup with a true parameter
      indicating the element is optional. This is enforced at deserialization time and directly
      controls population of streetName2.
    risk_class: operational
    basis: >
      Address.java fromDOM() method uses XMLDocumentUtils.getNextSibling() with true (optional)
      flag to locate the second StreetName element. If found (optionalChild != null), streetName2
      is populated; otherwise it remains at the default (null).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 157
        line_end: 180
        excerpt: |
          public static Address fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ADDRESS)) {
              Element child;
              Address address = new Address();
              child = XMLDocumentUtils.getFirstChild(element, XML_STREET_NAME, false);
              address.streetName1 = XMLDocumentUtils.getContentAsString(child, false);
              Element optionalChild = XMLDocumentUtils.getNextSibling(child, XML_STREET_NAME, true);
              if (optionalChild != null) {
                address.streetName2 = XMLDocumentUtils.getContentAsString(optionalChild, false);
                child = optionalChild;
              }
              child = XMLDocumentUtils.getNextSibling(child, XML_CITY, false);
              address.city = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_STATE, false);
              address.state = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_ZIPCODE, false);
              address.zipCode = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
              address.country = XMLDocumentUtils.getContentAsString(child, false);
              return address;
            }
            throw new XMLDocumentException(XML_ADDRESS + " element expected.");
          }
    stack_metadata:
      ejb.bean: AddressEJB

  - record_key: ADDRESS-BR-0003
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL enforce container-managed transactions with Required transaction
      attribute on all Address entity methods (getters, setters, and lifecycle operations).
    confidence: high
    confidence_basis: >
      The ejb-jar.xml deployment descriptor explicitly declares trans-attribute Required
      for all documented methods. This is a declarative configuration that the EJB container
      enforces at runtime. Every getter and setter method in the AddressLocal interface
      has a corresponding <container-transaction> entry.
    risk_class: operational
    basis: >
      ejb-jar.xml <assembly-descriptor> section defines <container-transaction> entries
      for each method with <trans-attribute>Required</trans-attribute>. Methods covered:
      getCountry, setStreetName2, setStreetName1, getZipCode, setState, getCity, remove,
      setZipCode, getStreetName2, getStreetName1, setCountry, getState, setCity, getData.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 250
        line_end: 258
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>AddressEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getCountry</method-name>
              <method-params />
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 259
        line_end: 387
        excerpt: |
          (14 additional container-transaction blocks define Required for all
          getters, setters, remove, and getData methods)
    stack_metadata:
      ejb.bean: AddressEJB
      ejb.transaction: Required

  - record_key: ADDRESS-BR-0004
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL allow unchecked access to all Address entity methods
      (no authentication or authorization check required).
    confidence: high
    confidence_basis: >
      The ejb-jar.xml deployment descriptor declares all Address methods under a single
      <method-permission> block with an <unchecked /> element. This is declarative security
      configuration that the EJB container enforces. No runtime authorization logic exists
      in the AddressEJB bean class.
    risk_class: operational
    basis: >
      ejb-jar.xml <assembly-descriptor> contains a <method-permission> with <unchecked />
      tag that covers all methods on AddressEJB (both Local and LocalHome interfaces).
      The security-identity element also specifies use-caller-identity, indicating the
      bean runs under the caller's security context.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 88
        line_end: 95
        excerpt: |
          <method-permission>
            <unchecked />
            <method>
              <ejb-name>AddressEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getCity</method-name>
    stack_metadata:
      ejb.bean: AddressEJB

  - record_key: ADDRESS-ENT-0002
