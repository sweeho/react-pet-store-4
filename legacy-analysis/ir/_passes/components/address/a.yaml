    requirement: >
      The system SHALL support retrieval of Address entity data as a unified object
      through the getData() method, which returns an Address value object containing
      all six fields.
    confidence: high
    confidence_basis: >
      The AddressEJB bean implements getData() method that constructs and returns an
      Address object populated from all CMP fields. The AddressLocal interface declares
      this method. It is registered as an unchecked operation in ejb-jar.xml with Required
      transaction attribute.
    risk_class: operational
    basis: >
      AddressEJB implements getData() at lines 105-114, which constructs a new Address
      object and populates it from all six CMP fields before returning it. AddressLocal
      interface declares getData() at line 61. ejb-jar.xml declares getData() as unchecked
      and Required transaction at lines 380-387.
