    capability_key: customer-account
    requirement: >
      The system SHALL support creating Address instances through three distinct creation
      methods: with all six address field parameters, with a pre-constructed Address object,
      or with no parameters.
    confidence: high
    confidence_basis: >
      Three create() method signatures are declared in AddressLocalHome interface. Each
      is implemented in AddressEJB with corresponding ejbCreate/ejbPostCreate lifecycle
      callbacks. All are marked with unchecked access in ejb-jar.xml.
    risk_class: operational
    basis: >
      AddressLocalHome interface declares three overloaded create() methods at lines 45-50.
      AddressEJB implements corresponding ejbCreate methods at lines 73-103 (three variants:
      6 parameters, Address object parameter, and no-arg). ejb-jar.xml declares all three
      create methods as unchecked.
    traces:
