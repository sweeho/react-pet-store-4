        line_start: 88
        line_end: 125
        excerpt: |
          <method-permission>
            <unchecked />
            <method>
              <ejb-name>AddressEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getCity</method-name>
              <method-params />
            </method>
            [... more methods ...]
          </method-permission>
    stack_metadata:
      authorization_model: unchecked (all methods)
      role_based_authorization: none

  - record_key: customer-account-address-local-0001
    kind: requirement
    capability_key: customer-account
    requirement: >
      The address component SHALL be accessed only through local EJB interfaces
      (AddressLocalHome and AddressLocal); no remote access interfaces are provided.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml declares only local-home and local elements for AddressEJB
      (lines 49-50), with no home or remote elements. The absence of remote interface
      declarations is definitive evidence of local-only access.
    risk_class: operational
    basis: >
      The ejb-jar.xml entity bean definition (lines 46-85) specifies only local-home
      (com.sun.j2ee.blueprints.address.ejb.AddressLocalHome) and local
      (com.sun.j2ee.blueprints.address.ejb.AddressLocal), indicating the component
      is designed for intra-application (same JVM) use only. This is typical for
      finely-grained entity beans used as components within a larger application.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 46
        line_end: 85
        excerpt: |
          <entity>
            <display-name>AddressEJB</display-name>
            <ejb-name>AddressEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.address.ejb.AddressLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.address.ejb.AddressLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.address.ejb.AddressEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.Object</prim-key-class>
            <reentrant>False</reentrant>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>Address</abstract-schema-name>
    stack_metadata:
      interface_type: local-only
      supports_remote: false

  - record_key: customer-account-address-serialization-0001
    kind: requirement
    capability_key: customer-account
    requirement: >
      Address data SHALL be serializable to and deserializable from XML format using
      toDOM() and fromDOM() methods, conforming to the Address DTD schema.
    confidence: medium
    confidence_basis: >
      Address.java provides explicit toDOM() and fromDOM() methods (lines 144-180) that
      implement XML serialization using W3C DOM APIs. The DTD schema is defined and
      referenced in the Address class constants. However, the usage of these methods
      within the application is not directly visible in the search results, so the business
      requirement to actually use this serialization is inferred from its presence and
      implementation completeness.
    risk_class: operational
    basis: >
      Address.java implements toDOM() (lines 144-155) to convert an address to a DOM
      Element following the DTD structure. The fromDOM() method (lines 157-180) parses
      a DOM node back into an Address object. XMLDocumentUtils helper methods are used
      for robust element traversal. The DTD constants at the top of the class
      (XML_ADDRESS, XML_STREET_NAME, etc.) and the DTD file provide the schema definition.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 180
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ADDRESS);
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
            if (streetName2 != null && !streetName2.equals("")) {
              XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
            }
            XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
            XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
            XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
            XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
            return root;
          }

          public static Address fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ADDRESS)) {
              Element child;
              Address address = new Address();
              child = XMLDocumentUtils.getFirstChild(element, XML_STREET_NAME, false);
              address.streetName1 = XMLDocumentUtils.getContentAsString(child, false);
              Element optionalChild = XMLDocumentUtils.getNextSibling(child, XML_STREET_NAME, true);
              if (optionalChild != null) {
                address.streetName2 = XMLDocumentUtils.getContentAsString(optionalChild, false);
                child = optionalChild;
              }
              child = XMLDocumentUtils.getNextSibling(child, XML_CITY, false);
              address.city = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_STATE, false);
              address.state = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_ZIPCODE, false);
              address.zipCode = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
              address.country = XMLDocumentUtils.getContentAsString(child, false);
              return address;
            }
            throw new XMLDocumentException(XML_ADDRESS + " element expected.");
          }
    stack_metadata:
      serialization_format: XML (DOM)
      schema_type: DTD

