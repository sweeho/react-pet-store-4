  - record_key: supplier-integration-0001
    kind: entity
    capability_key: supplier-integration
    requirement: |
      The system SHALL support SupplierOrder documents for B2B supplier integration,
      containing order ID, order date, shipping address, and line items.
    confidence: high
    confidence_basis: |
      SupplierOrder.dtd schema explicitly defines the structure. Code in
      TPASupplierOrderXDE and TPALineItemUtils confirms runtime usage.
    risk_class: operational
    basis: |
      SupplierOrder.dtd (lines 38-63) defines SupplierOrder element with orderid,
      orderdate, shipaddress, and one or more lineitems. TPASupplierOrderXDE.java
      (lines 89-201) provides XDE implementation for this document type with methods
      to set order ID, date, shipping address, and add line items.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/SupplierOrder.dtd
        line_start: 38
        line_end: 64
        excerpt: |
          <!ELEMENT SupplierOrder (orderid, orderdate, shipaddress, lineitem+)>
          <!ELEMENT orderid (#PCDATA)>
          <!ELEMENT orderdate (#PCDATA)>
          <!ENTITY % Address "firstname, lastname, street, city, state, country, zip">

  - record_key: supplier-integration-0002
    kind: entity
    capability_key: supplier-integration
    requirement: |
      The system SHALL support TPA (Third-Party Application) namespace-aware SupplierOrder
      documents for supplier integration, with elements in namespace
      "http://blueprints.j2ee.sun.com/TPASupplierOrder" and prefix "tpaso".
    confidence: high
    confidence_basis: |
      TPASupplierOrderXDE class explicitly defines and uses this namespace in all
      document creation methods, confirmed by xsd and dtd constants.
    risk_class: operational
    basis: |
      TPASupplierOrderXDE.java defines namespace URIs (lines 57-63), creates namespaced
      elements in copyDocument (line 120), and provides methods to set order details
      with namespace prefixes (lines 149-173). Date formatting uses yyyy-MM-dd format
      (line 78) for supplier interoperability.
    stack_metadata:
      xml.namespace: "http://blueprints.j2ee.sun.com/TPASupplierOrder"
      xml.prefix: "tpaso"
      date.format: "yyyy-MM-dd"
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 57
        line_end: 86
        excerpt: |
          public class TPASupplierOrderXDE extends XMLDocumentEditor.DefaultXDE {
            public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD TPA-SupplierOrder 1.0//EN";
            public static final String XSD_PUBLIC_ID = "http://blueprints.j2ee.sun.com/TPASupplierOrder";
            public static final String XML_NAMESPACE = "http://blueprints.j2ee.sun.com/TPASupplierOrder";
            public static final String XML_PREFIX = "tpaso";
