  - record_key: order-management-0002
    kind: requirement
    capability_key: order-management
    requirement: |
      The system SHALL provide XML serialization/deserialization utilities supporting
      both DOM and SAX parsing, with configurable validation against DTD or XSD schemas.
    confidence: high
    confidence_basis: |
      XMLDocumentUtils class provides comprehensive parsing/serialization methods with
      explicit validating and xsdSupport flags, confirmed across multiple method signatures.
    risk_class: operational
    basis: |
      XMLDocumentUtils.java (lines 55-679) provides static methods for XML operations:
      fromXML() and deserialize() (lines 503-545) support validation flag and entity
      catalog resolution, SAXParser creation with validating flag (lines 564-610),
      and serialize() method (lines 364-386) with xsdSupport parameter controlling
      DTD vs XSD validation mode.
    stack_metadata:
      xml.parser: "javax.xml.parsers"
      xml.transform: "javax.xml.transform"
      xml.validation: "both-dtd-and-xsd"
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 559
        line_end: 610
        excerpt: |
          public static SAXParser createParser(boolean validating, boolean xsdSupport,
                                               CustomEntityResolver entityResolver, String schemaURI)
            throws XMLDocumentException {
            try {
              SAXParserFactory parserFactory = SAXParserFactory.newInstance();
              parserFactory.setValidating(validating);
              parserFactory.setNamespaceAware(true);
              SAXParser parser = parserFactory.newSAXParser();
              if (xsdSupport) {
                try {
                  parser.setProperty(JAXP_SCHEMA_LANGUAGE, W3C_XML_SCHEMA);
                } catch(SAXNotRecognizedException exception) {
                  System.err.println(exception);
                }

