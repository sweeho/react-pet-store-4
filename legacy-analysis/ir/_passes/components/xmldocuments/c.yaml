records:
  - record_key: order-approval-0001
    kind: entity
    capability_key: order-approval
    requirement: |
      The system SHALL support OrderApproval documents containing one or more Order entries,
      each with an OrderId and OrderStatus for order approval workflow tracking.
    confidence: high
    confidence_basis: |
      OrderApproval class directly models this with explicit XML serialization support,
      OrderApproval.dtd schema enforces the structure, and ChangedOrder entity implements
      the Order type with getter methods for both fields.
    risk_class: operational
    basis: |
      OrderApproval.java defines root OrderApproval element containing Order children
      (lines 66-85), ChangedOrder.java (lines 44-92) implements Order entity with
      orderId and orderStatus fields, OrderApproval.dtd schema (lines 38-45) declares
      the structure, and ChangedOrder has toDOM/fromDOM methods confirming the mapping.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 66
        line_end: 85
        excerpt: |
          public class OrderApproval {
            public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Order Approval 1.0//EN";
            public static final String DTD_SYSTEM_ID = "OrderApproval.dtd";
            public static final boolean VALIDATING = true;
            private ArrayList orderList = new ArrayList();
            public void addOrder(ChangedOrder order) {
              orderList.add(order);
            }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
        line_start: 38
        line_end: 45
        excerpt: |
          <!ELEMENT OrderApproval (Order+)>
          <!ELEMENT Order (OrderId, OrderStatus)>
          <!ELEMENT OrderId (#PCDATA)>
          <!ELEMENT OrderStatus (#PCDATA)>

  - record_key: order-approval-0002
    kind: requirement
    capability_key: order-approval
    requirement: |
      The system SHALL validate OrderApproval documents against the DTD on deserialization.
    confidence: high
    confidence_basis: |
      Static constant VALIDATING=true is enforced, and fromXML methods pass
      this flag to XMLDocumentUtils.fromXML which validates documents.
    risk_class: operational
    basis: |
      OrderApproval class defines VALIDATING=true constant (line 69), and
      fromXML methods (lines 118-138) pass this constant to validation logic,
      which throws XMLDocumentException on validation failure (lines 126-127).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 69
        line_end: 127
        excerpt: |
          public static final boolean VALIDATING = true;
          public static OrderApproval fromXML(Source source) throws XMLDocumentException {
            return fromXML(source, null, VALIDATING);
          }
          public static OrderApproval fromXML(Source source, URL entityCatalogURL, boolean validating) throws XMLDocumentException {
            return fromDOM(XMLDocumentUtils.fromXML(source, DTD_PUBLIC_ID, entityCatalogURL, validating).getDocumentElement());
          }

  - record_key: checkout-payment-0001
    kind: entity
    capability_key: checkout-payment
    requirement: |
      The system SHALL support PurchaseOrder documents containing order metadata,
      billing/shipping addresses, credit card information, and line items.
    confidence: high
    confidence_basis: |
      PurchaseOrder.dtd schema explicitly defines the structure with all required
      elements. The schema is a primary source of truth for document structure.
    risk_class: financial
    basis: |
      PurchaseOrder.dtd (lines 38-42) defines the PurchaseOrder element structure
      with OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice,
      CreditCard (which contains CardNumber, ExpiryDate, CardType), and one or more LineItems.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 81
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard, LineItem+)>
          <!ATTLIST PurchaseOrder
            locale CDATA "en_US"
          >
          <!ELEMENT CreditCard (CardNumber, ExpiryDate, CardType)>
          <!ELEMENT CardNumber (#PCDATA)>
          <!ELEMENT ExpiryDate (#PCDATA)>
          <!ELEMENT CardType (#PCDATA)>

  - record_key: checkout-payment-0002
    kind: business-rule
    capability_key: checkout-payment
    requirement: |
      GIVEN a PurchaseOrder document, WHEN serializing or deserializing,
      THEN the system SHALL support a locale attribute on the PurchaseOrder element
      with default value "en_US".
    confidence: medium
    confidence_basis: |
      DTD explicitly defines locale attribute with default, but no code was found
      that actively uses this attribute for locale-specific processing, only that
      it is declared and preserved in XML.
    risk_class: presentational
    basis: |
      PurchaseOrder.dtd defines locale attribute (lines 40-42) with CDATA and
      default value "en_US", indicating localization support infrastructure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 40
        line_end: 42
        excerpt: |
          <!ATTLIST PurchaseOrder
            locale CDATA "en_US"
          >

