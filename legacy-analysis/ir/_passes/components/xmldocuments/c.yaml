  - record_key: order-management-0004
    kind: requirement
    capability_key: order-management
    requirement: |
      The system SHALL support pluggable XML document editors through the
      XMLDocumentEditorFactory, registering editor classes by schema URI in a
      catalog properties file.
    confidence: medium
    confidence_basis: |
      XMLDocumentEditorFactory implements factory pattern with getXDE() method
      loading classes from properties, but no code found demonstrating actual usage
      or registration of multiple editor implementations.
    risk_class: operational
    basis: |
      XMLDocumentEditorFactory.java (lines 45-75) loads a properties file mapping
      schema URIs to XMLDocumentEditor implementation class names, and getXDE()
      (lines 60-66) instantiates editors via reflection. The architecture supports
      pluggable editors but runtime usage not visible in this component alone.
    stack_metadata:
      factory.pattern: "XMLDocumentEditorFactory"
      factory.property_based: true
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentEditorFactory.java
        line_start: 45
        line_end: 75
        excerpt: |
          public class XMLDocumentEditorFactory {
            private Properties xdeCatalog = new Properties();
            public XMLDocumentEditorFactory(URL catalogURL) throws XMLDocumentException {
              try {
                xdeCatalog.load(catalogURL.openStream());
              } catch (IOException exception) {
                throw new XMLDocumentException("Can't load from resource: " + catalogURL, exception);
              }
            }
            public XMLDocumentEditor getXDE(String schemaURI) throws XMLDocumentException {
              String className = xdeCatalog.getProperty(schemaURI);
              if (className != null) {
                return createXDE(className);

