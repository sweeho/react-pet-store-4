  - record_key: OM-RULE-0010
    kind: business-rule
    capability_key: order-management
    requirement: >
      The system SHALL validate XML documents against DTD schemas with public identifiers
      and support optional XSD validation mode with configurable validation behavior.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils methods show explicit validation logic (lines 503-545) with
      parameters controlling DTD vs XSD validation. Validation is enforced at deserialization.
    risk_class: operational
    basis: >
      XMLDocumentUtils.fromXML methods (lines 503-545) perform document validation with
      checkDocumentType comparison. setValidating flag and xsdSupport flags control mode.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 503
        line_end: 545
        excerpt: |
          public static Document fromXML(Source source, String dtdPublicId, final URL entityCatalogURL, boolean validating)
                throws XMLDocumentException {
            return deserialize(createTransformer(), source, dtdPublicId, entityCatalogURL, validating, false);
          }
          public static Document deserialize(Transformer transformer, Source source,
                                           String dtdPublicId, final URL entityCatalogURL, boolean validating, boolean xsdSupport)
                throws XMLDocumentException {
            if (!xsdSupport) {
              if (!XMLDocumentUtils.checkDocumentType(document, dtdPublicId)) {
                throw new XMLDocumentException("Document not of type: " + dtdPublicId);
              }
            }
    stack_metadata:
      framework: Java XML APIs (JAXP)

