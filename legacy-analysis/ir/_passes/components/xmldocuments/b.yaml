findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
    description: >
      FIXME comment on line 44 indicates that OrderStatus should be an attribute rather than
      an element. Current implementation uses element form. No specification of which form is
      correct or whether this was resolved in later versions.
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
    description: >
      Line 633 contains a comment "false; Due to problem of IdentityTransformer not creating the DocType nodes"
      suggesting a known issue with DTD doctype handling in serialization. The checkDocumentType method
      returns true if documentType is null, potentially masking validation failures. Resolution or impact
      of this issue is unclear.
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/CustomEntityResolver.java
    description: >
      Entity resolution supports three fallback mechanisms (URL, classpath resource, parent resolver)
      but the priority and fallback behavior when multiple resolve paths are available is not explicit.
      Tracing through the code suggests URL first, then classpath, then parent, but this is not documented.
