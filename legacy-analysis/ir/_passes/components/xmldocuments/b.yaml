  - record_key: OM-RULE-0014
    kind: business-rule
    capability_key: order-management
    requirement: >
      The system SHALL provide XMLDocumentEditorFactory for runtime selection and
      instantiation of document editors based on schema URI mapping from catalog.
    confidence: high
    confidence_basis: >
      XMLDocumentEditorFactory class uses Properties-based catalog for schema-to-editor
      mapping with reflection-based instantiation pattern.
    risk_class: operational
    basis: >
      XMLDocumentEditorFactory class (lines 45-75) loads catalog from URL and provides
      getXDE(schemaURI) method that maps schema URIs to editor class names for dynamic
      instantiation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentEditorFactory.java
        line_start: 45
        line_end: 75
        excerpt: |
          public class XMLDocumentEditorFactory {
            private Properties xdeCatalog = new Properties();
            public XMLDocumentEditorFactory(URL catalogURL) throws XMLDocumentException {
              try {
                xdeCatalog.load(catalogURL.openStream());
              }
            }
            public XMLDocumentEditor getXDE(String schemaURI) throws XMLDocumentException {
              String className = xdeCatalog.getProperty(schemaURI);
              if (className != null) {
                return createXDE(className);
              }
              throw new XMLDocumentException("No mapping for schema: " + schemaURI);
            }
    stack_metadata:
      framework: Java reflection API

