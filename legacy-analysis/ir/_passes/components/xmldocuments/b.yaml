records:
  - record_key: OM-ENTITY-0001
    kind: entity
    capability_key: order-management
    requirement: >
      The system SHALL support OrderApproval XML documents containing one or more
      orders, where each order is identified by an OrderId and has an OrderStatus
      indicating approval state.
    confidence: high
    confidence_basis: >
      OrderApproval.java class and OrderApproval.dtd schema both define this structure.
      Class implements serialization/deserialization and schema enforces structure.
      Both confirmations from declarative (DTD) and programmatic (Java) layers.
    risk_class: operational
    basis: >
      OrderApproval class (lines 66-76) defines orderList collection and addOrder method.
      DTD schema (lines 38-45) declares OrderApproval element with Order+ (one or more),
      each Order containing OrderId and OrderStatus as required child elements.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 66
        line_end: 85
        excerpt: |
          public class OrderApproval {
            public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Order Approval 1.0//EN";
            private ArrayList orderList = new ArrayList();
            public OrderApproval() {}
            public void addOrder(ChangedOrder order) {
              orderList.add(order);
            }
            public Collection getOrdersList() {
              return orderList;
            }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
        line_start: 38
        line_end: 45
        excerpt: |
          <!ELEMENT OrderApproval (Order+)>
          <!ELEMENT Order (OrderId, OrderStatus)>
          <!ELEMENT OrderId (#PCDATA)>
          <!ELEMENT OrderStatus (#PCDATA)>
    stack_metadata:
      db.object: OrderApproval.java
      framework: Java 2 Enterprise Edition

  - record_key: OM-ENTITY-0002
    kind: entity
    capability_key: order-management
    requirement: >
      The system SHALL represent changed order status as ChangedOrder entities with
      OrderId (unique order identifier) and OrderStatus (textual status value).
    confidence: high
    confidence_basis: >
      ChangedOrder class directly models this entity with explicit getters and DTD
      schema enforces the structure. Dual confirmation from code and schema.
    risk_class: operational
    basis: >
      ChangedOrder class (lines 44-54) defines orderId and orderStatus fields with
      constructor taking both values. DTD structure confirms these as required elements.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/ChangedOrder.java
        line_start: 44
        line_end: 64
        excerpt: |
          public class ChangedOrder {
            public static final String XML_ORDER = "Order";
            public static final String XML_ORDERID = "OrderId";
            public static final String XML_ORDERSTATUS = "OrderStatus";
            private String orderId;
            private String orderStatus;
            public ChangedOrder(String id, String stat) {
              orderId = id;
              orderStatus = stat;
            }
            public String getOrderId() {
              return(orderId);
            }
            public String getOrderStatus() {
              return orderStatus;
            }

