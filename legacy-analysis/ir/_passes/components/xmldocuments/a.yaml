  - record_key: xmldoc-requirement-0002
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL support XML document serialization with UTF-8 encoding
      as the default encoding for all document output.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils declares DEFAULT_ENCODING as "UTF-8" (line 56) as a public
      static final constant. This constant is used throughout the serialization
      methods (serialize(), toXML() variants) and is set on the Transformer's
      OutputKeys.ENCODING property (line 378). High confidence due to consistent
      enforcement across all serialization paths.
    risk_class: operational
    basis: >
      XMLDocumentUtils.java defines DEFAULT_ENCODING = "UTF-8" (line 56) and uses
      it in the serialize() method (line 378) where it calls
      transformer.setOutputProperty(OutputKeys.ENCODING, encoding). All toXML()
      methods default to DEFAULT_ENCODING when encoding is not specified.
    traces:
