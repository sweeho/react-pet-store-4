records:
  - record_key: order-approval-entity-0001
    kind: entity
    capability_key: order-approval
    requirement: >
      The system SHALL maintain an OrderApproval entity containing one or more Order
      elements, where each Order contains an OrderId and OrderStatus.
    confidence: high
    confidence_basis: >
      The DTD (OrderApproval.dtd line 38) declares the structure as mandatory
      (Order+), and the OrderApproval.java class (lines 71, 83-84) enforces
      this with an ArrayList and iteration patterns. Both declarative and
      programmatic enforcement present.
    risk_class: operational
    basis: >
      DTD declares <!ELEMENT OrderApproval (Order+)> and <!ELEMENT Order
      (OrderId, OrderStatus)>. Java code instantiates OrderApproval with
      ArrayList<ChangedOrder>, and fromDOM() (line 162-165) iterates through
      Order child elements and constructs ChangedOrder objects for each.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
        line_start: 38
        line_end: 45
        excerpt: |
          <!ELEMENT OrderApproval (Order+)>
          <!ELEMENT Order (OrderId, OrderStatus)>
          <!ELEMENT OrderId (#PCDATA)>
          <!ELEMENT OrderStatus (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 71
        line_end: 85
        excerpt: |
          private ArrayList orderList = new ArrayList();
          public void addOrder(ChangedOrder order) {
            orderList.add(order);
            return;
          }

  - record_key: order-approval-requirement-0001
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL serialize OrderApproval documents to XML with a DTD
      public identifier of "-//Sun Microsystems, Inc. - J2EE Blueprints
      Group//DTD Order Approval 1.0//EN" and support both DTD and XSD validation.
    confidence: high
    confidence_basis: >
      Constant DTD_PUBLIC_ID is declared in OrderApproval.java and used consistently
      in serialization methods (lines 100, 102). Multiple toXML() method signatures
      (lines 98-116) support both entity catalog URL and direct DTD system IDs.
      High confidence due to multiple enforcement points.
    risk_class: operational
    basis: >
      OrderApproval.java declares DTD_PUBLIC_ID (line 67) as "-//Sun Microsystems,
      Inc. - J2EE Blueprints Group//DTD Order Approval 1.0//EN" and uses it in
      toXML() methods (lines 100, 102) which call XMLDocumentUtils.toXML().
      The component supports both DTD (VALIDATING = true, line 69) and entity
      catalog-based resolution for flexible schema mapping.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 67
        line_end: 69
        excerpt: |
          public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Order Approval 1.0//EN";
          public static final String DTD_SYSTEM_ID = "OrderApproval.dtd";
          public static final boolean VALIDATING = true;

  - record_key: xmldoc-requirement-0001
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The system SHALL support XML document editing and serialization with configurable
      entity catalog resolution, enabling mapping of DTD/XSD public identifiers to
      local schema resources.
    confidence: high
    confidence_basis: >
      XMLDocumentEditorFactory (lines 45-75) loads Properties from a catalog URL
      and maps schema URIs to class names via getXDE(). CustomEntityResolver is used
      throughout XMLDocumentUtils. Both declarative configuration (catalog file) and
      programmatic instantiation are present.
    risk_class: operational
    basis: >
      XMLDocumentEditorFactory (lines 51-57) loads a catalog from a URL into a
      Properties object. The getXDE() method (lines 60-66) retrieves class names
      for a given schema URI, enabling factory-pattern instantiation of schema-specific
      editors. CustomEntityResolver is instantiated throughout XMLDocumentUtils
      to handle entity URI mapping.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentEditorFactory.java
        line_start: 51
        line_end: 66
        excerpt: |
          public XMLDocumentEditorFactory(URL catalogURL) throws XMLDocumentException {
            try {
              xdeCatalog.load(catalogURL.openStream());
            } catch (IOException exception) {
              throw new XMLDocumentException("Can't load from resource: " + catalogURL, exception);
            }
            return;
          }
          public XMLDocumentEditor getXDE(String schemaURI) throws XMLDocumentException {
            String className = xdeCatalog.getProperty(schemaURI);
            if (className != null) {
              return createXDE(className);
            }
            throw new XMLDocumentException("No mapping for schema: " + schemaURI);
          }

