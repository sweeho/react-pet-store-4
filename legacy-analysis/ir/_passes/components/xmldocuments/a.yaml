  - record_key: xmldoc-integration-0001
    kind: integration
    capability_key: supplier-integration
    requirement: >
      The system SHALL provide a factory pattern for instantiating XML document
      editors based on schema URIs, loading the mapping from a catalog properties
      file and instantiating the corresponding editor class by name.
    confidence: high
    confidence_basis: >
      XMLDocumentEditorFactory (lines 45-75) implements a complete factory pattern
      with catalog loading, schema-to-class mapping, and reflection-based
      instantiation. The pattern is fully visible and enforced in both the
      constructor and getXDE() method.
    risk_class: operational
    basis: >
      XMLDocumentEditorFactory loads a Properties catalog from a URL (line 52-53),
      stores it in xdeCatalog field (line 46). The getXDE() method retrieves the
      class name for a schema URI (line 61) and calls createXDE() which uses
      Class.forName() and newInstance() to instantiate the editor (line 70).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentEditorFactory.java
        line_start: 45
        line_end: 75
        excerpt: |
          public class XMLDocumentEditorFactory {
            private Properties xdeCatalog = new Properties();
            public XMLDocumentEditorFactory(URL catalogURL) throws XMLDocumentException {
              try {
                xdeCatalog.load(catalogURL.openStream());
              } catch (IOException exception) {
                throw new XMLDocumentException("Can't load from resource: " + catalogURL, exception);
              }
              return;
            }
            public XMLDocumentEditor getXDE(String schemaURI) throws XMLDocumentException {
              String className = xdeCatalog.getProperty(schemaURI);
              if (className != null) {
                return createXDE(className);
              }
              throw new XMLDocumentException("No mapping for schema: " + schemaURI);
            }
            public XMLDocumentEditor createXDE(String className) throws XMLDocumentException {
              try {
                return (XMLDocumentEditor) Class.forName(className).newInstance();
              } catch(Exception exception) {
                throw new XMLDocumentException("Can't instantiate XDE: " + className, exception);
              }
            }
          }

findings:
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
    description: >
      The DTD contains a FIXME comment (line 44) indicating OrderStatus should be
      an attribute rather than an element, but the current implementation treats it
      as a text element. Unclear whether this is a known limitation or a future
      refactoring target. A human needs to confirm if this is a defect or intentional.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
    description: >
      The TPASupplierOrderXDE class initializes element references (orderIdElement,
      orderDateElement, etc.) as null in newDocument() and they are populated by
      setter methods. However, the copyDocument() method appends these elements
      unconditionally. Unclear what happens if a setter is not called before
      copyDocument() - whether null checks are performed or if NPE would occur.
      Reachability of the setter methods is not confirmed from source alone.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
    description: >
      XMLDocumentUtils.checkDocumentType() (line 626-634) returns true if the
      document has no DOCTYPE node (line 633 comment indicates this is a workaround
      for IdentityTransformer not creating DocType nodes). This means documents
      without DTD declarations are silently accepted. Unclear if this is intentional
      permissiveness or a known limitation of the JAXP implementation.
