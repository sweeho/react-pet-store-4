  - record_key: xmldoc-workflow-0001
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL support deserialization of OrderApproval XML documents
      from a Source (file, string, or stream), validate them against the DTD,
      and construct an in-memory OrderApproval object with a collection of
      ChangedOrder objects.
    confidence: high
    confidence_basis: >
      OrderApproval.java provides three fromXML() factory methods (lines 118-138)
      that accept Source and String inputs, with optional entity catalog URL and
      validation flags. The fromDOM() method (lines 156-170) constructs the object
      from parsed DOM nodes. Both programmatic and declarative validation are
      supported.
    risk_class: operational
    basis: >
      OrderApproval.java defines fromXML() methods (lines 118-138) that call
      XMLDocumentUtils.fromXML() with validating=true by default. The fromDOM()
      method parses DOM nodes and iterates through Order children, constructing
      ChangedOrder objects. This pattern enforces the structure during deserialization.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 118
        line_end: 138
        excerpt: |
          public static OrderApproval fromXML(Source source) throws XMLDocumentException {
            return fromXML(source, null, VALIDATING);
          }
          public static OrderApproval fromXML(String buffer) throws XMLDocumentException {
            return fromXML(buffer, null, VALIDATING);
          }
          public static OrderApproval fromXML(Source source, URL entityCatalogURL, boolean validating) throws XMLDocumentException {
            return fromDOM(XMLDocumentUtils.fromXML(source, DTD_PUBLIC_ID, entityCatalogURL, validating).getDocumentElement());
          }

