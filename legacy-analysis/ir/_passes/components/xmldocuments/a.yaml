      and copyDocument() (lines 119-131) enforces their presence by appending them
      in order.
    risk_class: operational
    basis: >
      TPASupplierOrderXDE.java defines XML element constants (lines 64-87) for
      SupplierOrder, OrderId, OrderDate, ShippingAddress, and nested address
      components (FirstName, LastName, Street, City, State, Country, ZipCode, Email, Phone).
      The copyDocument() method appends these in a fixed order, enforcing structure.
