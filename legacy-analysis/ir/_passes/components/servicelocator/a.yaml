  - record_key: ADMIN-OPS-SVCLOCATOR-0012
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      The web tier ServiceLocator SHALL implement the singleton pattern with a static
      instance initialized at class load time to ensure a single shared ServiceLocator
      instance is available application-wide.
    confidence: high
    confidence_basis: >
      Singleton pattern is explicitly implemented in web tier through static initializer
      block and getInstance() method. EJB tier has a static reference but is not enforced
      as singleton.
    risk_class: operational
    basis: >
      The web tier ServiceLocator contains a static instance 'me' initialized in a static
      block at class load time, with a getInstance() method providing access to the single
      instance. This pattern is specific to the web tier, which is intended for shared
      resource access.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 72
        line_end: 96
        excerpt: |
          private static ServiceLocator me;

          static {
            try {
              me = new ServiceLocator();
            } catch(ServiceLocatorException se) {
              System.err.println(se);
              se.printStackTrace(System.err);
            }
          }

          static public ServiceLocator getInstance() {
            return me;
          }
    stack_metadata:
      framework: J2EE
      design_pattern: Singleton

  - record_key: ADMIN-OPS-SVCLOCATOR-0013
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      The web tier ServiceLocator SHALL cache looked-up resources in a synchronized Map
      to avoid redundant JNDI lookups and improve performance.
    confidence: high
    confidence_basis: >
      Caching is explicitly implemented in web tier ServiceLocator using
      Collections.synchronizedMap(). Every lookup method checks cache before performing JNDI
      lookup. This pattern is consistently applied across all resource types.
    risk_class: operational
    basis: >
      The web tier maintains a 'cache' Map initialized as Collections.synchronizedMap(new
      HashMap()). Each lookup method (getLocalHome, getRemoteHome, getQueue, getTopic,
      getDataSource, etc.) first checks if the resource exists in cache using
      cache.containsKey() and cache.get(), only performing a JNDI lookup if the resource
      is not cached.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 69
        line_end: 92
        excerpt: |
          private InitialContext ic;
          private Map cache;

          static {
            try {
              me = new ServiceLocator();
            } catch(ServiceLocatorException se) {
              System.err.println(se);
              se.printStackTrace(System.err);
            }
          }

          private ServiceLocator() throws ServiceLocatorException  {
            try {
              ic = new InitialContext();
              cache = Collections.synchronizedMap(new HashMap());
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
