records:
  - record_key: ADMIN-OPS-SVCLOCATOR-0001
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      The system SHALL support exception handling in service location operations through a
      ServiceLocatorException that wraps lower-level exceptions and provides access to the
      root cause.
    confidence: high
    confidence_basis: >
      Exception handling is explicitly implemented across all lookup methods in both EJB and
      web tier implementations, with NamingException and general Exception being caught and
      wrapped consistently. The getRootCause() method provides recursive unwrapping of wrapped
      exceptions.
    risk_class: operational
    basis: >
      ServiceLocatorException class implements exception wrapping with getException() and
      getRootCause() methods. All lookup methods (getLocalHome, getRemoteHome, getQueue,
      getTopic, getDataSource, etc.) in both EJB and web tier catch NamingException and
      Exception, wrapping them in ServiceLocatorException.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 46
        line_end: 105
        excerpt: |
          public class ServiceLocatorException extends Exception {
            private Exception exception;
            public ServiceLocatorException(String message, Exception exception) {
              super(message);
              this.exception = exception;
              return;
            }
            public Exception getException() {
              return exception;
            }
            public Exception getRootCause() {
              if (exception instanceof ServiceLocatorException) {
                return ((ServiceLocatorException) exception).getRootCause();
              }
              return exception == null ? this : exception;
            }
          }
    stack_metadata:
      framework: J2EE
      ejb.bean: ServiceLocatorException

  - record_key: ADMIN-OPS-SVCLOCATOR-0002
    kind: business-rule
    capability_key: admin-operations
    requirement: >
