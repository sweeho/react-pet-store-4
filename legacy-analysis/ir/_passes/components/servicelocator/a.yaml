      initial context and handles NamingException.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 83
        line_end: 93
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
                home = (EJBLocalHome) ic.lookup(jndiHomeName);
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBLocalHome) cache.get(jndiHomeName);
              } else {
                  home = (EJBLocalHome) ic.lookup(jndiHomeName);
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
    stack_metadata:
      framework: J2EE
      ejb.bean: ServiceLocator

  - record_key: ADMIN-OPS-SVCLOCATOR-0003
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      The system SHALL support lookup of remote EJB Homes via JNDI using PortableRemoteObject.narrow()
      to narrow the JNDI lookup result to the target EJBHome class type.
    confidence: high
    confidence_basis: >
      Remote home lookup is implemented in both EJB and web tier with explicit use of
      PortableRemoteObject.narrow() to narrow the JNDI object reference. This pattern is
      consistent across both implementations.
    risk_class: operational
    basis: >
      The getRemoteHome(String jndiHomeName, Class className) method in both implementations
      uses PortableRemoteObject.narrow() to narrow the JNDI lookup result to the desired
      EJBHome type, enabling RMI interoperability for remote EJB access.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 101
        line_end: 113
        excerpt: |
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
             return home;
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 129
        line_end: 147
        excerpt: |
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBHome) cache.get(jndiHomeName);
              } else {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
