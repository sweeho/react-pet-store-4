  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
    description: >
      Static initialization block (lines 74-81) catches ServiceLocatorException and prints
      to stderr, but continues with 'me' potentially uninitialized if instantiation fails.
      Unclear whether null checks are performed by getInstance() callers or if the uninitialized
      static instance is a failure mode left to the application to handle. No documentation
      of initialization failure behavior or recovery.
