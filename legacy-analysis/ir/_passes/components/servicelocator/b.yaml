          static {
            try {
              me = new ServiceLocator();
            } catch(ServiceLocatorException se) {
              System.err.println(se);
              se.printStackTrace(System.err);
            }
          }

          static public ServiceLocator getInstance() {
            return me;
          }

  - record_key: admin-operations-requirement-0003
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The web tier ServiceLocator SHALL cache looked-up resources in a synchronized Map
      to avoid repeated JNDI lookups for the same resource names.
    confidence: high
    confidence_basis: >
      Caching is implemented consistently across all lookup methods in the web tier.
      The cache is initialized as Collections.synchronizedMap(new HashMap()) (line 86).
      Every getter method checks cache before JNDI lookup (e.g., lines 109-113 for local home).
    risk_class: operational
    basis: >
      The web tier declares a private cache member variable initialized in constructor
      as a synchronized HashMap. All resource lookup methods check cache first, then
      perform JNDI lookup only if cache misses, then populate cache with result.
      The EJB tier variant does NOT implement caching, suggesting caching is specific to web tier.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 69
        line_end: 92
        excerpt: |
          private InitialContext ic;
          private Map cache; //used to hold references to EJBHomes/JMS Resources for re-use

          private static ServiceLocator me;

          static {
            try {
              me = new ServiceLocator();
            } catch(ServiceLocatorException se) {
              System.err.println(se);
              se.printStackTrace(System.err);
            }
          }

          private ServiceLocator() throws ServiceLocatorException  {
            try {
              ic = new InitialContext();
              cache = Collections.synchronizedMap(new HashMap());
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBLocalHome) cache.get(jndiHomeName);
              } else {
                  home = (EJBLocalHome) ic.lookup(jndiHomeName);
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }

