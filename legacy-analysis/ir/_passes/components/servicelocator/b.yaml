  - record_key: admin-operations-requirement-0005
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support lookup of EJB remote home interfaces via JNDI using
      PortableRemoteObject.narrow() to handle remote object type coercion.
    confidence: high
    confidence_basis: >
      Both implementations include getRemoteHome(String jndiHomeName, Class className) method.
      The use of PortableRemoteObject.narrow() is consistent across both variants and
      is required for RMI remote object handling in J2EE.
    risk_class: operational
    basis: >
      Remote home lookup requires two-step process: first JNDI lookup of remote reference,
      then narrow operation to cast to specific home type. The className parameter allows
      clients to specify the target type for narrowing.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 95
        line_end: 113
        excerpt: |
          /**
           * will get the ejb Remote home factory.
           * clients need to cast to the type of EJBHome they desire
           *
           * @return the EJB Home corresponding to the homeName
           */
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
             return home;
          }

