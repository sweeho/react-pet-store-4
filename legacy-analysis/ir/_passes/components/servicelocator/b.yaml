  - record_key: admin-operations-requirement-0009
    kind: requirement
    capability_key: admin-operations
    requirement: >
      All resource lookup methods SHALL throw ServiceLocatorException upon failure,
      wrapping and preserving the underlying NamingException or other exceptions
      for error propagation and debugging.
    confidence: high
    confidence_basis: >
      All sixteen lookup methods across both implementations follow identical exception
      handling pattern: catching NamingException and generic Exception, then throwing
      ServiceLocatorException. This is a consistent architectural choice across all resource types.
    risk_class: operational
    basis: >
      The ServiceLocatorException class wraps lower-level exceptions and preserves them
      for root cause analysis (lines 42-105 of ServiceLocatorException.java).
      Every lookup method uses identical try-catch pattern to wrap exceptions.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 42
        line_end: 105
        excerpt: |
          /**
           * This class implements an exception which can wrapped a lower-level exception.
           *
           */
          public class ServiceLocatorException extends Exception {
            private Exception exception;

            /**
             * Creates a new ServiceLocatorException wrapping another exception, and with a detail message.
             * @param message the detail message.
             * @param exception the wrapped exception.
             */
            public ServiceLocatorException(String message, Exception exception) {
              super(message);
              this.exception = exception;
              return;
            }

            /**
             * Creates a ServiceLocatorException with the specified detail message.
             * @param message the detail message.
             */
            public ServiceLocatorException(String message) {
              this(message, null);
              return;
            }

            /**
             * Creates a new ServiceLocatorException wrapping another exception, and with no detail message.
             * @param exception the wrapped exception.
             */
            public ServiceLocatorException(Exception exception) {
              this(null, exception);
              return;
            }

            /**
             * Gets the wrapped exception.
             *
             * @return the wrapped exception.
             */
            public Exception getException() {
              return exception;
            }

            /**
             * Retrieves (recursively) the root cause exception.
             *
             * @return the root cause exception.
             */
            public Exception getRootCause() {
              if (exception instanceof ServiceLocatorException) {
                return ((ServiceLocatorException) exception).getRootCause();
              }
              return exception == null ? this : exception;
            }

            public String toString() {
              if (exception instanceof ServiceLocatorException) {
                return ((ServiceLocatorException) exception).toString();
              }
              return exception == null ? super.toString() : exception.toString();
            }
          }

  - record_key: admin-operations-requirement-0010
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The EJB tier ServiceLocator SHALL NOT implement caching, providing fresh JNDI
      lookups on every invocation to avoid stale references in server-to-server communication.
    confidence: high
    confidence_basis: >
      The EJB tier variant (ejb/ServiceLocator.java) contains no cache member, no cache
      initialization, and no cache checking logic in any method. This is a deliberate
      architectural difference from the web tier implementation.
    risk_class: operational
    basis: >
      Comparison between two implementations reveals intentional design split:
      - EJB tier: lines 62-245 show no cache member or cache logic
      - Web tier: lines 70 and throughout shows cache usage
      This suggests EJB tier prioritizes freshness over caching performance.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 56
