records:
  - record_key: admin-operations-requirement-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a centralized mechanism for looking up J2EE resources via JNDI
      to minimize coupling between components and resource naming.
    confidence: high
    confidence_basis: >
      Both EJB and web tier implementations exist with identical lookup patterns across
      multiple resource types, indicating this is a core architectural requirement.
      The component is explicitly named as a Service Locator pattern implementation (lines 56-58 of ejb/ServiceLocator.java).
    risk_class: operational
    basis: >
      The service locator pattern is implemented with two specialized versions:
      1) EJB tier variant (ejb/ServiceLocator.java) for server-to-server resource lookup
      2) Web tier variant (web/ServiceLocator.java) with caching and singleton pattern
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 56
        line_end: 60
        excerpt: |
          * This class is an implementation of the Service Locator pattern. It is
          * used to looukup resources such as EJBHomes, JMS Destinations, etc.

  - record_key: admin-operations-requirement-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The web tier ServiceLocator SHALL implement singleton pattern, providing a single
      application-wide instance via getInstance() method to ensure consistent resource access.
    confidence: high
    confidence_basis: >
      Both the static instance variable and getInstance() method are declared in the web
      tier implementation with explicit initialization in a static block (lines 74-81).
      This is a mandatory pattern for resource caching efficiency.
    risk_class: operational
    basis: >
      Static singleton pattern with synchronized initialization. The web tier uses
      a static instance 'me' initialized in a static block, with failure handling
      that prints errors to stderr.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 72
