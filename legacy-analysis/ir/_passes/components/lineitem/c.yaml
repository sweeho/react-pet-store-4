findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
    description: >
      The LineItem DTD (LineItem.dtd) does not include quantityShipped as an element in the XML schema, even though quantityShipped is a persistent CMP field. The getData() method excludes quantityShipped from the returned POJO, and the fromDOM() parser does not deserialize it. This creates ambiguity: is quantityShipped never transmitted over wire, or is there a separate XML format for fulfillment updates? The discrepancy between persistent schema (includes quantityShipped) and serialization schema (excludes it) should be resolved to clarify whether quantityShipped is an internal-only field or if an alternative transfer format exists.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
    description: >
      The processInvoice method receives a Map<itemId, shippedQuantity> but the source or validation of this map is not visible in the codebase excerpt examined. It is unclear whether the supplier-facing integration guarantees that itemIds in the map will exist as LineItems in the PurchaseOrder, what happens if a received itemId does not match any LineItem (is it silently ignored, logged, or rejected), and whether duplicate shipments for the same itemId result in cumulative or idempotent updates. The calling context needs to be examined to fully specify the contract.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
    description: >
      LineItem.java POJO has no quantityShipped field, but LineItemEJB abstract bean declares quantityShipped as a persistent CMP field. When a LineItem POJO is passed to the second ejbCreate variant, quantityShipped is populated from the int qty parameter, not from the POJO. This design suggests a deliberate separation: LineItem is a "read" DTO for clients (excluding shipped state) while quantityShipped is internal server state. However, this design is not documented, and the implications (e.g., inability to round-trip quantityShipped through XML) are not explicit.
