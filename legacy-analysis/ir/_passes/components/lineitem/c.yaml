    requirement: >
      The system SHALL allow read access to all LineItem fields (categoryId, productId, itemId, lineNumber, quantity, unitPrice, quantityShipped) and SHALL allow write access only to the quantityShipped field.
    confidence: high
    confidence_basis: >
      The LineItemLocal interface explicitly declares all seven getters and only one setter (setQuantityShipped). The declarative configuration in ejb-jar.xml shows that all getter methods have Required transaction attribute, as does setQuantityShipped. The implementation is consistent with no observed exceptions or conditional write paths.
