  - record_key: IF-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: inventory-fulfillment
    requirement: >
      When processing invoice information from a supplier, the system SHALL increment the quantityShipped field of each affected LineItem by the quantity received for that item in the invoice.
    confidence: high
    confidence_basis: >
      The PurchaseOrderHelper.processInvoice() method explicitly implements this logic with clear intent: it iterates through line items, looks up the received quantity from a map keyed by itemId, and increments quantityShipped. The code is single-source and not contradicted anywhere. The pattern matches the narrow use case of supplier order fulfillment.
    risk_class: operational
    basis: >
      The PurchaseOrderHelper.processInvoice method demonstrates the fulfillment pattern: for each LineItemLocal in a purchase order, if the itemId appears in the received shipment map, its quantityShipped is incremented by the shipped quantity value.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 91
        excerpt: |
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                          Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                  li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                  }
            }
          }

  - record_key: IF-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: inventory-fulfillment
    requirement: >
      A purchase order is considered completely fulfilled when every LineItem within it has quantityShipped equal to the ordered quantity.
    confidence: high
    confidence_basis: >
      The PurchaseOrderHelper.processInvoice method validates fulfillment completion by iterating all line items and returning false if ANY line item has quantity != quantityShipped. This is the single source of truth for fulfillment completion logic and is both declarative (clearly stated) and enforced (checked on every invoice).
    risk_class: operational
    basis: >
      The processInvoice method checks fulfillment by comparing quantity to quantityShipped for each line item. Only when all line items satisfy quantity == quantityShipped does the method return true, indicating complete fulfillment.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 93
        line_end: 103
        excerpt: |
          // now loop through all LIs and see if all are shipped completely
          liColl = po.getLineItems();
          liIt = liColl.iterator();
          while((liIt != null) && (liIt.hasNext())) {
            LineItemLocal li = (LineItemLocal) liIt.next();
            if(li.getQuantity() != li.getQuantityShipped()) {
                return false;
                }
          }
          return true;

