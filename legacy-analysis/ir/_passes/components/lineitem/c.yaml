    basis: >
      The LineItemLocal interface restricts write operations to quantityShipped. All other fields have getter methods but no setter methods in the local interface. The ejb-jar.xml declaratively assigns Required transaction attribute to all getters and to setQuantityShipped, enforcing transactional consistency.
