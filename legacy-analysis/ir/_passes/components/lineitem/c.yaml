  - record_key: OM-REQUIREMENT-0001
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL allow creation of LineItem entities with two distinct initialization patterns: (1) by providing all seven field values individually (categoryId, productId, itemId, lineNumber, quantity, unitPrice, quantityShipped), or (2) by providing a LineItem data object and an initial quantityShipped value.
    confidence: high
    confidence_basis: >
      Both creation methods are explicitly declared in the LineItemLocalHome interface and implemented in the LineItemEJB ejbCreate methods with complete type signatures. There are no ambiguities or variations in how creation is handled; both patterns are consistently present in the declarative and programmatic layers.
    risk_class: operational
    basis: >
      The LineItemLocalHome interface declares two create method signatures: one with seven String/int/float parameters and one accepting a LineItem object and int quantity. The LineItemEJB implements both with corresponding ejbCreate and ejbPostCreate methods.
