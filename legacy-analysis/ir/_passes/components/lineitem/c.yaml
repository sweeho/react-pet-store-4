    kind: entity
    capability_key: order-management
    requirement: >
      The system SHALL maintain LineItem entities that represent individual items within purchase orders, each with a category identifier, product identifier, item identifier, line number, ordered quantity, unit price, and shipped quantity.
    confidence: high
    confidence_basis: >
      This entity is explicitly defined in the CMP EJB configuration with all fields declared as persistent CMP fields. The Java class structure mirrors the database schema definition. Both the ejb-jar.xml and Java source code consistently define these seven fields with no variations or alternatives observed.
    risk_class: operational
    basis: >
      The LineItem entity is defined as a CMP (Container Managed Persistence) Entity Bean with fields: categoryId, productId, itemId, lineNumber, quantity, unitPrice, quantityShipped. The ejb-jar.xml declares each as a cmp-field, establishing persistence contract.
