      can verify through schema declaration and persistent field definitions.
    risk_class: operational
    basis: >
      LineItem.java defines getCategoryId(), getProductId(), getItemId() accessors
      (lines 83-93). LineItemEJB.java declares abstract accessor methods for all three
      fields (lines 58-88). ejb-jar.xml defines these as CMP fields (lines 59-66).
    traces:
