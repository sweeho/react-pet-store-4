  - record_key: order-management-entity-0001
    kind: entity
    capability_key: order-management
    requirement: >
      LineItem SHALL track both ordered quantity and shipped quantity to enable
      fulfillment status monitoring within a purchase order.
    confidence: high
    confidence_basis: >
      Fulfillment tracking is enforced in both the schema and entity bean. The
      quantityShipped field is explicitly declared and accessed separately from
      quantity in multiple places. The business logic that compares these fields
      exists in both the entity bean and the helper class.
    risk_class: operational
    basis: >
      LineItem.java defines quantity (int) and unitPrice (float) fields (lines 67-68).
      LineItemEJB.java adds an additional quantityShipped field (lines 130-136) which
      is accessed separately from quantity. ejb-jar.xml declares quantityShipped as a
      CMP field (lines 76-78). PurchaseOrderHelper.java implements fulfillment
      completion logic comparing quantity to quantityShipped (lines 98-101).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 102
        line_end: 137
        excerpt: |
          public abstract int getQuantity();
          public abstract void setQuantity(int qty);
          public abstract int getQuantityShipped();
          public abstract void setQuantityShipped(int qty);
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 70
        line_end: 78
        excerpt: |
          <cmp-field>
            <field-name>quantity</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>quantityShipped</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 103
        excerpt: |
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
              }
            }
            liColl = po.getLineItems();
            liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(li.getQuantity() != li.getQuantityShipped()) {
                return false;
              }
            }
            return true;
          }
    stack_metadata:
      ejb.bean: LineItemEJB
      ejb.persistence_type: CMP 2.x
      db.object: CMP fields quantity, quantityShipped

