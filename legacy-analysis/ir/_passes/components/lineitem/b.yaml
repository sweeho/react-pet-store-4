  - record_key: supplier-integration-requirement-0001
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The system SHALL support serialization of LineItem data to XML format
      using namespace-qualified elements for B2B supplier order documents.
    confidence: medium
    confidence_basis: >
      TPALineItemUtils.java exists and demonstrates XML serialization capability
      for supplier integration contexts. However, the actual invocation paths and
      integration points are not directly visible in LineItem component itself,
      making this a medium-confidence observation of a capability rather than
      a requirement enforced by LineItem code.
    risk_class: operational
    basis: >
      TPALineItemUtils.java defines addLineItem() static method (lines 64-77)
      that creates namespace-qualified XML elements with attributes for categoryId,
      productId, itemId, lineNo, quantity, and unitPrice. The method name prefix
      "TPA" indicates Trading Partner Agreement context.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
        line_start: 50
        line_end: 78
        excerpt: |
          public class TPALineItemUtils {
            public static final String XML_NAMESPACE = "http://blueprints.j2ee.sun.com/TPALineItem";
            public static final String XML_PREFIX = "tpali";
            public static void addLineItem(Document document, Element lineItemsElement,
                                           String categoryId, String productId, String itemId, String lineNo,
                                           int quantity, float unitPrice) {
              Element lineItemElement = document.createElementNS(XML_NAMESPACE, XML_LINEITEM);
              lineItemElement.setAttributeNS("http://www.w3.org/2000/xmlns/", "xmlns:" + XML_PREFIX, XML_NAMESPACE);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_CATEGORYID, categoryId);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_PRODUCTID, productId);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_ITEMID, itemId);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_LINENO, lineNo);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_QUANTITY, Long.toString(quantity));
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_UNITPRICE, Float.toString(unitPrice));
              lineItemsElement.appendChild(lineItemElement);
            }
          }
    stack_metadata:
      framework: J2EE XML Document Processing

  - record_key: order-management-business-rule-0001
    kind: business-rule
    capability_key: order-management
    requirement: >
      GIVEN a purchase order with line items, WHEN all line items have
      quantityShipped equal to their ordered quantity, THEN the purchase order
      fulfillment is complete and ready for delivery.
    confidence: high
    confidence_basis: >
      PurchaseOrderHelper.processInvoice() implements the exact logic that
      compares quantity to quantityShipped for all line items. This is the
      authoritative business rule for order completion in the codebase.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.java processInvoice() method implements the business
      rule explicitly: it iterates all line items and returns false (incomplete)
      if any line item has quantity != quantityShipped (lines 94-101).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 93
        line_end: 103
        excerpt: |
          liColl = po.getLineItems();
          liIt = liColl.iterator();
          while((liIt != null) && (liIt.hasNext())) {
            LineItemLocal li = (LineItemLocal) liIt.next();
            if(li.getQuantity() != li.getQuantityShipped()) {
              return false;
            }
          }
          return true;
    stack_metadata:
      ejb.bean: LineItemEJB and PurchaseOrderEJB relationship

  - record_key: order-management-business-rule-0002
    kind: business-rule
    capability_key: order-management
    requirement: >
      GIVEN a supplier invoice report with item IDs and shipped quantities,
      WHEN processing the invoice for a purchase order, THEN accumulate the
      shipped quantity for each line item by adding the invoice quantity to
      the existing quantityShipped value.
    confidence: high
    confidence_basis: >
      PurchaseOrderHelper.processInvoice() explicitly implements this
      accumulation logic: it retrieves quantityShipped, adds the shipped
      quantity from the invoice, and stores the result back. This is the
      only place this business rule appears in the codebase.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.java processInvoice() method (lines 82-91) retrieves
      each line item by itemId, obtains current quantityShipped, adds the shipped
      quantity from the invoice Map, and updates the line item with the sum.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 91
        excerpt: |
          Collection liColl = po.getLineItems();
          Iterator liIt = liColl.iterator();
          while((liIt != null) && (liIt.hasNext())) {
            LineItemLocal li = (LineItemLocal) liIt.next();
            if(lineItemIds.containsKey(li.getItemId())) {
              Integer shipped = (Integer) lineItemIds.get(li.getItemId());
              li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
            }
          }
    stack_metadata:
      ejb.bean: LineItemEJB and PurchaseOrderEJB relationship

findings:
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
    description: >
      The ejb-jar.xml defines an entity bean with persistence-type Container
      and cmp-version 2.x, but the abstract-schema-name is declared as LineItem
      (line 57) without an explicit schema file. The CMP mapping between schema
      names and actual database tables is not visible in the lineitem component
      itself - this configuration is likely in an application-server-specific
      descriptor (e.g., sun-ejb-jar.xml or equivalent). The actual database
      schema implementation cannot be verified from the lineitem component alone.
