records:
  - record_key: ENCF-REQ-0001
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL initialize the encoding filter with a configurable character encoding
      parameter via filter initialization.
    confidence: high
    confidence_basis: >
      The requirement is explicitly stated in the init() method (line 63), which retrieves the
      encoding parameter from FilterConfig. This is declaratively configured in web.xml with a
      concrete value (UTF-8), providing multiple independent sources of evidence.
    risk_class: operational
    basis: >
      The init() method calls config.getInitParameter("encoding") at line 63, which is the
      standard Servlet Filter pattern for retrieving initialization parameters. The encoding
      parameter is declared in all application web.xml files with value "UTF-8".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/encodingfilter/src/com/sun/j2ee/blueprints/encodingfilter/web/EncodingFilter.java
        line_start: 61
        line_end: 64
        excerpt: |
          public void init(FilterConfig config) throws ServletException {
              this.config = config;
              this.targetEncoding = config.getInitParameter("encoding");
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 1
        line_end: 1
        excerpt: |
          <init-param><param-name>encoding</param-name><param-value>UTF-8</param-value></init-param>
    stack_metadata:
      framework: servlet-filter
      servlet.filter_class: com.sun.j2ee.blueprints.encodingfilter.web.EncodingFilter

  - record_key: ENCF-REQ-0002
    kind: business-rule
    capability_key: notification-messaging
    requirement: >
      The system SHALL enforce UTF-8 character encoding on all incoming HTTP requests by
      default when the encoding filter is applied.
    confidence: high
    confidence_basis: >
      The default encoding is explicitly set to "ASCII" in the source code (line 59), but all
      observed deployments in web.xml configure it to "UTF-8". This is consistently applied
      across all application WAR deployments (petstore, admin, supplier, opc). High confidence
      because both the code and all configurations agree on the enforcement mechanism.
    risk_class: operational
    basis: >
      Line 59 sets the default encoding to ASCII. However, every web.xml configuration examined
      explicitly sets the encoding parameter to UTF-8, which is the standard for international
      character support. The filter applies this encoding via setCharacterEncoding() at line 75.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/encodingfilter/src/com/sun/j2ee/blueprints/encodingfilter/web/EncodingFilter.java
        line_start: 58
        line_end: 59
        excerpt: |
          // default to ASCII
          private String targetEncoding = "ASCII";
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 1
        line_end: 1
        excerpt: |
          <init-param><param-name>encoding</param-name><param-value>UTF-8</param-value></init-param>
    stack_metadata:
      framework: servlet-filter

  - record_key: ENCF-REQ-0003
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL apply character encoding to the request object before processing by
      downstream filters and servlets.
    confidence: high
    confidence_basis: >
      The mechanism is clearly visible in the doFilter() method at line 75, where
      setCharacterEncoding() is called on the request. The filter is mapped to all URL patterns
      (/*) in web.xml, ensuring universal application. No ambiguity in the code or configuration.
    risk_class: operational
    basis: >
      The doFilter() method invokes request.setCharacterEncoding(targetEncoding) at line 75.
      This sets the character encoding for the request before passing it to the filter chain.
      The filter is mapped to the /* pattern in web.xml, ensuring it applies to all requests.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/encodingfilter/src/com/sun/j2ee/blueprints/encodingfilter/web/EncodingFilter.java
        line_start: 71
        line_end: 78
        excerpt: |
          public  void doFilter(ServletRequest srequest, ServletResponse  sresponse, FilterChain chain)
              throws IOException, ServletException {
              HttpServletRequest request = (HttpServletRequest)srequest;
              request.setCharacterEncoding(targetEncoding);
              // move on to the next
              chain.doFilter(srequest,sresponse);
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 1
        line_end: 1
        excerpt: |
          <filter-mapping><filter-name>EncodingFilter</filter-name><url-pattern>/*</url-pattern></filter-mapping>
    stack_metadata:
      framework: servlet-filter
      servlet.method: setCharacterEncoding

  - record_key: ENCF-REQ-0004
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL properly clean up filter resources in the destroy() method when the
      filter is being unloaded or the application is shutting down.
    confidence: high
    confidence_basis: >
      The destroy() method is explicitly implemented at lines 66-69, clearing both config and
      targetEncoding references. This follows the standard Servlet Filter lifecycle pattern.
      The implementation is straightforward with no ambiguity.
    risk_class: operational
    basis: >
      The destroy() method at line 66 sets both config and targetEncoding to null, ensuring
      proper cleanup of resources when the filter instance is garbage collected. This is
      standard Servlet Filter lifecycle management.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/encodingfilter/src/com/sun/j2ee/blueprints/encodingfilter/web/EncodingFilter.java
        line_start: 66
        line_end: 69
        excerpt: |
          public void destroy() {
              config = null;
              targetEncoding = null;
          }
    stack_metadata:
      framework: servlet-filter
      servlet.lifecycle_method: destroy

  - record_key: ENCF-WORKFLOW-0001
    kind: workflow
    capability_key: admin-operations
    requirement: >
      GIVEN the encoding filter is deployed in a web application, WHEN the filter initialization
      occurs, THEN the filter SHALL load the encoding parameter from FilterConfig and store it
      for use in subsequent request processing. WHEN a request is processed, THEN the stored
      encoding SHALL be applied to the request object before passing control to the filter chain.
      WHEN the application is shut down, THEN the filter SHALL release all references to allow
      garbage collection.
    confidence: high
    confidence_basis: >
      The entire workflow is visible in the source code with no ambiguity. All three lifecycle
      phases (init, doFilter, destroy) are implemented and match the standard Servlet Filter
      contract. Configuration in all web.xml files confirms the pattern is used consistently
      across deployments.
    risk_class: operational
    basis: >
      The filter lifecycle is completely visible in the EncodingFilter class:
      - init() at line 61 initializes the filter with configuration
      - doFilter() at line 71 processes requests
      - destroy() at line 66 cleans up resources
      All applications in the codebase use this pattern.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/encodingfilter/src/com/sun/j2ee/blueprints/encodingfilter/web/EncodingFilter.java
        line_start: 61
        line_end: 79
        excerpt: |
          public void init(FilterConfig config) throws ServletException {
              this.config = config;
              this.targetEncoding = config.getInitParameter("encoding");
          }

          public void destroy() {
              config = null;
              targetEncoding = null;
          }

           public  void doFilter(ServletRequest srequest, ServletResponse  sresponse, FilterChain chain)
              throws IOException, ServletException {
              HttpServletRequest request = (HttpServletRequest)srequest;
              request.setCharacterEncoding(targetEncoding);
              // move on to the next
              chain.doFilter(srequest,sresponse);
          }
    stack_metadata:
      framework: servlet-filter

