records:
  - record_key: CART-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL add a single item to the shopping cart with a default quantity
      of 1 when the addItem(itemID) method is invoked.
    confidence: high
    confidence_basis: >
      The requirement is enforced by both the declarative interface (ShoppingCartLocal)
      and the implementation (ShoppingCartLocalEJB). The implementation explicitly
      creates an Integer(1) for the quantity. No ambiguity is present.
    risk_class: operational
    basis: >
      The addItem(String itemID) method in ShoppingCartLocalEJB (line 111-113) stores
      the item in the cart HashMap with a default quantity of 1. This is the public
      interface method exposed through ShoppingCartLocal (line 61).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 113
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }

  - record_key: CART-REQ-0002
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL add an item to the shopping cart with an explicit quantity
      when the addItem(itemID, qty) method is invoked.
    confidence: high
    confidence_basis: >
      This is a separate overloaded method explicitly defined in both interface and
      implementation. The logic is straightforward: no ambiguity.
    risk_class: operational
    basis: >
      The overloaded addItem(String itemID, int qty) method (line 115-117) allows
      callers to specify the quantity explicitly. This method bypasses the default
      quantity of 1 and uses the provided value.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 115
        line_end: 117
        excerpt: |
          public void addItem (String itemID,int qty) {
              cart.put(itemID, new Integer(qty));
          }

  - record_key: CART-REQ-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL remove an item from the shopping cart when the deleteItem(itemID)
      method is invoked.
    confidence: high
    confidence_basis: >
      Declarative interface and implementation agree. HashMap.remove() is the only
      operation performed. No ambiguity.
    risk_class: operational
    basis: >
      The deleteItem(String itemID) method (line 119-121) removes the item from the
      cart HashMap using the remove() operation. The itemID parameter is the key.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 119
        line_end: 121
        excerpt: |
          public void deleteItem (String itemID) {
              cart.remove(itemID);
          }

  - record_key: CART-REQ-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL update the quantity of an existing item in the shopping cart.
      If the new quantity is greater than zero, the item SHALL remain in the cart with
      the updated quantity. If the new quantity is less than or equal to zero, the item
      SHALL be removed from the cart.
    confidence: high
    confidence_basis: >
      The business rule is enforced in the updateItemQuantity implementation through
      an explicit conditional check. The behavior is clear and unambiguous. The condition
      (newQty > 0) is the only logic present.
    risk_class: operational
    basis: >
      The updateItemQuantity(String itemID, int newQty) method (line 123-127) first
      removes the item from the cart, then re-adds it only if newQty > 0. This implements
      the rule that zero or negative quantities result in item removal.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }

  - record_key: CART-REQ-0005
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL calculate the shopping cart subtotal by multiplying the unit cost
      of each item by its quantity and summing across all items in the cart.
    confidence: high
    confidence_basis: >
      The calculation is enforced in the getSubTotal() method and is the only place
      subtotal is computed. The formula is explicit: sum(quantity * unitCost).
    risk_class: financial
    basis: >
      The getSubTotal() method (line 133-144) iterates through all CartItems, computes
      item.getQuantity() * item.getUnitCost() for each, and accumulates the sum. The
      calculation is performed in Java double precision.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
              Collection items = getItems();
              if (items == null) return null;
              // put the subtotal in the request
              double ret = 0.0d;
              // total up the quantities
              for (Iterator it =items.iterator(); it.hasNext(); ) {
                  CartItem i = (CartItem) it.next();
                  ret += (i.getUnitCost() * i.getQuantity()) ;
              }
              return new Double(ret);
          }

  - record_key: CART-REQ-0006
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL fetch product details (name, category, attribute, unit cost)
      from the catalog component for each item in the shopping cart when the getItems()
      method is invoked. The catalog lookup SHALL be performed using the item ID and
      the current locale setting.
    confidence: medium
    confidence_basis: >
      The integration with the catalog is enforced in code and works in both directions
      (cart has a method to get items; catalog is called from cart). However, the
      method uses a non-blocking CatalogException catch block that silently suppresses
      errors, leaving error handling behavior ambiguous.
    risk_class: operational
    basis: >
      The getItems() method (line 83-109) instantiates a CatalogHelper with false
      (local EJB access), then calls catalog.getItem(key, locale) for each item ID
      in the cart. CartItem objects are constructed from the returned Item objects.
      Any CatalogException is caught and printed to System.out but not re-thrown.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 83
        line_end: 109
        excerpt: |
          public Collection getItems() {
              // get a catalog helper using local EJB Access
              CatalogHelper catalog = new CatalogHelper(false);
              HashMap map = getDetails();
              ArrayList items = new ArrayList();
              Iterator it = map.keySet().iterator();
              while (it.hasNext()) {
                  String key = (String)it.next();
                  Integer value = (Integer)map.get(key);
                  Item item = null;
                  try {
                      item = catalog.getItem(key, locale);
                      // convert catalog item to cart item
                      CartItem ci = new CartItem(item.getItemId(),
                                             item.getProductId(),
                                             item.getCategory(),
                                             item.getProductName(),
                                             item.getAttribute(),
                                             value.intValue(),
                                             item.getListCost());
                      items.add(ci);
                  } catch (CatalogException cce) {
                      System.out.println("ShoppingCartEJB caught: " + cce);
                  }
              }
              return items;
          }

  - record_key: CART-REQ-0007
    kind: requirement
    capability_key: shopping-cart
