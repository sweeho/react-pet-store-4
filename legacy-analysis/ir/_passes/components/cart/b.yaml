  - record_key: CART-REQ-0009
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL store the locale (language/region) for the shopping cart and
      use it when fetching catalog item details. The locale SHALL default to
      Locale.US (English, United States) upon cart initialization.
    confidence: high
    confidence_basis: >
      The locale field is initialized to Locale.US in the constructor and is a
      direct instance variable. The setLocale() method is the only way to change it.
      The locale is then passed to catalog.getItem(key, locale) calls.
    risk_class: operational
    basis: >
      The ShoppingCartLocalEJB class (line 64-66) declares a Locale field initialized
      to Locale.US. The setLocale(Locale locale) method (line 76-78) allows updates.
      The locale is used in getItems() at line 94: catalog.getItem(key, locale).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 64
        line_end: 78
        excerpt: |
          private HashMap cart;
          // default to the US English
          private Locale locale = Locale.US;

          public ShoppingCartLocalEJB() {
              cart = new HashMap();
          }

          public void setLocale(Locale locale) {
              this.locale = locale;
          }

  - record_key: CART-ENT-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      A CartItem entity SHALL have the following attributes: itemId (unique identifier),
      productId (product reference), category (product category), name (product name),
      attribute (product variant or attribute), quantity (number of units), and
      unitCost (price per unit). The entity SHALL provide a getTotalCost() method that
      returns quantity * unitCost.
    confidence: high
    confidence_basis: >
      The CartItem class is a value object with all fields defined and immutable
      (initialized in constructor only). All fields are accessed via public getter
      methods. The getTotalCost() calculation is explicit.
    risk_class: operational
    basis: >
      The CartItem class (line 46-98 in CartItem.java) defines all attributes as
      private instance variables, initialized via constructor. Public getter methods
      are provided for each. The getTotalCost() method (line 95-97) explicitly
      calculates quantity * unitCost.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 46
        line_end: 98
        excerpt: |
          public class CartItem implements Serializable {
              private String itemId;
              private String productId;
              private String category;
              private String name;
              private String attribute;
              private int quantity;
              private double unitCost;

              public CartItem(String itemId, String productId, String category, String name,
                              String attribute, int quantity, double unitCost) {
                  this.category = category;
                  this.itemId = itemId;
                  this.productId = productId;
                  this.name = name;
                  this.attribute = attribute;
                  this.quantity = quantity;
                  this.unitCost = unitCost;
              }

              // ... getter methods ...

              public double getTotalCost() {
                  return quantity * unitCost;
              }

  - record_key: CART-WF-0001
    kind: workflow
    capability_key: shopping-cart
    requirement: >
      GIVEN a shopping cart in an initial empty state,
      WHEN a user invokes addItem(itemID) with a catalog item ID,
      THEN the item SHALL be added to the cart with quantity 1,
      AND WHEN the user invokes getItems(),
      THEN the returned collection SHALL include a CartItem with the product details
      fetched from the catalog using the current locale.
    confidence: medium
    confidence_basis: >
      The workflow is inferred from the code structure and method signatures. Both
      addItem() and getItems() are public interface methods. However, there is no
      explicit business process documentation, and the error handling in getItems()
      (CatalogException is caught but not re-thrown) leaves the failure case ambiguous.
    risk_class: operational
    basis: >
      The workflow is constructed from the public interface ShoppingCartLocal and
      the implementation in ShoppingCartLocalEJB. The addItem(String itemID) adds
      an item with quantity 1 (line 111-113). The getItems() method (line 83-109)
      retrieves items from the cart and enriches them with catalog data.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 61
        line_end: 65
        excerpt: |
          public void addItem(String itemID);

          public Collection getItems();

  - record_key: CART-WF-0002
    kind: workflow
    capability_key: shopping-cart
    requirement: >
      GIVEN a shopping cart with one or more items,
      WHEN a user invokes updateItemQuantity(itemID, newQty),
      THEN IF newQty > 0, the item quantity SHALL be updated to newQty,
      AND IF newQty <= 0, the item SHALL be removed from the cart.
    confidence: high
    confidence_basis: >
      The workflow is explicitly implemented with an if-else structure in the code.
      The boundary condition (newQty > 0) is the determining factor. No ambiguity.
    risk_class: operational
    basis: >
      The updateItemQuantity(String itemID, int newQty) method (line 123-127) first
      removes the item, then checks if newQty > 0 before re-adding it. This implements
      the two-path workflow.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }

  - record_key: CART-BR-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The shopping cart SHALL be implemented as a stateful session EJB with container-managed
      transactions. The transaction attribute for all public methods SHALL be "Required",
      meaning each method invocation participates in a transaction.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml declarative configuration explicitly defines container-transaction
      elements for each public method, all with trans-attribute=Required. This is the
      canonical source of truth for transaction semantics.
    risk_class: operational
    basis: >
      The ejb-jar.xml (lines 79-164) declares container-transaction elements for
      addItem, deleteItem, updateItemQuantity, setLocale, getItems, getCount,
      getSubTotal, and empty methods. All specify trans-attribute=Required.
      The session-type is declared as Stateful (line 53).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/ejb-jar.xml
        line_start: 47
        line_end: 68
        excerpt: |
          <session>
            <display-name>ShoppingCartSB</display-name>
            <ejb-name>ShoppingCartEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.cart.ejb.ShoppingCartLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.cart.ejb.ShoppingCartLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.cart.ejb.ShoppingCartLocalEJB</ejb-class>
            <session-type>Stateful</session-type>
            <transaction-type>Container</transaction-type>
            <security-identity>
              <description></description>
              <use-caller-identity></use-caller-identity>
            </security-identity>
          </session>

