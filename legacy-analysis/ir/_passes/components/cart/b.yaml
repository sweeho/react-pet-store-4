  - record_key: CART-BR-0003
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      All public methods on the shopping cart SHALL be accessible without role-based
      access control. The unchecked element in the method-permission specifies that
      no specific security role is required to invoke any method on the
      ShoppingCartEJB.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml contains an explicit unchecked element with a wildcard method
