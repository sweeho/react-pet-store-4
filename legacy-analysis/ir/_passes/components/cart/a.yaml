records:
  - record_key: SCART-ENTITY-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      The system SHALL maintain a CartItem entity representing a single line item in a
      shopping cart, with attributes: itemId (unique identifier), productId, category,
      product name, attribute, quantity, and unitCost.
    confidence: high
    confidence_basis: >
      CartItem is a serializable POJO class with all fields directly visible in source
      (lines 48-54) and getters for each field (lines 68-93). The class is used consistently
      throughout the shopping cart EJB to represent items. Both schema and code enforce
      this structure.
    risk_class: operational
    basis: >
      CartItem.java class definition lines 46-98 shows the complete entity structure with
      explicit field declarations and getter methods. No inheritance or external configuration
      modifies this structure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 46
        line_end: 98
        excerpt: |
          public class CartItem implements Serializable {
              private String itemId;
              private String productId;
              private String category;
              private String name;
              private String attribute;
              private int quantity;
              private double unitCost;
              // constructor and getters...
              public double getTotalCost() {
                  return quantity * unitCost;
              }
          }

