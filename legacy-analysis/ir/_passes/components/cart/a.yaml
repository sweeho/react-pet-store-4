                <method-param>int</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>

  - record_key: SCART-REQUIREMENT-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL retrieve the contents of the shopping cart as a collection of
      CartItem objects populated with current item details from the Catalog component,
      using the configured Locale for localization. The operation SHALL execute within
      a Required transaction context.
    confidence: high
    confidence_basis: >
      getItems() is declared in ShoppingCartLocal interface (line 65) and implemented in
      ShoppingCartLocalEJB (lines 83-109). Implementation looks up Catalog via EJB local
      reference and calls getItem() for each cart entry to populate CartItem objects with
      current product details. Locale is used in catalog lookup (line 94). Transaction
      attribute Required is declared in ejb-jar.xml (lines 126-134).
    risk_class: operational
    basis: >
      ShoppingCartLocal interface specifies getItems() method. Implementation in
      ShoppingCartLocalEJB iterates over internal HashMap, looks up each item in Catalog,
      and builds CartItem objects with current product data. Local EJB access to Catalog
      is performed via JNDI lookup.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 65
        line_end: 65
        excerpt: |
          public Collection getItems();
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 83
        line_end: 109
        excerpt: |
          public Collection getItems() {
              // get a catalog helper using local EJB Access
              CatalogHelper catalog = new CatalogHelper(false);
              HashMap map = getDetails();
              ArrayList items = new ArrayList();
              Iterator it = map.keySet().iterator();
              while (it.hasNext()) {
                  String key = (String)it.next();
                  Integer value = (Integer)map.get(key);
                  Item item = null;
                  try {
                      item = catalog.getItem(key, locale);
                      // convert catalog item to cart item
                      CartItem ci = new CartItem(item.getItemId(),
                                             item.getProductId(),
                                             item.getCategory(),
                                             item.getProductName(),
                                             item.getAttribute(),
                                             value.intValue(),
                                             item.getListCost());
                      items.add(ci);
                  } catch (CatalogException cce) {
                      System.out.println("ShoppingCartEJB caught: " + cce);
                  }
              }
              return items;
          }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/ejb-jar.xml
        line_start: 126
        line_end: 134
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>ShoppingCartEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getItems</method-name>
              <method-params/>
            </method>
           <trans-attribute>Required</trans-attribute>
          </container-transaction>

  - record_key: SCART-REQUIREMENT-0005
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL calculate the cart subtotal as the sum of (unitCost × quantity)
      for all items currently in the shopping cart. The operation SHALL execute within
      a Required transaction context.
    confidence: high
    confidence_basis: >
      getSubTotal() is declared in ShoppingCartLocal interface (line 71) and implemented
      in ShoppingCartLocalEJB (lines 133-144). Implementation retrieves current items via
      getItems(), iterates through them, multiplies unitCost by quantity, and sums the
      results (line 141). Transaction attribute Required is declared in ejb-jar.xml
      (lines 146-154).
    risk_class: financial
    basis: >
      ShoppingCartLocal interface specifies getSubTotal() method returning Double.
      Implementation in ShoppingCartLocalEJB shows explicit calculation: iterating items
      and summing (unitCost * quantity). CartItem.getTotalCost() performs the same
      calculation (CartItem.java line 96).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 71
        line_end: 71
        excerpt: |
          public Double getSubTotal();
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
               Collection items = getItems();
               if (items == null) return null;
               // put the subtotal in the request
               double ret = 0.0d;
               // total up the quantities
               for (Iterator it =items.iterator(); it.hasNext(); ) {
                   CartItem i = (CartItem) it.next();
                   ret += (i.getUnitCost() * i.getQuantity()) ;
               }
               return new Double(ret);
          }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 95
        line_end: 97
        excerpt: |
          public double getTotalCost() {
              return quantity * unitCost;
          }

