  - record_key: SCART-REQUIREMENT-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL update the quantity of an item in the shopping cart. If the
      new quantity is less than or equal to zero, the item SHALL be removed from the
      cart. The operation SHALL execute within a Required transaction context.
    confidence: high
    confidence_basis: >
      updateItemQuantity(String itemID, int newQty) is declared in ShoppingCartLocal
      interface (line 69) and implemented in ShoppingCartLocalEJB (lines 123-127). The
      implementation removes the old entry and conditionally re-adds it only if newQty > 0.
      ejb-jar.xml declares this method with trans-attribute Required (lines 101-112).
    risk_class: operational
    basis: >
      ShoppingCartLocal interface specifies updateItemQuantity(String itemID, int newQty).
      Implementation in ShoppingCartLocalEJB shows explicit logic to remove item if quantity
      is <= 0 (line 126). Declarative transaction attribute enforces consistency.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 69
        line_end: 69
        excerpt: |
          public void updateItemQuantity(String itemID, int newQty);
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/ejb-jar.xml
