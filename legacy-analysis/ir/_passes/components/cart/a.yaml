  - record_key: SCART-REQUIREMENT-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL add an item to the shopping cart with the specified itemID.
      If the item already exists in the cart, its quantity SHALL be set to the provided
      value (or 1 if not specified). The operation SHALL execute within a Required
      transaction context.
    confidence: high
    confidence_basis: >
      addItem(String itemID) and addItem(String itemID, int qty) methods are declared
      in ShoppingCartLocal interface (line 61) and implemented in ShoppingCartLocalEJB
      (lines 111-117). Both forms use HashMap.put() to add/overwrite items. ejb-jar.xml
      declares addItem with trans-attribute Required (lines 83-88). This is a fundamental
      operation visible in all pass sources.
    risk_class: operational
    basis: >
      ShoppingCartLocal interface specifies addItem(String itemID) method. Implementation
      in ShoppingCartLocalEJB provides two overloads: one that defaults quantity to 1,
      and one that accepts explicit quantity. Container-managed transaction attribute
      Required is declared in ejb-jar.xml.
    traces:
