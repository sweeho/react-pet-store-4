  - record_key: checkout-payment-0002
    kind: requirement
    capability_key: checkout-payment
    requirement: >
      The system SHALL enforce a one-to-one relationship between PurchaseOrder and
      CreditCard, such that every purchase order MUST have exactly one credit card
      associated with it, and the credit card SHALL be deleted when its purchase order
      is deleted.
    confidence: high
    confidence_basis: >
      The relationship is declared in ejb-jar.xml with cascade-delete, and the
      ejbPostCreate method programmatically enforces credit card creation during PO
      creation. The relationship appears in both the declarative configuration and
      implementation code.
    risk_class: financial
    basis: >
      ejb-jar.xml defines PurchaseOrder-Card relationship at line 342-366 with
      multiplicity One on both sides and cascade-delete enabled. PurchaseOrderEJB.ejbPostCreate
      creates a CreditCardLocal via CreditCardLocalHome.create() when a PO is created.
      getData() method retrieves the credit card.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 342
        line_end: 366
        excerpt: |
          <ejb-relation>
            <ejb-relation-name>PurchaseOrder-Card</ejb-relation-name>
            <ejb-relationship-role>
              <ejb-relationship-role-name>purchaseorder-has-card</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <relationship-role-source>
                <ejb-name>PurchaseOrderEJB</ejb-name>
              </relationship-role-source>
              <cmr-field>
                <cmr-field-name>creditCard</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>card-for-purchaseorder</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cascade-delete />
              <relationship-role-source>
                <ejb-name>CreditCardEJB</ejb-name>
              </relationship-role-source>
            </ejb-relationship-role>
          </ejb-relation>
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 220
        line_end: 224
        excerpt: |
          CreditCardLocalHome cardref = (CreditCardLocalHome)
              serviceLocator.getLocalHome(JNDINames.CARD_EJB);
          CreditCardLocal cardloc = (CreditCardLocal)
              cardref.create(purchaseOrder.getCreditCard());
    stack_metadata:
      ejb.bean: PurchaseOrderEJB
      relationship: One-To-One

