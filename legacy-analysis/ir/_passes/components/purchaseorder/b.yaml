findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
    description: >
      Line 268 shows billingInfo and shippingInfo are set to the same object:
      "purchaseOrder.setShippingInfo(purchaseOrder.getBillingInfo())". This XXX comment
      suggests this is a known issue. It is unclear whether billing and shipping info
      should be identical, or if this is a bug where separate address entities should
      be created for each. A requirement decision is needed on whether customer can have
      different billing and shipping addresses.
