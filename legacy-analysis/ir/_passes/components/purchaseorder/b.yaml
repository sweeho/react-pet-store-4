  - record_key: order-management-0003
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL track partial shipment fulfillment on each line item such that
      quantityShipped can be incremented as invoices are received, and a purchase order
      is considered completely fulfilled only when all line items have quantityShipped
      equal to their ordered quantity.
    confidence: medium
    confidence_basis: >
      The mechanism is clearly implemented in PurchaseOrderHelper.processInvoice() which
      increments quantityShipped and checks fulfillment. The LineItem fields exist in
      both schema and code. However, there is no declarative configuration specifying
      the fulfillment logic; it is entirely programmatic.
    risk_class: operational
    basis: >
      LineItemEJB has quantityShipped field. PurchaseOrderHelper.processInvoice() method
      iterates through line items, increments quantityShipped based on received invoices,
      then checks if quantity == quantityShipped for all items to determine if PO is
      completely fulfilled. Returns true if all fulfilled, false otherwise.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 103
        excerpt: |
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(lineItemIds.containsKey(li.getItemId())) {
                    Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                    li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                }
              }
              liColl = po.getLineItems();
              liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() != li.getQuantityShipped()) {
                    return false;
                }
              }
              return true;
          }
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 262
        line_end: 271
        excerpt: |
          <cmp-field>
            <field-name>quantity</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>unitPrice</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>quantityShipped</field-name>
          </cmp-field>
    stack_metadata:
      ejb.bean: PurchaseOrderEJB, LineItemEJB

