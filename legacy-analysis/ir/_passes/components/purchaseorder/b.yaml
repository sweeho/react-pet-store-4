  - record_key: order-management-0001
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL enforce a one-to-many relationship between PurchaseOrder and
      LineItem, such that every purchase order MUST have at least one line item, and
      line items SHALL be deleted when their purchase order is deleted.
    confidence: high
    confidence_basis: >
      The relationship is declared with One-to-Many multiplicity and cascade-delete.
      DTD shows LineItem+ (one or more required). ejbPostCreate adds line items during
      PO creation, enforcing the minimum cardinality at creation time.
    risk_class: operational
    basis: >
      ejb-jar.xml defines PurchaseOrder-LineItem relationship at lines 372-397 with
      One-to-Many multiplicity and cascade-delete. PurchaseOrderEJB.ejbPostCreate loops
      through purchaseOrder.getLineItems() and creates each via addLineItem(). PurchaseOrder.dtd
      declares LineItem+ requiring at least one.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 372
        line_end: 397
        excerpt: |
          <ejb-relation>
            <ejb-relation-name>PurchaseOrder-LineItem</ejb-relation-name>
            <ejb-relationship-role>
              <ejb-relationship-role-name>purchaseorder-has-lineitems</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <relationship-role-source>
                <ejb-name>PurchaseOrderEJB</ejb-name>
              </relationship-role-source>
              <cmr-field>
                <cmr-field-name>lineItems</cmr-field-name>
                <cmr-field-type>java.util.Collection</cmr-field-type>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>lineItem-for-purchaseorder</ejb-relationship-role-name>
              <multiplicity>Many</multiplicity>
              <cascade-delete />
              <relationship-role-source>
                <ejb-name>LineItemEJB</ejb-name>
              </relationship-role-source>
            </ejb-relationship-role>
          </ejb-relation>
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 225
        line_end: 234
        excerpt: |
          LineItemLocalHome lineItemref = (LineItemLocalHome)
              serviceLocator.getLocalHome(JNDINames.LI_EJB);
          Collection litems = purchaseOrder.getLineItems();
          Iterator it = litems.iterator();
          while((it != null) && (it.hasNext())) {
              LineItem li = (LineItem) it.next();
              LineItemLocal lineItemloc = (LineItemLocal)
                  lineItemref.create(li, 0);
              addLineItem(lineItemloc);
          }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard, LineItem+)>
    stack_metadata:
      ejb.bean: PurchaseOrderEJB
      relationship: One-To-Many

