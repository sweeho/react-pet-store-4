findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
    description: >
      Line 268 contains XXX comment indicating unresolved design: billingInfo and shippingInfo
      are both set to the same ContactInfo value. This appears to be a workaround or placeholder,
      but the intent is unclear. Either shipping and billing must be identical (single ContactInfo
      reused), or this represents incomplete implementation. Requires clarification on whether
      separate contact info for shipping and billing is supported.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
    description: >
      Address and ContactInfo relationship structure (lines 312-335) shows One-to-One
      relationship between ContactInfo and Address with cascade-delete on Address. However,
      PurchaseOrder.java value object does not directly model Address; it only references
      ContactInfo. The navigation path from PurchaseOrder → ContactInfo → Address is implicit
      in the object model but not directly visible in the PurchaseOrder value object itself.
      This may be intentional encapsulation or an incomplete mapping.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/enter_order_information.jsp
    description: >
      JSP form fields for shipping and billing address differ slightly: the billing form
      includes China as a country option (line 155) while the shipping form does not (line 297
      shows only US, Canada, Japan). Additionally, some fields like address_2 (street address line 2)
      are optional in markup (no validation attribute) while address_1 is required. This suggests
      different validation rules for shipping vs. billing, but no corresponding server-side
      enforcement is visible in the PurchaseOrder or related entity definitions.
