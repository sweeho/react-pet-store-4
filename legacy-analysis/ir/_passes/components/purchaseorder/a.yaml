  - record_key: order-management-business-rule-0001
    kind: business-rule
    capability_key: order-management
    requirement: >
      GIVEN a purchase order with multiple line items,
      WHEN processing invoice received from supplier containing quantityShipped values for line items,
      THEN the system SHALL accumulate quantityShipped for each line item by adding the newly
      received quantity to the existing quantityShipped value.
    confidence: high
    confidence_basis: >
      Explicit logic in PurchaseOrderHelper.processInvoice() method accumulates shipped quantities
      (line 89: `li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue())`).
      Method signature and comments describe the invoice processing workflow. Logic is not
      commented but is clear from variable naming and operation sequence.
    risk_class: financial
    basis: >
      PurchaseOrderHelper.java implements invoice aggregation. The method iterates through
      line items and updates quantityShipped field for each item found in the incoming
      lineItemIds map.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 91
        excerpt: |
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {
            //set the quantity of line items shipped in the PO
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                          Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                  li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                  }
            }//end while

  - record_key: order-management-business-rule-0002
    kind: business-rule
    capability_key: order-management
    requirement: >
      GIVEN a purchase order after processing invoices,
      WHEN the system evaluates fulfillment status,
      THEN the order is completely fulfilled if and only if for every line item,
      quantityShipped equals quantity (all items fully shipped). If any line item has
      quantityShipped less than quantity, the order remains incomplete.
    confidence: high
    confidence_basis: >
      PurchaseOrderHelper.processInvoice() contains explicit loop (lines 96-101) checking
      if quantity != quantityShipped for any line item. Return value false indicates incomplete,
      true indicates complete. Logic is deterministic and unambiguous. Method comment states
      "it will return true to indicate all invoices for a purchase order have been joined
      together and the order is completely fulfilled."
    risk_class: operational
    basis: >
      PurchaseOrderHelper.java implements completion check by comparing quantities across
      all line items. No alternate fulfillment rules found in codebase.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 93
        line_end: 103
        excerpt: |
          // now loop through all LIs and see if all are shipped completely
          liColl = po.getLineItems();
          liIt = liColl.iterator();
          while((liIt != null) && (liIt.hasNext())) {
            LineItemLocal li = (LineItemLocal) liIt.next();
            if(li.getQuantity() != li.getQuantityShipped()) {
                return false;
                }
          }//end while
          return true;

  - record_key: order-management-business-rule-0003
    kind: business-rule
    capability_key: order-management
    requirement: >
      The system SHALL support querying purchase orders by date range. A query with two date
      parameters (as milliseconds since epoch) SHALL return all purchase orders with poDate
      falling between the first and second date (inclusive).
    confidence: medium
    confidence_basis: >
      findPOBetweenDates() declared in ejb-jar.xml as EJB-QL query with explicit date range
      filter (BETWEEN clause). Signature and method name confirm range-based retrieval.
      However, no usage examples or tests found in the purchaseorder component itself, so
      confidence is medium rather than high.
    risk_class: operational
    basis: >
      ejb-jar.xml defines query at lines 117-127 with EJB-QL SELECT statement using BETWEEN
      operator. Method accessible on PurchaseOrderLocalHome interface for local clients.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 117
        line_end: 127
        excerpt: |
          <query>
            <description></description>
            <query-method>
              <method-name>findPOBetweenDates</method-name>
              <method-params>
                <method-param>long</method-param>
                <method-param>long</method-param>
              </method-params>
            </query-method>
            <ejb-ql>SELECT OBJECT(a) From PurchaseOrder a WHERE a.poDate BETWEEN ?1 AND ?2</ejb-ql>
          </query>

  - record_key: order-management-workflow-0001
    kind: workflow
    capability_key: order-management
    requirement: >
      GIVEN a new purchase order to be created,
      WHEN ejbCreate is invoked with a PurchaseOrder value object,
      THEN the system SHALL extract order header fields (orderId, userId, emailId, orderDate,
      locale, totalPrice) and persist them as CMP fields. The system SHALL then invoke
      ejbPostCreate to establish relationships with ContactInfo, CreditCard, and LineItem
      entities.
    confidence: high
    confidence_basis: >
      PurchaseOrderEJB.java implements two-phase creation: ejbCreate (lines 197-205) handles
      header fields; ejbPostCreate (lines 211-238) handles CMR field initialization.
      Both methods have clear contracts. EJB specification requires both methods to succeed
      for entity creation to complete.
    risk_class: financial
    basis: >
      PurchaseOrderEJB.java lines 197-238 show complete lifecycle. ejbCreate initializes
      all six CMP fields. ejbPostCreate uses ServiceLocator to look up and create ContactInfo,
      CreditCard, and LineItem entities.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 197
        line_end: 238
        excerpt: |
          public String ejbCreate(PurchaseOrder purchaseOrder) throws CreateException {
                setPoId(purchaseOrder.getOrderId());
                setPoUserId(purchaseOrder.getUserId());
                setPoEmailId(purchaseOrder.getEmailId());
                setPoDate(purchaseOrder.getOrderDate().getTime());
                setPoLocale(purchaseOrder.getLocale().toString());
                setPoValue(purchaseOrder.getTotalPrice());
                return null;
          }

          public void ejbPostCreate(PurchaseOrder purchaseOrder)
                                                   throws CreateException {
              try {
                  ServiceLocator serviceLocator = new ServiceLocator();
                  ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                      serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
                  ContactInfoLocal cinfoloc = (ContactInfoLocal)
                      cinforef.create(purchaseOrder.getShippingInfo());
                  setContactInfo(cinfoloc);
                  CreditCardLocalHome cardref = (CreditCardLocalHome)
                      serviceLocator.getLocalHome(JNDINames.CARD_EJB);
                  CreditCardLocal cardloc = (CreditCardLocal)
                      cardref.create(purchaseOrder.getCreditCard());
                  setCreditCard(cardloc);
                  LineItemLocalHome lineItemref = (LineItemLocalHome)
                      serviceLocator.getLocalHome(JNDINames.LI_EJB);
                  Collection litems = purchaseOrder.getLineItems();
                  Iterator it = litems.iterator();
                  while((it != null) && (it.hasNext())) {
                      LineItem li = (LineItem) it.next();
                      LineItemLocal lineItemloc = (LineItemLocal)
                          lineItemref.create(li, 0);
                      addLineItem(lineItemloc);
                  }
              } catch(ServiceLocatorException ne) {
                  throw new CreateException("ServiceLocator Ex while persisting PO CMR :" + ne.getMessage());
              }
          }

