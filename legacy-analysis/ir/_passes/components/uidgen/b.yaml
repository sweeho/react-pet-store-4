records:
  - record_key: admin-operations-req-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL generate unique sequential identifiers by combining a
      caller-provided prefix with an incremented counter value.
    confidence: high
    confidence_basis: >
      This is the primary business function of the module, explicitly implemented
      in UniqueIdGeneratorEJB.getUniqueId() and CounterEJB.getNextValue(), confirmed
      by both the interface signatures and the declarative configuration in ejb-jar.xml.
    risk_class: operational
    basis: >
      The getUniqueId(String idPrefix) method accepts a prefix parameter and delegates
      to CounterEJB.getNextValue(), which concatenates the counter name with an
      incremented counter value and returns it as a String.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorLocal.java
        line_start: 40
        line_end: 44
        excerpt: |
          public interface UniqueIdGeneratorLocal extends javax.ejb.EJBLocalObject {
              /** param idPrefix is the prefix needed for each of the counter values. It must not be null. */
              public String getUniqueId(String idPrfix);
          }
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterLocal.java
        line_start: 41
        line_end: 44
        excerpt: |
          public interface CounterLocal extends javax.ejb.EJBLocalObject {
              public String getNextValue();
          }
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 67
        line_end: 71
        excerpt: |
          public String getNextValue() {
              int count = getCounter() + 1;
              setCounter(count);
              return getName() + String.valueOf(count);
          }

  - record_key: admin-operations-req-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL initialize a new counter with value 0 when created for a
      given counter name.
    confidence: high
    confidence_basis: >
      Both the code implementation and the declarative configuration explicitly
      set counter to 0 in the ejbCreate method, with no variations observed.
    risk_class: operational
    basis: >
      CounterEJB.ejbCreate() explicitly calls setCounter(0) to initialize the
      counter field when a new counter entity is created.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 58
        line_end: 62
        excerpt: |
          public String ejbCreate(String name) throws CreateException {
              setName(name);
              setCounter(0);
              return null;
          }

  - record_key: admin-operations-req-0003
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL look up an existing counter by name before attempting to
      create a new one.
    confidence: high
    confidence_basis: >
      The lookup pattern is implemented consistently in the getCounter() method
      with explicit try/catch handling for FinderException, indicating this is
      a deliberate design pattern for reuse.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.getCounter() calls clh.findByPrimaryKey(name) first,
      and only creates a new counter via clh.create(name) if a FinderException
      is caught, ensuring counter reuse.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 74
        line_end: 86
        excerpt: |
          private CounterLocal getCounter(String name) {
              try {
                  CounterLocal counter = null;
                  try {
                      counter = clh.findByPrimaryKey(name);
                  } catch (FinderException fe) {
                      counter = clh.create(name);
                  }
                  return counter;
              } catch (CreateException ce) {
                  throw new EJBException("Could not create counter " + name + ". Error: " + ce.getMessage());
              }
          }

  - record_key: admin-operations-req-0004
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL increment the counter value by exactly 1 each time
      getNextValue is invoked.
    confidence: high
    confidence_basis: >
      The increment operation is hardcoded in the CounterEJB.getNextValue() method
      with a straightforward addition operation and no conditional logic affecting
      the increment amount.
    risk_class: operational
    basis: >
      CounterEJB.getNextValue() increments by calling getCounter() + 1, storing
      the result back to the counter field.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 67
        line_end: 71
        excerpt: |
          public String getNextValue() {
              int count = getCounter() + 1;
              setCounter(count);
              return getName() + String.valueOf(count);
          }

  - record_key: admin-operations-ent-0001
    kind: entity
    capability_key: admin-operations
    requirement: >
      The system SHALL maintain a Counter entity with Container-Managed Persistence
      (CMP 2.x) containing two fields: name (String, primary key) and counter (int).
    confidence: high
    confidence_basis: >
      The CMP configuration is explicitly declared in ejb-jar.xml with abstract
      methods defined in CounterEJB, and no additional fields are observed in
      the implementation.
    risk_class: operational
    basis: >
      ejb-jar.xml declares CounterEJB as a CMP 2.x entity with two cmp-fields:
      counter (no description) and name (no description), with name as the
      primkey-field. The abstract methods in CounterEJB define getters and setters
      for both fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 46
        line_end: 70
        excerpt: |
          <entity>
            <display-name>CounterEB</display-name>
            <ejb-name>CounterEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.uidgen.counter.ejb.CounterLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.uidgen.counter.ejb.CounterLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.uidgen.counter.ejb.CounterEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <reentrant>False</reentrant>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>Counter</abstract-schema-name>
            <cmp-field>
              <description>no description</description>
              <field-name>counter</field-name>
            </cmp-field>
            <cmp-field>
              <description>no description</description>
              <field-name>name</field-name>
            </cmp-field>
            <primkey-field>name</primkey-field>
          </entity>
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 44
        line_end: 54
        excerpt: |
          public abstract class CounterEJB implements javax.ejb.EntityBean {
              private EntityContext context = null;
              // getters and setters for CMP fields
              //====================================
              public abstract int getCounter();
              public abstract void setCounter(int counter);
              public abstract String getName();
              public abstract void setName(String name);

  - record_key: admin-operations-ent-0002
    kind: entity
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a stateless session bean (UniqueIdGeneratorEJB)
      that manages unique ID generation and delegates to the Counter entity bean.
    confidence: high
    confidence_basis: >
      The session bean is explicitly declared in ejb-jar.xml with session-type
      Stateless, and the implementation follows the stateless session bean pattern
      with no instance state beyond JNDI references.
    risk_class: operational
    basis: >
      ejb-jar.xml declares UniqueIdGeneratorEJB as a Stateless session bean.
      The bean's ejbCreate method initializes JNDI references to the Counter bean,
      and business methods are stateless.
    traces:
