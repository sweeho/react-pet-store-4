  - record_key: PCAT-REQUIREMENT-0009
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL search Items by a search query text. The query text SHALL be
      tokenized by whitespace into individual keywords. The system SHALL search for
      items matching any of the keywords across item descriptions, names, or other
      indexed fields. Results SHALL be paginated using start position and count parameters.
      The operation SHALL execute within a Required transaction context.
    confidence: high
    confidence_basis: >
      CatalogLocal.searchItems(String searchQuery, int start, int count, Locale l) is
      declared (lines 69-70) with Required transaction attribute (lines 169-181).
      GenericCatalogDAO.searchItems() (lines 343-398) tokenizes the query string using
      StringTokenizer (line 346), creates a keyword set, then constructs SQL parameter
      values with wildcards (lines 361-365): "%keyword%" for each keyword. Results are
      paginated identically to other item queries.
    risk_class: operational
    basis: >
