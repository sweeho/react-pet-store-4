  - record_key: PCAT-REQUIREMENT-0004
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL retrieve a paginated list of all Categories using pagination
      parameters (start position and count). The result SHALL include a Page object
      indicating whether a next page is available. The operation SHALL execute within
      a Required transaction context.
    confidence: high
    confidence_basis: >
      CatalogLocal.getCategories(int start, int count, Locale l) is declared (line 57)
      with Required transaction attribute (lines 169-181). GenericCatalogDAO.getCategories()
      (lines 182-210) uses ResultSet.absolute(start+1) to position to the start row,
      then iterates up to count rows, setting hasNext based on whether resultSet.next()
      succeeds after reaching count limit.
    risk_class: operational
    basis: >
      The pagination logic uses JDBC ResultSet positioning (absolute() and next()).
      The hasNext flag is determined by whether a row exists beyond the count limit.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 182
        line_end: 210
        excerpt: |
          public Page getCategories(int start, int count, Locale locale) throws CatalogDAOSysException {
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[] { locale.toString() };
                  statement = buildSQLStatement(connection, sqlStatements, XML_GET_CATEGORIES, parameterValues);
                  resultSet = statement.executeQuery();
                  if (start >= 0 && resultSet.absolute(start + 1)) {
                      boolean hasNext = false;
                      List categories = new ArrayList();
                      do {
                          categories.add(new Category(resultSet.getString(1).trim(),
                                                      resultSet.getString(2),
                                                      resultSet.getString(3)));
                      } while ((hasNext = resultSet.next()) && (--count > 0));
                      return new Page(categories, start, hasNext);
                  }
                  return Page.EMPTY_PAGE;
    stack_metadata:
      ejb.transaction: Required
      db.object: SELECT from category table (locale-specific) with pagination

