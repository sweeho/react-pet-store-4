  - record_key: PCAT-REQUIREMENT-0002
    kind: requirement
    capability_key: product-catalog
    requirement: >
      All catalog queries SHALL accept a Locale parameter to support internationalization.
      The system SHALL support at least three locales: US (default), Japan, and China.
      Locale-specific database tables SHALL be used: product_ja, product_zh for Japan
      and China respectively.
    confidence: high
    confidence_basis: >
      DatabaseNames.java lines 55-65 show explicit locale-to-table-name mapping for
      US, Japan (ja), and China (zh). Every DAO method accepts Locale as a parameter
      and passes locale.toString() to the SQL statement builder. The GenericCatalogDAO
      uses this mapping in parameterized queries.
    risk_class: operational
    basis: >
      DatabaseNames.getTableName(tableName, Locale) method (lines 55-65) explicitly maps
      locales to suffixed table names. All DAO methods pass locale.toString() as the first
      parameter to buildSQLStatement(), indicating parameterized SQL table resolution.
