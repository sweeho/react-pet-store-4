  - record_key: PCAT-ENTITY-0004
    kind: entity
    capability_key: product-catalog
    requirement: >
      The system SHALL maintain a Page entity representing a paginated result set,
      with attributes: objects (list of results), start (pagination start index),
      and hasNext (boolean indicating if more results are available).
    confidence: high
    confidence_basis: >
      Page class is visible with all fields and methods (lines 45-94). The hasNext
      flag indicates pagination state, isPreviousPageAvailable() checks if start > 0,
      and getStartOfNextPage() computes the next position. All pagination results are
      returned as Page objects.
    risk_class: operational
    basis: >
      Page.java shows the complete pagination model with three key attributes:
      objects (ArrayList), start (int), and hasNext (boolean). Methods compute
      pagination boundaries based on these values and the size of the objects list.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 45
        line_end: 94
        excerpt: |
          public class Page implements Serializable {
              List objects;
              int start;
              boolean hasNext;
              public Page(List l, int s, boolean hasNext) {
                  objects = new ArrayList(l);
                  start = s;
                  this.hasNext = hasNext;
              }
              public List getList() { return objects; }
              public boolean isNextPageAvailable() { return hasNext; }
              public boolean isPreviousPageAvailable() { return start > 0; }
              public int getStartOfNextPage() { return start + objects.size(); }
              public int getStartOfPreviousPage() { return Math.max(start-objects.size(), 0); }
              public int getSize() { return objects.size(); }
          }
    stack_metadata:
      framework: stateless EJB catalog component

  - record_key: PCAT-REQUIREMENT-0001
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The Catalog service SHALL be implemented as a Stateless Session EJB with
      Container-Managed transactions. The EJB SHALL initialize a DAO instance
      via CatalogDAOFactory.getDAO() during ejbCreate().
    confidence: high
    confidence_basis: >
      ejb-jar.xml explicitly declares session-type as Stateless (line 55) and
      transaction-type as Container (line 56). CatalogEJB.ejbCreate() method (lines 65-73)
      instantiates the DAO via factory. All operations delegate to the DAO layer.
    risk_class: operational
    basis: >
      ejb-jar.xml configuration and CatalogEJB.java implementation show the EJB
      is stateless with container-managed transactions. The factory pattern is used
      to obtain database-specific DAO implementations.
