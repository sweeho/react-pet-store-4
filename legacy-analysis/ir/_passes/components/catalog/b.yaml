  - record_key: PCAT-ENTITY-0003
    kind: entity
    capability_key: product-catalog
    requirement: >
      The system SHALL maintain an Item entity representing an inventory item for sale,
      with attributes: category, productId, productName, itemId (unique identifier),
      imageLocation, description, five attribute fields (attribute1-5), listPrice,
      and unitCost.
    confidence: high
    confidence_basis: >
      Item is a Serializable POJO class with all fields explicitly declared (lines 49-61)
      with getter methods for each (lines 92-139). Attributes are indexed 1-5 via switch
      statement. Constructor at lines 63-90 binds all fields. DAO layer constructs Item
      objects identically in all query methods.
    risk_class: operational
    basis: >
      Item.java class definition shows complete entity structure with 13 private fields and
      getter methods. The getAttribute(int index) method at lines 109-118 shows attributes
      are accessed by 1-based index with default fallback to attribute1.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Item.java
        line_start: 47
        line_end: 141
        excerpt: |
          public class Item implements Serializable {
              private String category;
              private String productId;
              private String productName;
              private String attribute1;
              private String attribute2;
              private String attribute3;
              private String attribute4;
              private String attribute5;
              private String itemId;
              private String description = "none";
              private double listPrice;
              private double unitCost;
              private String imageLocation;
              public Item(...constructor with 13 parameters...) {...}
              public String getAttribute(int index) {
                  switch (index) {
                      case 1: return attribute1;
                      case 2: return attribute2;
                      case 3: return attribute3;
                      case 4: return attribute4;
                      case 5: return attribute5;
                      default: return attribute1;
                  }
              }
          }

  - record_key: PCAT-ENTITY-0004
    kind: entity
    capability_key: product-catalog
    requirement: >
      The system SHALL maintain a Page entity for paginated result sets, containing
      a list of objects, a start index, and a boolean indicator of whether a next page
      is available.
    confidence: high
    confidence_basis: >
      Page class at lines 45-94 defines pagination wrapper with List, int start, and
      boolean hasNext fields (lines 55-59). Methods isNextPageAvailable(), isPreviousPageAvailable(),
      getStartOfNextPage(), and getStartOfPreviousPage() at lines 75-91 implement pagination
      logic. All DAO query methods return Page objects.
    risk_class: operational
    basis: >
      Page.java implements a Serializable wrapper for paginated results. Constructor at lines
      65-71 shows the three-part structure. Empty page constant at lines 52-53 shows Page(Collections.EMPTY_LIST, 0, false).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 45
        line_end: 94
        excerpt: |
          public class Page implements Serializable {
              public static final Page EMPTY_PAGE = new Page(Collections.EMPTY_LIST, 0, false);
              List objects;
              int start;
              boolean hasNext;
              public Page(List l, int s, boolean hasNext) {
                  objects = new ArrayList(l);
                  start = s;
                  this.hasNext = hasNext;
              }
              public boolean isNextPageAvailable() { return hasNext; }
              public boolean isPreviousPageAvailable() { return start > 0; }
              public int getStartOfNextPage() { return start + objects.size(); }
          }

  - record_key: PCAT-REQUIREMENT-0001
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL retrieve a single Category by its ID in the context of a specific
      Locale. If the category does not exist, SHALL return null. The operation SHALL
      execute within a Required transaction context.
    confidence: high
    confidence_basis: >
      CatalogEJB.getCategory(String, Locale) method is declared at line 85 with transaction
      type Required in ejb-jar.xml lines 92-102. GenericCatalogDAO.getCategory() at lines
      159-180 shows the implementation executes a SQL query and returns a Category or null.
      All three elements (EJB interface, transaction config, DAO implementation) are consistent.
    risk_class: operational
    basis: >
      CatalogEJB interface and implementation delegate to DAO. ejb-jar.xml container-transaction
      block specifies Required for getCategory(String, Locale). GenericCatalogDAO at lines
      159-180 executes query, checks resultSet.first(), constructs Category, or returns null.
    traces:
