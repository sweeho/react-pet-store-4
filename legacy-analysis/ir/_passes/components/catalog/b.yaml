  - record_key: PCAT-REQUIREMENT-0002
    kind: requirement
    capability_key: product-catalog
    requirement: >
      The system SHALL retrieve a paginated list of all Categories for a given Locale,
      with pagination starting at a specified index and returning up to a specified count.
      Each page SHALL indicate whether additional pages are available. The operation SHALL
      execute within a Required transaction context.
    confidence: high
    confidence_basis: >
      CatalogEJB.getCategories(int, int, Locale) is defined at line 94 with transaction type
      Required in ejb-jar.xml lines 169-181. GenericCatalogDAO.getCategories() at lines
      182-210 implements pagination using resultSet.absolute(start+1) to position cursor,
      then iterates up to count rows while tracking hasNext flag. All three layers consistent.
    risk_class: operational
    basis: >
      CatalogEJB delegates to DAO. ejb-jar.xml declares getCategories Required. GenericCatalogDAO
      at lines 182-210 shows pagination logic: uses resultSet.absolute(start+1) for positioning,
      decrement count in do-while loop, and track hasNext with resultSet.next(). Returns
      Page(categories, start, hasNext).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/ejb/CatalogEJB.java
        line_start: 94
        line_end: 101
        excerpt: |
          public Page getCategories(int start, int count, Locale l) {
              try {
                  return dao.getCategories(start, count, l);
              }
              catch (CatalogDAOSysException se) {
                  throw new EJBException(se.getMessage());
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/ejb-jar.xml
        line_start: 169
