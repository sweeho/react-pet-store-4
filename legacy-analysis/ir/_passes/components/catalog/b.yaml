  - record_key: PCAT-ENTITY-0001
    kind: entity
    capability_key: product-catalog
    requirement: >
      The system SHALL maintain a Category entity representing a product category with
      attributes: id (unique identifier), name, and description.
    confidence: high
    confidence_basis: >
      Category is a Serializable POJO class with three explicit fields (lines 51-53) and
      corresponding getter methods (lines 66-68). The class structure is identical across
      source and database queries. Both the EJB layer and DAO layer use this entity consistently.
    risk_class: operational
    basis: >
      Category.java defines a simple immutable entity with id, name, description attributes.
      Constructor and getters are declared at lines 55-73. The DAO queries this entity
      in getCategory() and getCategories() methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Category.java
        line_start: 49
        line_end: 74
        excerpt: |
          public class Category implements java.io.Serializable {
              private String id;
              private String name;
              private String description;
              public Category(String id, String name, String description) {
                  this.id = id;
                  this.name = name;
                  this.description = description;
              }
              public String getId() { return id; }
              public String getName() { return name; }
              public String getDescription() { return description; }
          }

