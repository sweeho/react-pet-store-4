        line_start: 103
        line_end: 110
        excerpt: |
          <assembly-descriptor>
            <method-permission>
              <unchecked />
               <method>
                <ejb-name>ManagerEJB</ejb-name>
                <method-intf>LocalHome</method-intf>
                <method-name>remove</method-name>

  - record_key: OM-API-0001
    kind: requirement
    capability_key: order-management
    requirement: >
      The order management service SHALL be exposed only through local EJB interfaces.
      Remote access is not supported. All callers within the application container
      SHALL access the service through LocalHome and Local interfaces.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml defines only local-home and local interfaces for both
      ProcessManagerEJB and ManagerEJB. No remote interfaces are defined.
      This constrains access to in-JVM callers only.
    risk_class: operational
    basis: >
      ejb-jar.xml declares for ProcessManagerEJB:
      - local-home: com.sun.j2ee.blueprints.processmanager.ejb.ProcessManagerLocalHome (line 84)
      - local: com.sun.j2ee.blueprints.processmanager.ejb.ProcessManagerLocal (line 85)
      No remote-home or remote interfaces are declared.
      Same pattern for ManagerEJB (lines 49-50).
    traces:
