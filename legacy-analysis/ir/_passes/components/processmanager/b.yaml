            <local-home>com.sun.j2ee.blueprints.processmanager.ejb.ProcessManagerLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.processmanager.ejb.ProcessManagerLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.processmanager.ejb.ProcessManagerEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegate.java
    description: >
      TransitionDelegate interface and TransitionDelegateFactory class are defined
      but never invoked from any code path in the codebase. Their purpose is unclear
      and they may represent unused extensibility that was never integrated into
      the actual workflow implementation. Human review needed to determine if these
      represent planned functionality or dead code.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/manager/ejb/ManagerEJB.java
    description: >
      ManagerEJB.ejbLoad() and ejbStore() are no-op implementations. It is unclear
      whether the container is configured to call these methods or if CMP field
      synchronization is handled entirely by container defaults. Persistence
      behavior should be verified against the application server configuration.
