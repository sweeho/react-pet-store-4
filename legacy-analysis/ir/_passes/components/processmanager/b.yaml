      The system SHALL support retrieving the current status of an order
      by its order ID. GIVEN an order ID WHEN getStatus is invoked THEN
      the system SHALL return the current status value of that order.
    confidence: high
    confidence_basis: >
      The getStatus method is part of the ProcessManagerLocal interface and is
      marked as a required transaction. It is used to query order status and
      follows the same pattern as getOrdersByStatus.
    risk_class: operational
    basis: >
      ProcessManagerLocal.java line 61 declares getStatus(String orderId).
      ProcessManagerEJB.java lines 81-84 implements getStatus by finding the manager
      and returning its status. The method is marked as required transaction in ejb-jar.xml.
    traces:
