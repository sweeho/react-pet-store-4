  - record_key: OM-PERSISTENCE-0001
    kind: entity
    capability_key: order-management
    requirement: >
      The system SHALL persist order workflow state in a transactional data store.
      Each order manager entity SHALL maintain two persistent fields: orderId (primary key)
      and status. The orderId field uniquely identifies the order and cannot be duplicated.
    confidence: high
    confidence_basis: >
      The ManagerEJB is declared as a CMP 2.x entity bean with Container-managed persistence
      in the ejb-jar.xml. The schema includes explicit declarations of both CMP fields
      and designates orderId as the primary key field. All access to order state
      is through this entity bean.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 46-80 define ManagerEJB as an entity bean with:
      - persistence-type: Container (line 52)
      - cmp-version: 2.x (line 55)
      - cmp-field orderId (lines 61-64)
      - cmp-field status (lines 57-60)
      - primkey-field: orderId (line 65)
      ManagerEJB.java lines 54-58 declare abstract getter/setter methods for orderId and status.
    traces:
