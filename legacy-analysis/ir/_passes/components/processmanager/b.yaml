  - record_key: OM-SEC-0001
    kind: business-rule
    capability_key: order-management
    requirement: >
      All order management methods SHALL use caller identity for authorization.
      Security constraints SHALL be applied to allow unrestricted access using
      the unchecked authorization model.
    confidence: high
    confidence_basis: >
      Both ProcessManagerEJB and ManagerEJB are declared with use-caller-identity
      in their security-identity elements. All methods are marked with unchecked
      in method-permission elements, indicating no role-based restrictions.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 66-69 declare use-caller-identity for ManagerEJB.
      ejb-jar.xml lines 96-99 declare use-caller-identity for ProcessManagerEJB.
      ejb-jar.xml lines 103-261 declare unchecked access for all methods.
    traces:
