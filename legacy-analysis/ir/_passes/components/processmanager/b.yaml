records:
  - record_key: OM-WF-0001
    kind: workflow
    capability_key: order-management
    requirement: >
      The system SHALL manage order workflow through a defined state machine
      with the following states: PENDING, APPROVED, DENIED, SHIPPED_PART, COMPLETED.
      GIVEN an order is created WHEN it enters the workflow THEN its initial status
      SHALL be PENDING.
    confidence: high
    confidence_basis: >
      The order status workflow is explicitly documented in OrderStatusNames.java
      with detailed comments describing the state transitions. The workflow is enforced
      through the CMP entity bean's status field and is used consistently across
      PurchaseOrderMDB, OrderApprovalMDB, and InvoiceMDB.
    risk_class: operational
    basis: >
      OrderStatusNames.java lines 44-67 define the five states and their meanings.
      ProcessManagerEJB.java lines 66-68 creates new order managers with initial PENDING status.
      The workflow is driven by business logic in PurchaseOrderMDB, OrderApprovalMDB,
      and InvoiceMDB which transition orders through these states based on business events.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 44
        line_end: 67
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
           * pending->denied
           */
          public class OrderStatusNames {

              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";

              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";

              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";


              /** for orders that have been partially completed*/
              public  static final String SHIPPED_PART = "SHIPPED_PART";


              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";

          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 43
        line_end: 80
        excerpt: |
          <ejb-jar>
            <display-name>ProcessManagerJAR</display-name>
            <enterprise-beans>
              <entity>
                <display-name>ManagerEB</display-name>
                <ejb-name>ManagerEJB</ejb-name>
                <local-home>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocalHome</local-home>
                <local>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocal</local>
                <ejb-class>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerEJB</ejb-class>
                <persistence-type>Container</persistence-type>
                <prim-key-class>java.lang.String</prim-key-class>
                <reentrant>False</reentrant>
                <cmp-version>2.x</cmp-version>
                <abstract-schema-name>Manager</abstract-schema-name>
                <cmp-field>
                  <description>no description</description>
                  <field-name>status</field-name>
                </cmp-field>
                <cmp-field>
                  <description>no description</description>
                  <field-name>orderId</field-name>
                </cmp-field>
                <primkey-field>orderId</primkey-field>

  - record_key: OM-CREATE-0001
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL create a new order manager instance when a purchase order
      is received. The order manager SHALL be initialized with the order ID and
      an initial status of PENDING.
    confidence: high
    confidence_basis: >
      The createManager method is invoked immediately upon purchase order receipt
      in PurchaseOrderMDB.doWork(), establishing this as the standard workflow entry point.
      The method signature is defined in ProcessManagerLocal interface and implemented
      in ProcessManagerEJB with direct delegation to ManagerLocalHome.create().
    risk_class: operational
    basis: >
      ProcessManagerLocal.java line 59 declares createManager(String orderId, String status).
      ProcessManagerEJB.java lines 66-68 implements createManager by invoking ManagerLocalHome.create().
      PurchaseOrderMDB calls createManager with OrderStatusNames.PENDING immediately after creating
      the purchase order entity.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 62
        line_end: 68
        excerpt: |
          /**
           * Business method used for when new purchase orders are recieved
           * and want to start the workflow process to fullfil the order
           */
          public void createManager(String orderId, String status) throws CreateException {
            ManagerLocal manager = mlh.create(orderId, status);
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/manager/ejb/ManagerLocalHome.java
        line_start: 49
        line_end: 56
        excerpt: |
          public interface ManagerLocalHome extends javax.ejb.EJBLocalHome {

              public ManagerLocal create(String orderId, String status) throws CreateException;

              public ManagerLocal findByPrimaryKey (String orderId) throws FinderException;

                  public Collection findOrdersByStatus(String status) throws FinderException;
          }
    stack_metadata:
      ejb.bean: ManagerEJB (entity bean, CMP 2.x)
      ejb.transaction: Required

  - record_key: OM-UPDATE-0001
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL allow updating an order's status within the workflow.
      GIVEN an order manager exists for an order ID WHEN updateStatus is invoked
      THEN the order's status SHALL be updated to the provided value.
    confidence: high
    confidence_basis: >
      The updateStatus method is used consistently across three independent MDBs
      (PurchaseOrderMDB, OrderApprovalMDB, InvoiceMDB) to drive the order workflow,
      establishing it as a core business operation. The method is enforced as a
      required transaction at the EJB level.
    risk_class: operational
    basis: >
      ProcessManagerLocal.java line 54 declares updateStatus(String orderId, String status).
      ProcessManagerEJB.java lines 73-76 implements updateStatus by finding the manager
      and calling setStatus. The method is marked with transaction-type Required in ejb-jar.xml.
      PurchaseOrderMDB, OrderApprovalMDB, and InvoiceMDB all invoke updateStatus to transition
      orders through APPROVED, DENIED, SHIPPED_PART, and COMPLETED states.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 70
        line_end: 76
        excerpt: |
          /**
           * Business method used to keep track of an order in the workflow process
           */
          public void updateStatus(String orderId, String status) throws FinderException {
            ManagerLocal manager = mlh.findByPrimaryKey(orderId);
            manager.setStatus(status);
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 357
        line_end: 368
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>ProcessManagerEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>updateStatus</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.bean: ProcessManagerEJB (stateless session bean)
      ejb.transaction: Required

  - record_key: OM-QUERY-0001
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL support querying all orders in a specific status.
      GIVEN a status value WHEN getOrdersByStatus is invoked THEN the system
      SHALL return a collection of all orders with that status.
    confidence: high
    confidence_basis: >
      The getOrdersByStatus method is used in OPCAdminFacadeEJB.getOrdersByStatus()
      to retrieve orders for administrative display. The query is defined using EJB-QL
      in the ejb-jar.xml and is marked as a required transaction.
    risk_class: operational
    basis: >
      ProcessManagerLocal.java line 63 declares getOrdersByStatus(String status).
      ManagerLocalHome.java line 55 declares the finder method.
      ejb-jar.xml lines 70-79 define the EJB-QL query: "SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1"
      OPCAdminFacadeEJB.getOrdersByStatus() uses this to retrieve orders for admin display.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 70
        line_end: 79
        excerpt: |
          <query>
            <description></description>
            <query-method>
              <method-name>findOrdersByStatus</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </query-method>
            <ejb-ql>SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1</ejb-ql>
          </query>
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 87
        line_end: 91
        excerpt: |
          /**
           * Business method to get all orders of given status for the admin
           */
          public Collection getOrdersByStatus(String status) throws FinderException {
              return mlh.findOrdersByStatus(status);
          }
