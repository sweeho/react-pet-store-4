  - record_key: OM-TXN-0001
    kind: business-rule
    capability_key: order-management
    requirement: >
      All order management operations (create, update, retrieve) SHALL execute
      within REQUIRED container-managed transactions. Each operation SHALL either
      complete atomically or roll back in its entirety.
    confidence: high
    confidence_basis: >
      All ProcessManagerEJB and ManagerEJB methods are explicitly declared with
      trans-attribute Required in the ejb-jar.xml. The ProcessManagerEJB is declared
      with transaction-type Container, establishing transactional enforcement at
      the container level.
    risk_class: financial
    basis: >
      ejb-jar.xml lines 88 declares transaction-type Container for ProcessManagerEJB.
      Container-transaction elements (lines 262-390) mark 28 methods with Required trans-attribute,
      including all business methods and finder methods.
    traces:
