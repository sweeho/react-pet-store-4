records:
  - record_key: ORDER-MGT-WORKFLOW-0001
    kind: workflow
    capability_key: order-management
    requirement: >
      The system SHALL manage order workflow state transitions through a defined sequence
      of order statuses: PENDING → APPROVED or DENIED; APPROVED → SHIPPED_PART → COMPLETED.
    confidence: high
    confidence_basis: >
      The workflow state machine is explicitly declared in OrderStatusNames.java class
      documentation (lines 44-46) and enforced by the ProcessManagerEJB session bean
      operations. Both the transition rules and the state constants are duplicated in
      declarative form (ejb-jar.xml configuration) and programmatic form (Java code logic),
      meeting the high-confidence threshold.
    risk_class: operational
    basis: >
      Order statuses are defined as public static constants in OrderStatusNames.java.
      The documented state transitions are: pending → approved → shipped_part → completed,
      or pending → denied. This is the central workflow logic for order fulfillment.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 44
        line_end: 66
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
           * pending->denied
           */
    stack_metadata:
      ejb.bean: ProcessManagerEJB
      db.object: Manager entity with status field

  - record_key: ORDER-MGT-CREATE-0002
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL create a new order workflow record when a purchase order is received,
      initializing the order with an initial status.
    confidence: high
    confidence_basis: >
      The createManager method is declared in both the ProcessManagerLocal interface
      (ProcessManagerLocal.java line 59) and implemented in ProcessManagerEJB.java (line 66).
      The method comment and implementation are consistent. All parameters and exception handling
      are defined in both declarative (ejb-jar.xml) and programmatic forms.
    risk_class: operational
    basis: >
      The createManager business method accepts orderId and status parameters and delegates
      to the ManagerEJB entity bean's create method to persist the order workflow record.
      Transaction attribute is Required, ensuring ACID semantics.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 62
        line_end: 68
        excerpt: |
          /**
           * Business method used for when new purchase orders are recieved
           * and want to start the workflow process to fullfil the order
           */
          public void createManager(String orderId, String status) throws CreateException {
            ManagerLocal manager = mlh.create(orderId, status);
          }
