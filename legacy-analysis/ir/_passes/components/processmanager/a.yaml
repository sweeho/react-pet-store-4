  - record_key: ORDER-MGT-UPDATE-0003
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL update the status of an order identified by orderId to a new status
      value, maintaining the order's position in the workflow.
    confidence: high
    confidence_basis: >
      The updateStatus method is declared in ProcessManagerLocal interface and implemented
      in ProcessManagerEJB with consistent signatures. The underlying ManagerEJB entity bean
      has setStatus abstraction and the transaction configuration is explicitly defined.
      Both declarative and programmatic evidence present.
    risk_class: operational
    basis: >
      updateStatus retrieves the Manager entity by orderId via findByPrimaryKey and calls
      setStatus to persist the new status. Transaction is Required to ensure atomicity.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 70
        line_end: 76
        excerpt: |
          /**
           * Business method used to keep track of an order in the workflow process
           */
          public void updateStatus(String orderId, String status) throws FinderException {
            ManagerLocal manager = mlh.findByPrimaryKey(orderId);
            manager.setStatus(status);
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 357
        line_end: 368
        excerpt: |
