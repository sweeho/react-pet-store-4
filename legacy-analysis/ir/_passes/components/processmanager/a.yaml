  - record_key: ORDER-MGT-ADMIN-QUERY-0005
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide administrators the ability to retrieve all orders in a given
      status for monitoring and operational control purposes.
    confidence: high
    confidence_basis: >
      The getOrdersByStatus method is declared in the ProcessManagerLocal interface and
      implemented in ProcessManagerEJB. The underlying ManagerEJB entity bean has a named
      query (findOrdersByStatus) defined in ejb-jar.xml with explicit EJB-QL, providing both
      programmatic and declarative evidence.
    risk_class: operational
    basis: >
      getOrdersByStatus delegates to ManagerLocalHome.findOrdersByStatus(status) which is a
      named query with EJB-QL "SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1".
      This provides filtered visibility into orders by status. Transaction is Required.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 86
        line_end: 91
        excerpt: |
          /**
           * Business method to get all orders of given status for the admin
           */
          public Collection getOrdersByStatus(String status) throws FinderException {
              return mlh.findOrdersByStatus(status);
          }
