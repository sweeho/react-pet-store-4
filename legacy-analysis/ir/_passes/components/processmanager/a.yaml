      ejb.bean: ManagerEJB entity
      persistence-type: Container
      cmp-version: "2.x"
      prim-key-class: java.lang.String

  - record_key: ORDER-MGT-TRANSITION-0007
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL provide an extensible transition framework to handle order status
      changes through a delegate pattern, allowing pluggable implementations of transition logic
      via TransitionDelegate implementations.
    confidence: medium
    confidence_basis: >
      The TransitionDelegate interface is defined and the TransitionDelegateFactory provides
      a factory method to instantiate delegates by class name. However, the actual usages of
      this framework are not visible in the ProcessManager component itself — it is a service
      provided by the component for use by other parts of the system (e.g., approval workflows
      that may be in other components). No incoming calls to this framework are found within
      the component.
    risk_class: operational
    basis: >
      TransitionDelegate is an interface with setup() and doTransition(TransitionInfo) methods.
      TransitionDelegateFactory.getTransitionDelegate(String className) uses reflection to
      instantiate delegates dynamically. TransitionInfo encapsulates XML messages for the
      transition. The framework appears to be used by external workflow processors but is not
      directly called by ProcessManagerEJB itself.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegate.java
        line_start: 40
        line_end: 50
        excerpt: |
          /**
            * This is the interface that all transition delegates must implement
            */
          public interface TransitionDelegate {
             public void setup() throws TransitionException;
             public void doTransition(TransitionInfo info) throws TransitionException;
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegateFactory.java
        line_start: 41
        line_end: 57
        excerpt: |
          /**
           * Used to get the required type of TransitionDelegate
           */
          public class TransitionDelegateFactory {
              public TransitionDelegateFactory() { }
              public TransitionDelegate getTransitionDelegate(String className) throws TransitionException {
                TransitionDelegate td = null;
                try {
                  td = (TransitionDelegate)Class.forName(className).newInstance();
                } catch(Exception e) {
                  throw new TransitionException(e);
                }
                return td;
              }
          }
    stack_metadata:
      framework: TransitionDelegate pattern with factory
      exception_type: TransitionException

  - record_key: ORDER-MGT-ISOLATION-0008
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL use container-managed transactions with Required attribute to ensure
      all order workflow operations maintain isolation and atomicity, protecting against
      concurrent modifications to order state.
    confidence: high
    confidence_basis: >
      Every business method in ProcessManagerEJB is explicitly configured in ejb-jar.xml with
      <trans-attribute>Required</trans-attribute>. This is consistently applied across all
      methods (createManager, updateStatus, getStatus, getOrdersByStatus) in the configuration
      file (lines 345-390). No method lacks this configuration.
    risk_class: operational
    basis: >
      The ejb-jar.xml assembly descriptor defines container-transaction policies for each
      business method of ProcessManagerEJB, all set to Required. This ensures that each
      business method call either participates in an existing transaction or creates a new one,
      providing ACID guarantees for order status modifications.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 345
        line_end: 390
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>ProcessManagerEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>createManager</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
          [... similar configuration for updateStatus, getStatus, getOrdersByStatus ...]
    stack_metadata:
      ejb.transaction: Required
      isolation-level: implicit in container-managed Required

