      query_language: EJB-QL
      query_return_type: Collection

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager
    description: >
      The TransitionDelegate framework is defined in the component but no actual delegate
      implementations are visible within the processmanager component itself. It appears to be
      a service interface for use by external workflow processors, but the callers and actual
      implementations cannot be determined from this component alone. Need to inspect components
      that import or reference TransitionDelegate to understand how it is used.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
    description: >
      ProcessManagerEJB is a stateless session bean, but its initialization (ejbCreate) performs
      a JNDI lookup to resolve the ManagerLocalHome reference. If the lookup fails at initialization
      time, the failure semantics are unclear — does it fail at bean creation or does it defer the
      lookup? The code does not show error recovery or retry logic for naming failures.
