  - record_key: ORDER-MGT-FINDER-0010
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL provide a finder method to locate order workflow records by status,
      supporting administrative queries that return all orders in a specific workflow state.
    confidence: high
    confidence_basis: >
      findOrdersByStatus is declared in the ManagerEJB configuration with an explicit EJB-QL
      query definition (ejb-jar.xml lines 70-79). The query is named and parameterized, taking
      a single String parameter for status filtering. The implementation is fully declarative
      via container-managed queries.
    risk_class: operational
    basis: >
      The EJB-QL query "SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1" defines
      the finder. The DISTINCT keyword ensures no duplicate orders are returned. This is accessed
      through the ManagerLocalHome interface's findOrdersByStatus method.
