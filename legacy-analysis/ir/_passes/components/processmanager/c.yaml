  - record_key: OPMGR-REQUIREMENT-0003
    kind: requirement
    capability_key: order-management
    requirement: >
      The system SHALL provide an admin-facing business method to query all orders with
      a specific status, returning a Collection of Manager objects matching that status.
    confidence: high
    confidence_basis: >
      The getOrdersByStatus method is documented and declared in both the session bean
      interface (ProcessManagerLocal.java lines 63) and implementation
      (ProcessManagerEJB.java lines 89-91). The deployment descriptor (ejb-jar.xml
      lines 70-79) defines a CMP query "findOrdersByStatus" that selects all Manager
      entities matching a given status. The transaction attribute is Required (lines
      380-390).
    risk_class: operational
    basis: >
      ProcessManagerEJB.java lines 89-91 defines getOrdersByStatus that calls
      mlh.findOrdersByStatus(status). The deployment descriptor (ejb-jar.xml lines
      70-79) defines the CMP query with EJB-QL "SELECT DISTINCT OBJECT(a) FROM Manager a
      WHERE a.status = ?1". ProcessManagerLocal interface (line 63) documents this as
      an interface method.
