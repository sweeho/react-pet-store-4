  - record_key: OPMGR-INTEGRATION-0001
    kind: integration
    capability_key: order-management
    requirement: >
      The system SHALL support workflow state transitions via a pluggable TransitionDelegate
      factory pattern that accepts transition information (XML messages or message batches)
      and delegates to runtime-specified handler classes for processing.
    confidence: medium
    confidence_basis: >
      The TransitionDelegate interface (lines 44-50) and TransitionDelegateFactory class
      (lines 43-58) define the infrastructure for workflow transitions using reflection-based
      class instantiation. TransitionInfo (lines 45-73) encapsulates either single or batch
      XML messages for transitions. However, the deployment descriptor does not show these
      classes being referenced in the EJB configuration, and no concrete delegate implementations
      are visible in the module, making it unclear how this infrastructure integrates with
      the actual status update workflow.
    risk_class: operational
    basis: >
      TransitionDelegate.java defines an interface with setup() and doTransition(TransitionInfo)
      methods. TransitionDelegateFactory.java uses reflection via Class.forName() and
      newInstance() to dynamically load delegate classes. TransitionInfo.java supports
      both single XML messages and collections of messages. However, no configuration or
      invocation of these classes is evident in the ProcessManagerEJB or deployment descriptor,
      suggesting this is an extension point that may not be actively used in the core workflow.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegate.java
        line_start: 40
        line_end: 51
        excerpt: |
          /**
            * This is the interface that all transition delegates must implement
            */
          public interface TransitionDelegate {
             public void setup() throws TransitionException;
             public void doTransition(TransitionInfo info) throws TransitionException;
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegateFactory.java
        line_start: 43
        line_end: 58
        excerpt: |
          public class TransitionDelegateFactory {
            public TransitionDelegateFactory() { }
            public TransitionDelegate getTransitionDelegate(String className) throws TransitionException {
              TransitionDelegate td = null;
              try {
                td = (TransitionDelegate)Class.forName(className).newInstance();
              } catch(Exception e) {
                throw new TransitionException(e);
              }
              return td;
            }
          }
    stack_metadata:
      framework: pluggable transition delegate pattern

  - record_key: OPMGR-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: order-management
    requirement: >
      The system SHALL require that all order manager operations (create, update status,
      query by status) execute within container-managed transactions with Required attribute,
      ensuring ACID properties for workflow state changes.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml deployment descriptor consistently declares all six business methods
      on both ManagerEJB and ProcessManagerEJB with container-transaction elements specifying
      trans-attribute=Required. This declarative configuration is the authoritative statement
      of transactional requirements in J2EE applications.
    risk_class: operational
    basis: >
      The ejb-jar.xml deployment descriptor (lines 262-390) declares container-transaction
      settings for all operational methods. Seven distinct method-transaction declarations
      specify Required for: ManagerEJB.create, ManagerEJB.getStatus, ManagerEJB.remove,
      ManagerEJB.findByPrimaryKey, ManagerEJB.findOrdersByStatus, ManagerEJB.setStatus,
      ManagerEJB.getOrderId, ProcessManagerEJB.createManager, ProcessManagerEJB.updateStatus,
      ProcessManagerEJB.getStatus, and ProcessManagerEJB.getOrdersByStatus.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 262
        line_end: 280
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>ManagerEJB</ejb-name>
              <method-intf>LocalHome</method-intf>
              <method-name>create</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.transaction: Required (all methods)

