      The system SHALL establish a one-to-one unidirectional relationship between
      SupplierOrder and ContactInfo. Each order SHALL have exactly one associated
      ContactInfo entity for shipping/contact information. When an order is deleted,
      its associated ContactInfo SHALL be automatically deleted (cascade delete).
    confidence: high
    confidence_basis: >
      Relationship is declared as unidirectional (One-Many in cmr-field only on
      SupplierOrder side) with explicit cascade-delete on ContactInfo. Both
      programmatic creation in ejbPostCreate and declarative XML configuration
      confirm this relationship. No alternative association paths exist.
    risk_class: operational
    basis: >
      ejb-jar.xml at lines 234-258 declares one-to-one relationship
      SupplierOrder-ContactInfo with multiplicity One on both sides, cascade-delete
      on the ContactInfo role, and CMR field only on SupplierOrder side. SupplierOrderEJB
      ejbPostCreate (lines 164-170) creates ContactInfo via ServiceLocator and
      calls setContactInfo.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 234
        line_end: 258
        excerpt: |
          <ejb-relation>
            <ejb-relation-name>SupplierOrder-ContactInfo</ejb-relation-name>
            <ejb-relationship-role>
              <ejb-relationship-role-name>purchaseorder-has-address</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <relationship-role-source>
                <ejb-name>SupplierOrderEJB</ejb-name>
              </relationship-role-source>
              <cmr-field>
                <cmr-field-name>contactInfo</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>address-for-purchaseorder</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cascade-delete />
              <relationship-role-source>
                <ejb-name>ContactInfoEJB</ejb-name>
              </relationship-role-source>
            </ejb-relationship-role>
          </ejb-relation>
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 162
        line_end: 170
        excerpt: |
          public void ejbPostCreate(SupplierOrder supplierOrder)
                                                    throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                  serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
