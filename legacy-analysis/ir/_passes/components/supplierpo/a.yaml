  - record_key: SUPINT-BRULE-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      The system SHALL define four order statuses: PENDING (newly placed orders),
      APPROVED (approved orders), DENIED (rejected orders), and COMPLETED
      (fulfilled orders). Valid transitions are PENDING→APPROVED→COMPLETED
      or PENDING→DENIED.
    confidence: high
    confidence_basis: >
      OrderStatusNames class explicitly documents the four states and their meanings
      in comments (lines 44-46). State transitions are documented in the class-level
      comment. Both declarative configuration (finder method) and programmatic usage
      confirm this state machine.
    risk_class: operational
    basis: >
      OrderStatusNames.java defines four public static final String constants for the
      four statuses with clear documentation of the state transitions in the class
      comment at lines 44-46. The ejbCreate method in SupplierOrderEJB (line 154)
      sets initial status to PENDING.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 41
        line_end: 61
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->completed   or
           * pending->denied
           */
          public class OrderStatusNames {
              public static final String PENDING = "PENDING";
              public static final String APPROVED = "APPROVED";
              public static final String DENIED = "DENIED";
              public static final String COMPLETED = "COMPLETED";
          }

  - record_key: SUPINT-BRULE-0002
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      The system SHALL initialize new orders in PENDING status when created.
    confidence: high
    confidence_basis: >
      ejbCreate method in the bean explicitly sets status to PENDING at line 154.
      No alternative creation paths exist. This is enforced at the persistence layer.
    risk_class: operational
    basis: >
      SupplierOrderEJB.ejbCreate(SupplierOrder supplierOrder) at line 151 calls
      setPoStatus(OrderStatusNames.PENDING) at line 154.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 156
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;
          }

  - record_key: SUPINT-BRULE-0003
