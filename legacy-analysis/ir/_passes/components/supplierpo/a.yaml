findings:
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
    description: >
      Line 209 in getData() method sets shippingInfo to supplierOrder.getShippingInfo()
      instead of this.shippingInfo. This appears to be a bug that would always null
      the shipping info. However, reachability analysis is unclear - SupplierOrder.java
      is a utility POJO used for XML serialization, while SupplierOrderEJB is the actual
      entity bean. It is unclear if getData() method in this POJO is ever called or if
      this is dead code.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
    description: >
      The ejbPostCreate method catches ServiceLocatorException but the exception message
      is the only documentation of the failure. There is no specification of what actions
      are taken when ContactInfo or LineItem creation fails (e.g., whether partial state
      is rolled back by the container, whether the entire transaction fails).
