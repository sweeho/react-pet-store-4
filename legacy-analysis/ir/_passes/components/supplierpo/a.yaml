  - record_key: SUPINT-BRULE-0004
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      The system SHALL establish a one-to-many unidirectional relationship between
      SupplierOrder and LineItem. Each order SHALL have one or more associated
      LineItem entities. When an order is deleted, all associated LineItems
      SHALL be automatically deleted (cascade delete).
    confidence: high
    confidence_basis: >
      Relationship is declared with multiplicity One-Many with explicit cascade-delete.
      Programmatic creation in ejbPostCreate iterates through line items and associates
      them. Both declarative and programmatic confirmation. Comment in ejb-jar.xml
      explicitly states "Every PO has 1 or more line items relate to it".
    risk_class: operational
    basis: >
      ejb-jar.xml at lines 289-314 declares one-to-many relationship
      SupplierOrder-LineItem with multiplicity One on SupplierOrder and Many on
      LineItem, cascade-delete on LineItem role, and CMR field lineItems on
      SupplierOrder side. SupplierOrderEJB ejbPostCreate (lines 171-179) creates
      LineItem entities and adds them via addLineItem method.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 285
        line_end: 314
        excerpt: |
          <!--
             ONE-TO-MANY Relationship between SupplierOrder and line items.
             Every PO has 1 or more line items relate to it
          -->
          <ejb-relation>
            <ejb-relation-name>SupplierOrder-LineItem</ejb-relation-name>
            <ejb-relationship-role>
              <ejb-relationship-role-name>purchaseorder-has-lineitems</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <relationship-role-source>
                <ejb-name>SupplierOrderEJB</ejb-name>
              </relationship-role-source>
              <cmr-field>
                <cmr-field-name>lineItems</cmr-field-name>
                <cmr-field-type>java.util.Collection</cmr-field-type>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>lineItem-for-purchaseorder</ejb-relationship-role-name>
              <multiplicity>Many</multiplicity>
              <cascade-delete />
              <relationship-role-source>
                <ejb-name>LineItemEJB</ejb-name>
              </relationship-role-source>
            </ejb-relationship-role>
          </ejb-relation>
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 171
        line_end: 179
        excerpt: |
          LineItemLocalHome lineItemref = (LineItemLocalHome)
              serviceLocator.getLocalHome(JNDINames.LI_EJB);
          Collection litems = supplierOrder.getLineItems();
          Iterator it = litems.iterator();
          while((it != null) && (it.hasNext())) {
            LineItem li = (LineItem) it.next();
            LineItemLocal lineItemloc = (LineItemLocal) lineItemref.create(li, 0);
            addLineItem(lineItemloc);
          }

  - record_key: SUPINT-WORKFLOW-0001
    kind: workflow
    capability_key: supplier-integration
    requirement: >
      The system SHALL support order creation workflow:
      GIVEN a new SupplierOrder with order ID, order date, shipping contact info,
      and line items WHEN ejbCreate is called THEN a new order entity is created
      with PENDING status, an associated ContactInfo is created from shipping info,
      and all line items are created and associated to the order.
    confidence: high
    confidence_basis: >
      The creation workflow is explicitly implemented in two methods (ejbCreate and
      ejbPostCreate) with clear lifecycle semantics. Both programmatic implementation
      and EJB declarative semantics (two-phase create) confirm this. No alternative
      creation paths exist.
    risk_class: operational
    basis: >
      SupplierOrderEJB implements two-phase creation: ejbCreate (lines 151-156)
      handles CMP field initialization, ejbPostCreate (lines 162-184) handles
      relationship initialization. The SupplierOrder POJO class (SupplierOrder.java
      lines 57-116) serves as input data transfer object.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 184
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;
          }

          public void ejbPostCreate(SupplierOrder supplierOrder)
                                                    throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                  serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
              ContactInfoLocal cinfoloc = (ContactInfoLocal)
                              cinforef.create(supplierOrder.getShippingInfo());
              setContactInfo(cinfoloc);
              LineItemLocalHome lineItemref = (LineItemLocalHome)
                  serviceLocator.getLocalHome(JNDINames.LI_EJB);
              Collection litems = supplierOrder.getLineItems();
              Iterator it = litems.iterator();
              while((it != null) && (it.hasNext())) {
                LineItem li = (LineItem) it.next();
                LineItemLocal lineItemloc = (LineItemLocal) lineItemref.create(li, 0);
                addLineItem(lineItemloc);
              }
            } catch(ServiceLocatorException ne) {
              throw new CreateException("ServiceLocator Ex while persisting PO CMR :" +
                                        ne.getMessage());
            }
          }

