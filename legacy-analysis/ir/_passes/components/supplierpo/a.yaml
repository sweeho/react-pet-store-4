records:
  - record_key: SUPINT-ENTITY-0001
    kind: entity
    capability_key: supplier-integration
    requirement: >
      The system SHALL maintain a SupplierOrder entity with the following attributes:
      poId (String, primary key), poDate (long, milliseconds since epoch),
      poStatus (String), contactInfo (one-to-one relationship),
      lineItems (one-to-many collection).
    confidence: high
    confidence_basis: >
      CMP entity bean is declared in ejb-jar.xml with abstract-schema-name SupplierOrder
      and three cmp-fields (poId, poDate, poStatus). Relationships are explicitly declared
      in ejb-jar.xml with cardinalities and CMR fields. Both declarative configuration
      and programmatic bean class confirm this structure.
    risk_class: operational
    basis: >
      SupplierOrderEJB abstract class declares getPoId, getPoDate, getPoStatus as abstract
      accessor methods (lines 81-113). ejb-jar.xml declares these as CMP fields with
      poId as primkey-field. One-to-one relationship with ContactInfo at lines 234-258
      and one-to-many relationship with LineItems at lines 289-314 in ejb-jar.xml.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 81
        line_end: 137
        excerpt: |
          public abstract String getPoId();
          public abstract void setPoId(String id);
          public abstract long getPoDate();
          public abstract void setPoDate(long orderDate);
          public abstract String getPoStatus();
          public abstract void setPoStatus(String stat);
          public abstract ContactInfoLocal getContactInfo();
          public abstract void setContactInfo(ContactInfoLocal addr);
          public abstract Collection getLineItems();
          public abstract void setLineItems(Collection litems);
