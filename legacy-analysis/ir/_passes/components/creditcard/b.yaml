records:
  - record_key: CCARD-VALIDATION-0001
    kind: requirement
    capability_key: checkout-payment
    requirement: >
      The system SHALL enforce non-empty validation for credit card number, type, expiry month,
      and expiry year fields. Each field SHALL be required and not accept blank or empty values
      during customer account creation and update operations.
    confidence: high
    confidence_basis: >
      CustomerHTMLAction.extractCreditCard() (lines 140-179) validates that each field is
      non-empty by checking creditCardNumber.equals(""), creditCardType.equals(""),
      creditCardExpiryMonth.equals(""), and creditCardExpiryYear.equals(""). Missing fields
      are accumulated in a missingFields ArrayList and raise MissingFormDataException (line 246).
      These validation checks are enforced consistently for both customer create and update
      operations (lines 94-104), confirming high-confidence requirement.
    risk_class: operational
    basis: >
      Validation logic in CustomerHTMLAction.extractCreditCard() (lines 143-174) shows explicit
      checks for empty/blank values on all four credit card fields. The system rejects the
      submission if any field is empty via MissingFormDataException.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 140
        line_end: 179
        excerpt: |
          private CreditCard extractCreditCard(HttpServletRequest request)
            throws HTMLActionException {
            ArrayList missingFields = null;
            String creditCardNumber =  request.getParameter("credit_card_number").trim();
            if (creditCardNumber.equals("")) {
              if (missingFields == null) {
                missingFields = new ArrayList();
              }
              // this need to be internationalized
              missingFields.add("Credit Card");
            }
            String creditCardType =  request.getParameter("credit_card_type").trim();
            if (creditCardNumber.equals("")) {
              if (missingFields == null) {
                missingFields = new ArrayList();
              }
              // this need to be internationalized
              missingFields.add("Credit Card Type");
            }
            String creditCardExpiryMonth =  request.getParameter("credit_card_expiry_month").trim();
            if (creditCardNumber.equals("")) {
              if (missingFields == null) {
                missingFields = new ArrayList();
              }
              // this need to be internationalized
              missingFields.add("Credit Card Expiry Month");
            }
            String creditCardExpiryYear =  request.getParameter("credit_card_expiry_year").trim();
            if (creditCardNumber.equals("")) {
              if (missingFields == null) {
                missingFields = new ArrayList();
              }
              // this need to be internationalized
              missingFields.add("Credit Card Expiry Month");
            }
            String expiryDate = creditCardExpiryMonth + "/" + creditCardExpiryYear;
            return new CreditCard(creditCardNumber,
                                            creditCardType,
                                            expiryDate);
          }

  - record_key: CCARD-CARDTYPE-VALUES-0001
    kind: requirement
    capability_key: checkout-payment
    requirement: >
      The system SHALL support exactly three credit card types: Java(TM) Card, Duke Express,
      and Meow Card. These card type values are presented as a selection dropdown to users
      during account setup and profile editing.
    confidence: high
    confidence_basis: >
      edit_customer.jsp lines 227-233 define a select element with three waf:option values
      for "credit_card_type": Java(TM) Card, Duke Express, and Meow Card. These are the only
      card type options presented to users, and the form input name is bound to CreditCard.cardType
      via extractCreditCard() at line 151. No other card types are referenced in the codebase.
    risk_class: operational
    basis: >
      The form presentation in edit_customer.jsp restricts card type selection to three
      predefined values. The controller extracts and passes this value directly to CreditCard
      constructor without transformation or additional validation.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/edit_customer.jsp
        line_start: 223
        line_end: 234
        excerpt: |
          <tr>
           <td class="petstore_form" align="right">
            <b>Card Type</b>
           </td>
           <td class="petstore_form" align="left" colspan="2">
            <waf:select size="1"
                              name="credit_card_type">
             <waf:selected><c:out value="${customer.account.creditCard.cardType}"/></waf:selected>
             <waf:option value="Java(TM) Card" />
             <waf:option value="Duke Express" />
             <waf:option value="Meow Card" />
            </waf:select>

  - record_key: CCARD-CARDNUMBER-LENGTH-0001
    kind: requirement
    capability_key: checkout-payment
    requirement: >
      The system SHALL restrict the credit card number input field to a maximum length of 30
      characters at the HTML form level.
    confidence: medium
    confidence_basis: >
      edit_customer.jsp line 216 defines the credit_card_number input with maxlength="30".
      This is a client-side constraint enforced by the HTML form element. No server-side
      validation of card number length is evident in CustomerHTMLAction. The maxlength attribute
      is a UI-level constraint with medium confidence because it does not guarantee server-side
      enforcement, and validation.xml or ejb-jar.xml declare no length constraints.
    risk_class: operational
    basis: >
      HTML form maxlength attribute in the card number input field. No corresponding
      server-side length validation found in CustomerHTMLAction or CreditCard entity.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/edit_customer.jsp
        line_start: 207
        line_end: 221
        excerpt: |
          <tr>
           <td class="petstore_form" align="right">
            <b>Card Number</b>
           </td>
           <td align="left" colspan="2">
            <waf:input cssClass="petstore_form"
                                              type="text"
                                              name="credit_card_number"
                                               size="30"
                                    maxlength="30"
                                      validation="validation">
             <waf:value><c:out value="${customer.account.creditCard.cardNumber}"/></waf:value>
            </waf:input>
           </td>
          </tr>

  - record_key: CCARD-EXPIRYDATE-FORMAT-0001
    kind: requirement
    capability_key: checkout-payment
    requirement: >
      The system SHALL store and format credit card expiry date as a string in MM/YYYY format,
      where MM is a two-digit month (01-12) and YYYY is a four-digit year. The month and year
      components are captured separately in the form as credit_card_expiry_month and
      credit_card_expiry_year, then concatenated with a "/" delimiter.
    confidence: high
    confidence_basis: >
      CustomerHTMLAction line 175 explicitly concatenates month and year:
      String expiryDate = creditCardExpiryMonth + "/" + creditCardExpiryYear.
      edit_customer.jsp lines 240-264 show separate dropdown selections for month (01-12)
      and year (2002-2005), confirming the two-component structure. CreditCardEJB getExpiryMonth()
      and getExpiryYear() parse this format by indexOf("/"), confirming the "/" delimiter is
      the canonical format (lines 92, 102).
    risk_class: financial
    basis: >
      Form design separates month and year into two input fields (dropdowns in edit_customer.jsp).
      Controller concatenates them with "/" (CustomerHTMLAction line 175). Entity parsing assumes
      "/" delimiter exists (CreditCardEJB lines 92, 102). All three layers agree on MM/YYYY format.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/edit_customer.jsp
        line_start: 236
        line_end: 266
        excerpt: |
          <tr>
