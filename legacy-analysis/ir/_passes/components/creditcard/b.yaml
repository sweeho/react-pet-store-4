                              name="credit_card_expiry_month">
             <waf:selected><c:out value="${customer.account.creditCard.expiryMonth}"/></waf:selected>
             <waf:option value="01" />
             <waf:option value="02" />
             <waf:option value="03" />
             <waf:option value="04" />
             <waf:option value="05" />
             <waf:option value="06" />
             <waf:option value="07" />
             <waf:option value="08" />
             <waf:option value="09" />
             <waf:option value="10" />
             <waf:option value="11" />
             <waf:option value="12" />
            </waf:select>
            /
            <waf:select size="1"
                              name="credit_card_expiry_year">
             <waf:selected><c:out value="${customer.account.creditCard.expiryYear}"/></waf:selected>
             <waf:option value="2002" />
             <waf:option value="2003" />
