      creditCardType, creditCardExpiryMonth, and creditCardExpiryYear are not empty
      strings and throws MissingFormDataException if any are missing. This validation
      is applied both on customer creation (line 96) and update (line 102).
    risk_class: operational
    basis: >
      CustomerHTMLAction lines 140-179 show explicit empty-string checks for all four
      input parameters. If any fail validation, missingFields list is populated and
      exception is raised at line 246-248.
