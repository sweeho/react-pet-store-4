  - record_key: CC-REQUIREMENT-0003
    kind: requirement
    capability_key: checkout-payment
    requirement: >
      The system SHALL store credit card expiry date as a single string field in MM/YYYY
      format, composed of month (01–12) and year (e.g., 2002–2005).
    confidence: high
    confidence_basis: >
      Code explicitly concatenates month and year with "/" separator in
      CustomerHTMLAction.extractCreditCard(); CreditCardEJB stores as single String
      expiryDate; DTD defines ExpiryDate as a single PCDATA element; getExpiryMonth()
      and getExpiryYear() parse this format by splitting on "/".
    risk_class: financial
    basis: >
      CustomerHTMLAction line 175 shows concatenation: "creditCardExpiryMonth + "/" +
      creditCardExpiryYear"; CreditCardEJB getExpiryMonth/getExpiryYear methods parse
      by finding "/" separator; JSP presents two separate select controls for month and
      year but they combine into one stored field.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 159
        line_end: 178
        excerpt: |
          String creditCardExpiryMonth =  request.getParameter("credit_card_expiry_month").trim();
          if (creditCardNumber.equals("")) {
              if (missingFields == null) {
                  missingFields = new ArrayList();
              }
              missingFields.add("Credit Card Expiry Month");
          }
          String creditCardExpiryYear =  request.getParameter("credit_card_expiry_year").trim();
          if (creditCardNumber.equals("")) {
              if (missingFields == null) {
                  missingFields = new ArrayList();
              }
              missingFields.add("Credit Card Expiry Month");
          }
          String expiryDate = creditCardExpiryMonth + "/" + creditCardExpiryYear;
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
              String dateString = getExpiryDate();
              if (dateString != null) {
                int slashStart = dateString.indexOf("/");
                if (slashStart != -1) return dateString.substring(0,slashStart);
              }
              return "01";
          }
          public String getExpiryYear() {
              String dateString = getExpiryDate();
              if (dateString != null) {
                int slashStart = dateString.indexOf("/");
                if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());
              }
              return "2010";
          }
    stack_metadata:
      data.format: MM/YYYY

  - record_key: CC-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: checkout-payment
    requirement: >
      WHEN credit card expiry month is null or missing in the stored card data,
      THEN the system SHALL default to month "01" when displaying or retrieving the month.
    confidence: medium
    confidence_basis: >
      The getExpiryMonth() method returns "01" as a hardcoded default if the
      expiryDate field is null or does not contain a "/" character. This is a
      silent fallback with no user notification; no configuration or test was found
      documenting this choice.
    risk_class: operational
    basis: >
      CreditCardEJB.getExpiryMonth() returns "01" on lines 95-96 when dateString
      is null or slashStart equals -1. No comment explains the rationale for this
      default.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 96
        excerpt: |
          public String getExpiryMonth() {
              String dateString = getExpiryDate();
              if (dateString != null) {
                int slashStart = dateString.indexOf("/");
                if (slashStart != -1) return dateString.substring(0,slashStart);
              }
              return "01";
          }
    stack_metadata:
      ejb.method: getExpiryMonth

