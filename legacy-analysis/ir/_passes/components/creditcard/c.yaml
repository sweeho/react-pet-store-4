  - record_key: CC-ENTITY-0002
    kind: entity
    capability_key: checkout-payment
    requirement: >
      The system SHALL represent credit card data in XML format with the structure
      CreditCard > (CardNumber, CardType, ExpiryDate), where each element contains
      text content (PCDATA).
    confidence: high
    confidence_basis: >
      CreditCard class provides XML serialization/deserialization methods (toDOM,
      fromDOM); DTD explicitly defines the XML structure; code follows that structure
      strictly when building and parsing DOM nodes.
    risk_class: operational
    basis: >
      CreditCard.java toDOM() creates root element with child elements for CardNumber,
      CardType, ExpiryDate (lines 108-114); fromDOM() deserializes by parsing in the
      same order (lines 116-130); CreditCard.dtd defines exact element structure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/rsrc/schemas/CreditCard.dtd
        line_start: 38
        line_end: 42
        excerpt: |
          <!ELEMENT CreditCard (CardNumber, CardType, ExpiryDate)>
          <!ELEMENT CardNumber (#PCDATA)>
          <!ELEMENT CardType (#PCDATA)>
          <!ELEMENT ExpiryDate (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 108
        line_end: 130
        excerpt: |
          public Node toDOM(Document document) {
              Element root = document.createElement(XML_CREDITCARD);
              XMLDocumentUtils.appendChild(document, root, XML_CARD_NUMBER, cardNumber);
              XMLDocumentUtils.appendChild(document, root, XML_CARD_TYPE, cardType);
              XMLDocumentUtils.appendChild(document, root, XML_EXPIRYDATE, expiryDate);
              return root;
          }
          public static CreditCard fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_CREDITCARD)) {
                  Element child;
                  CreditCard creditCard = new CreditCard();
                  child = XMLDocumentUtils.getFirstChild(element, XML_CARD_NUMBER, false);
                  creditCard.cardNumber = XMLDocumentUtils.getContentAsString(child, false);
                  child = XMLDocumentUtils.getNextSibling(child, XML_CARD_TYPE, false);
                  creditCard.cardType = XMLDocumentUtils.getContentAsString(child, false);
                  child = XMLDocumentUtils.getNextSibling(child, XML_EXPIRYDATE, false);
                  creditCard.expiryDate = XMLDocumentUtils.getContentAsString(child, false);
                  return creditCard;
              }
              throw new XMLDocumentException(XML_CREDITCARD + " element expected.");
    stack_metadata:
      xml.schema: CreditCard.dtd

findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
    description: >
      Lines 152, 160, 168 all validate creditCardNumber instead of creditCardType,
      creditCardExpiryMonth, and creditCardExpiryYear respectively. This creates a bug
      where card type and expiry values can be empty without raising an exception, while
      card number is validated four times. This defeats the validation logic intended in
      CC-REQUIREMENT-0004.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
    description: >
      The getExpiryMonth() and getExpiryYear() default values (01 and 2010) are hardcoded
      bare literals with no comment, configuration, or test explaining the choice. It is
      unclear whether 2010 represents an intended fallback year or an outdated hardcoded
      value from the original development. The interaction between a null expiryDate and
      these defaults could cause issues if credit cards with missing expiry are loaded
      from persistent storage.
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
    description: >
      The primary key class for CreditCardEJB is declared as java.lang.Object (line 53
      of ejb-jar.xml), which is atypical. CMP entity beans normally use a specific type
      (String, Integer, etc.) for their primary key. It is unclear how the entity manager
      distinguishes between multiple CreditCard instances or whether this bean is ever
      queried independently by key. The entity appears to exist only as a dependent
      object within an Account context.
