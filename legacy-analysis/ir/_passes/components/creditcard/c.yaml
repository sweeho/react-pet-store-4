  - record_key: CC-INTEGRATION-0001
    kind: integration
    capability_key: checkout-payment
    requirement: >
      The system SHALL make credit card data accessible to the Account EJB via a local
      EJB reference ("java:comp/env/ejb/CreditCard") at account creation time.
    confidence: high
    confidence_basis: >
      AccountEJB ejbCreate method explicitly looks up CreditCard home interface via
      InitialContext and instantiates a CreditCard bean (lines 87-88). This lookup
      pattern is declared in the customer component's ejb-jar.xml as an ejb-ref pointing
      to CreditCardEJB with ejb-link. Both are present and consistent.
    risk_class: operational
    basis: >
      AccountEJB.ejbCreate() performs JNDI lookup for "java:comp/env/ejb/CreditCard" and
      calls create(). PurchaseOrder's ejb-jar.xml shows the same pattern and reference.
      CreditCard EJB itself is local-only (no remote interface).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 87
        line_end: 89
        excerpt: |
          CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
          CreditCardLocal creditCard = cch.create();
          setCreditCard(creditCard);
    stack_metadata:
      ejb.reference: java:comp/env/ejb/CreditCard
      ejb.link.target: CreditCardEJB

