records:
  - record_key: CC-ENTITY-0001
    kind: entity
    capability_key: checkout-payment
    requirement: >
      The system SHALL persist credit card information as part of customer account data,
      comprising card number, card type, and expiry date.
    confidence: high
    confidence_basis: >
      CreditCardEJB is a Container-Managed Persistence Entity Bean with persistent CMP
      fields for cardNumber, cardType, and expiryDate. Account EJB holds a reference to
      CreditCardLocal and manages its lifecycle. Both declarative (ejb-jar.xml) and code
      (CreditCardEJB.java) enforce this uniformly.
    risk_class: financial
    basis: >
      CreditCardEJB defines three CMP fields; ejb-jar.xml declares persistence-type as
      Container; Account EJB instantiates and manages CreditCard lifecycle; DTD defines
      the XML representation with three required elements.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 50
        line_end: 57
        excerpt: |
          public abstract String getCardNumber();
          public abstract void setCardNumber(String cardNumber);
          public abstract String getCardType();
          public abstract void setCardType(String cardType);
          public abstract String getExpiryDate();
          public abstract void setExpiryDate(String expiryDate);
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 46
        line_end: 68
        excerpt: |
          <entity>
            <display-name>CreditCardEB</display-name>
            <ejb-name>CreditCardEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.creditcard.ejb.CreditCardLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.creditcard.ejb.CreditCardLocal</local>
