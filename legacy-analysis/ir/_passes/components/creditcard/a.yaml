  - record_key: CCARD-ENTITY-0001
    kind: entity
    capability_key: checkout-payment
    requirement: >
      The system SHALL maintain a CreditCard entity with three fields: cardNumber,
      cardType, and expiryDate, each implemented as a CMP (Container-Managed Persistence)
      field with abstract getter and setter methods.
    confidence: high
    confidence_basis: >
      CreditCardEJB defines three abstract getter/setter pairs for CMP fields (lines 50-57),
      and ejb-jar.xml declares each as a cmp-field (lines 57-68). The persistence-type is
      explicitly set to "Container" (line 52). Multiple systems reference CreditCard,
      confirming this is the canonical entity definition.
    risk_class: financial
    basis: >
      CMP field declarations in ejb-jar.xml and abstract accessors in CreditCardEJB enforce
      database persistence of payment instrument data. Container-managed persistence means
      the EJB container handles all database operations.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 50
        line_end: 57
        excerpt: |
          public abstract String getCardNumber();
          public abstract void setCardNumber(String cardNumber);
          public abstract String getCardType();
          public abstract void setCardType(String cardType);
          public abstract String getExpiryDate();
          public abstract void setExpiryDate(String expiryDate);
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 52
        line_end: 68
        excerpt: |
          <persistence-type>Container</persistence-type>
