records:
  - record_key: NOTIF-ASYNC-0001
    kind: requirement
    capability_key: notification-messaging
    requirement: |
      The system SHALL provide a stateless session bean capable of sending asynchronous messages to a JMS queue.
    confidence: high
    confidence_basis: >
      The requirement is enforced in both declarative configuration (ejb-jar.xml session-type Stateless)
      and programmatic implementation (AsyncSenderEJB implements SessionBean). The interface and
      implementation consistently define this capability.
    risk_class: operational
    basis: >
      Stateless session bean defined with ejb-class AsyncSenderEJB, session-type explicitly set to Stateless.
      The component is designed to be instantiated multiple times by the container without state management.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 46
        line_end: 52
        excerpt: |
          <session>
            <display-name>AsyncSenderJAR</display-name>
            <ejb-name>AsyncSenderEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSender</local>
            <ejb-class>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderEJB</ejb-class>
            <session-type>Stateless</session-type>

  - record_key: NOTIF-ASYNC-0002
    kind: requirement
    capability_key: notification-messaging
    requirement: |
      The system SHALL send a text message to the AsyncSenderQueue with the provided message content
      when sendAMessage(String) is invoked.
    confidence: high
    confidence_basis: >
      Both declarative (method-permission and container-transaction declarations) and programmatic
      (sendAMessage implementation) sources consistently define this capability. The method is
      explicitly permitted and declared in ejb-jar.xml.
    risk_class: operational
    basis: >
      The sendAMessage method creates a QueueConnection, QueueSession, and QueueSender, then constructs
      a TextMessage with the provided message string and sends it to the queue. This is the primary
      business operation of the component.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSender.java
        line_start: 44
        line_end: 47
        excerpt: |
          public interface AsyncSender extends EJBLocalObject {
              public void sendAMessage(String message);
          }
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 79
        excerpt: |
          try {
            qConnect = qFactory.createQueueConnection();
            session = qConnect.createQueueSession(true,0);
            qSender = session.createSender(q);
            TextMessage jmsMsg = session.createTextMessage();
            jmsMsg.setText(msg);
            qSender.send(jmsMsg);

  - record_key: NOTIF-ASYNC-0003
    kind: requirement
    capability_key: notification-messaging
    requirement: |
      The system SHALL require transactional boundaries for the sendAMessage operation, ensuring
      that message sending is atomic at the container level.
    confidence: high
    confidence_basis: >
      Container-managed transactions are explicitly declared in ejb-jar.xml with trans-attribute Required,
      and the session bean declares transaction-type Container. This is reinforced by programmatic session
      creation with transacted flag set to true (createQueueSession(true,0)).
    risk_class: operational
    basis: >
      Both declarative (container-transaction with Required attribute) and programmatic evidence
      (transacted session creation) confirm transactional semantics are enforced.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 52
        line_end: 53
        excerpt: |
          <transaction-type>Container</transaction-type>
