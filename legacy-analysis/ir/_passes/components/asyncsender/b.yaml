  - record_key: NOTIF-ASYNC-0004
    kind: requirement
    capability_key: notification-messaging
    requirement: |
      The system SHALL initialize JMS queue resources during bean creation using the ServiceLocator
      to obtain QueueConnectionFactory and AsyncSenderQueue references.
    confidence: high
    confidence_basis: >
      The resource initialization is consistently shown in both declarative (resource-ref and
      resource-env-ref declarations) and programmatic (ejbCreate implementation using ServiceLocator)
      sources. Both must be coordinated for the bean to function.
    risk_class: operational
    basis: >
      The ejb-jar.xml declares both jms/QueueConnectionFactory and jms/AsyncSenderQueue as required
      resources. The ejbCreate method explicitly uses ServiceLocator to resolve these JNDI names,
      throwing EJBException if lookup fails.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 58
        line_end: 67
        excerpt: |
          <resource-ref>
            <res-ref-name>jms/QueueConnectionFactory</res-ref-name>
            <res-type>javax.jms.QueueConnectionFactory</res-type>
            <res-auth>Container</res-auth>
            <res-sharing-scope>Shareable</res-sharing-scope>
          </resource-ref>
          <resource-env-ref>
            <resource-env-ref-name>jms/AsyncSenderQueue</resource-env-ref-name>
            <resource-env-ref-type>javax.jms.Queue</resource-env-ref-type>
          </resource-env-ref>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 58
        line_end: 65
        excerpt: |
          public void ejbCreate( ) throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
              q = serviceLocator.getQueue(JNDINames.ASYNC_SENDER_QUEUE);
            } catch (ServiceLocatorException sle) {
              throw new EJBException("AsyncSenderEJB.ejbCreate failed", sle);
            }
          }

  - record_key: NOTIF-ASYNC-0005
    kind: requirement
    capability_key: notification-messaging
    requirement: |
      The system SHALL handle failures during message sending by throwing an EJBException,
      and SHALL ensure QueueConnection resources are closed in all execution paths.
    confidence: high
    confidence_basis: >
      Error handling is explicitly coded in the catch block throwing EJBException, and resource
      cleanup is guaranteed by the finally block. This dual approach (error propagation + resource
      cleanup) is consistently implemented.
    risk_class: operational
    basis: >
      The sendAMessage method wraps JMS operations in try-catch-finally. Exceptions trigger
      EJBException with the original exception as cause. The finally block ensures QueueConnection
      is closed even if exceptions occur, preventing resource leaks.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 80
        line_end: 89
        excerpt: |
          }catch  (Exception e) {
            e.printStackTrace();
            throw new EJBException("askMDBToSendAMessage: Error!",e);
          } finally {
            try {
              if( qConnect != null ) {
                qConnect.close();
              }
            } catch(Exception e) {}
          }

  - record_key: NOTIF-ASYNC-0006
    kind: requirement
    capability_key: notification-messaging
    requirement: |
      The system SHALL permit all principal identities to access the sendAMessage method
      (unchecked authorization), allowing any caller with local access to invoke message sending.
    confidence: high
    confidence_basis: >
      The method-permission declaration in ejb-jar.xml explicitly marks sendAMessage with unchecked,
      which is the standard way to declare authorization in J2EE 2.0 descriptor format. No conflicting
      programmatic security checks are found.
    risk_class: operational
    basis: >
      The ejb-jar.xml assembly-descriptor includes method-permission for sendAMessage(String) with
      an unchecked element, indicating no role-based access control is applied to this method.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 107
        line_end: 114
        excerpt: |
          <method>
