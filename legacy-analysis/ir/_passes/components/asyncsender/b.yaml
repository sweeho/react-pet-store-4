            <method-name>sendAMessage</method-name>
            <method-params>
              <method-param>java.lang.String</method-param>
            </method-params>
          </method>

  - record_key: NOTIF-ASYNC-0007
    kind: requirement
    capability_key: notification-messaging
    requirement: |
      The system SHALL use the caller's security identity for operations performed by the
      AsyncSenderEJB session bean.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml explicitly declares use-caller-identity, which is the declarative form of
      principal propagation in J2EE. This is the intended behavior and is unambiguous.
    risk_class: operational
    basis: >
      The security-identity element in the session bean declaration contains use-caller-identity,
      meaning the EJB runs under the security context of the bean's caller.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 54
        line_end: 57
        excerpt: |
          <security-identity>
            <description></description>
            <use-caller-identity></use-caller-identity>
          </security-identity>

  - record_key: NOTIF-ASYNC-0008
    kind: integration
    capability_key: notification-messaging
    requirement: |
      The system SHALL integrate with JMS via lookup of QueueConnectionFactory and AsyncSenderQueue
      using JNDI names java:comp/env/jms/QueueConnectionFactory and java:comp/env/jms/AsyncSenderQueue.
    confidence: high
    confidence_basis: >
      Both declarative (ejb-jar.xml resource references) and programmatic (JNDINames constants and
      ServiceLocator calls) sources independently confirm these JNDI names and lookup patterns.
    risk_class: operational
    basis: >
      The JNDINames utility class defines the exact JNDI names used for resource lookups. The
      ejb-jar.xml declares these resources with matching res-ref-name and resource-env-ref-name values.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/util/JNDINames.java
        line_start: 56
        line_end: 60
        excerpt: |
          public static final String QUEUE_CONNECTION_FACTORY =
                              "java:comp/env/jms/QueueConnectionFactory";

          public static final String ASYNC_SENDER_QUEUE =
                                "java:comp/env/jms/AsyncSenderQueue";

  - record_key: NOTIF-ASYNC-0009
    kind: entity
    capability_key: notification-messaging
    requirement: |
      Text-based messages SHALL be sent through the AsyncSenderQueue as javax.jms.TextMessage objects.
    confidence: high
    confidence_basis: >
      The implementation explicitly constructs TextMessage objects and populates them with the
      provided message string. This is the only message type sent by this component.
    risk_class: operational
    basis: >
      The sendAMessage implementation creates a TextMessage from the session, sets its text content
      to the provided string, and sends it to the queue.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 77
