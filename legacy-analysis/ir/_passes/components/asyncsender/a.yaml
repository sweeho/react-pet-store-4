records:
  - record_key: NOTIF-ASYNC-0001
    kind: integration
    capability_key: notification-messaging
    requirement: >
      The system SHALL support asynchronous message transmission via JMS (Java Message Service)
      to decouple message sending from order processing, enabling non-blocking order fulfillment.
    confidence: high
    confidence_basis: >
      The requirement is enforced through declarative configuration (ejb-jar.xml) with a
      container-managed transaction attribute and explicit QueueConnectionFactory/Queue bindings.
      The integration is confirmed by usage in OrderEJBAction where purchase orders are sent
      asynchronously, and two independent sources (ejb-jar.xml and Java code) agree on the
      transaction model and resource references.
    risk_class: operational
    basis: >
      AsyncSender is a Stateless Session Bean that manages JMS queue connections and sends
      messages. The bean configuration declares transaction-type as Container with trans-attribute
      Required for the sendAMessage method, establishing the asynchronous delivery pattern as
      a hard requirement. The bean is called from OrderEJBAction.perform() to send purchase
      orders as XML after order creation, ensuring order data is transmitted without blocking
      the order creation flow.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 46
        line_end: 68
        excerpt: |
          <session>
            <display-name>AsyncSenderJAR</display-name>
            <ejb-name>AsyncSenderEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSender</local>
            <ejb-class>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>
            ...
            <resource-ref>
              <res-ref-name>jms/QueueConnectionFactory</res-ref-name>
              <res-type>javax.jms.QueueConnectionFactory</res-type>
              <res-auth>Container</res-auth>
              <res-sharing-scope>Shareable</res-sharing-scope>
            </resource-ref>
            <resource-env-ref>
              <resource-env-ref-name>jms/AsyncSenderQueue</resource-env-ref-name>
              <resource-env-ref-type>javax.jms.Queue</resource-env-ref-type>
            </resource-env-ref>
          </session>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 90
        excerpt: |
          public void sendAMessage(String msg)  {
            QueueSession session = null;
            QueueConnection qConnect = null;
            QueueSender qSender = null;

            try {
              qConnect = qFactory.createQueueConnection();
              session = qConnect.createQueueSession(true,0);
              qSender = session.createSender(q);
              TextMessage jmsMsg = session.createTextMessage();
              jmsMsg.setText(msg);
              qSender.send(jmsMsg);
            }catch  (Exception e) {
              e.printStackTrace();
              throw new EJBException("askMDBToSendAMessage: Error!",e);
            } finally {
              try {
                        if( qConnect != null ) {
                qConnect.close();
                        }
              } catch(Exception e) {}
                }
          }
    stack_metadata:
      ejb.bean: AsyncSenderEJB
      ejb.transaction: Required
      jms.queue: AsyncSenderQueue
      framework: EJB 2.0

  - record_key: NOTIF-ASYNC-0002
    kind: business-rule
    capability_key: notification-messaging
    requirement: >
      GIVEN an order is placed in the shopping cart,
      WHEN the OrderEJBAction processes the order,
      THEN the system SHALL serialize the complete purchase order (with order ID, user ID,
      billing address, shipping address, credit card details, and line items) to XML
      and send it via AsyncSender to the async queue for downstream processing.
    confidence: high
    confidence_basis: >
      Both the declarative bean interface (AsyncSender.java) and implementation (AsyncSenderEJB.java)
      agree on the sendAMessage(String) signature accepting a String parameter. The OrderEJBAction
      usage at line 153 calls sender.sendAMessage(purchaseOrder.toXML()), confirming that XML
      serialization is the required message format. This pattern is consistently applied: input
      is always XML-serialized purchase order data.
    risk_class: operational
    basis: >
      In OrderEJBAction.perform(), after constructing a PurchaseOrder object with order ID,
      user ID, email, order date, shipping info, billing info, credit card, and line items
      (each LineItem containing category, product ID, item ID, line number, quantity, and
      unit cost), the method looks up the AsyncSenderLocalHome EJB via service locator and
      creates an instance. The purchase order is then serialized by calling toXML() and passed
      to sendAMessage(). This is the only integration point for AsyncSender in the application,
      establishing XML as the mandated message format for all orders sent through the queue.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 90
        line_end: 154
        excerpt: |
