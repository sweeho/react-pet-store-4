  - record_key: NOTIF-ASYNC-0003
    kind: business-rule
    capability_key: notification-messaging
    requirement: >
      The AsyncSender bean SHALL use container-managed transactions with the Required
      attribute on the sendAMessage method, ensuring that message transmission is part of
      the order creation transaction and rolled back if order processing fails.
    confidence: high
    confidence_basis: >
      The transaction configuration is statically declared in ejb-jar.xml with no programmatic
      overrides in the implementation. Both the declarative (ejb-jar.xml) and programmatic
      (QueueSession creation) evidence agree: the code creates a transacted QueueSession
      (first parameter true at line 75 of AsyncSenderEJB.java), and ejb-jar.xml declares
      trans-attribute Required for sendAMessage. This dual enforcement makes the requirement
      high confidence.
    risk_class: operational
    basis: >
      The ejb-jar.xml assembly-descriptor defines a container-transaction element (lines 122-132)
      that specifies trans-attribute Required for the AsyncSenderEJB sendAMessage method.
      This ensures that message sending participates in the caller's transaction context:
      if OrderEJBAction's transaction rolls back, the queued message is also rolled back,
      preventing orphaned messages for failed orders. The implementation confirms this by
      explicitly creating a transacted session (createQueueSession(true, 0)) at line 75.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 122
        line_end: 132
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>AsyncSenderEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>sendAMessage</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 74
        line_end: 76
        excerpt: |
          qConnect = qFactory.createQueueConnection();
          session = qConnect.createQueueSession(true,0);
          qSender = session.createSender(q);
    stack_metadata:
      ejb.transaction: Required
      jms.transacted: true

  - record_key: NOTIF-ASYNC-0004
    kind: business-rule
    capability_key: notification-messaging
    requirement: >
      All methods of the AsyncSender bean (sendAMessage, getPrimaryKey, getEJBLocalHome,
      remove, and isIdentical) SHALL be accessible without explicit role-based authorization
      checks (unchecked permission).
    confidence: high
    confidence_basis: >
      The ejb-jar.xml assembly-descriptor method-permission section (lines 71-121) uniformly
      applies an <unchecked/> element to all declared methods of AsyncSenderEJB, with no
      role-based restrictions. This configuration is the sole source of authorization policy
      for the bean, and there are no programmatic authorization checks in the implementation.
    risk_class: operational
    basis: >
      Lines 71-121 of ejb-jar.xml define method-permission elements with unchecked authorization
      for all AsyncSenderEJB methods. The use-caller-identity element in the security-identity
      (lines 54-56) ensures that when authorization is later evaluated by calling code, the
      caller's identity is propagated, but AsyncSender itself imposes no restrictions. This
      pattern supports the async messaging use case: orders must be transmitted regardless of
      the user's role, but the receiving system (downstream message listener) retains caller
      context for audit and authorization if needed.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 71
        line_end: 121
        excerpt: |
          <method-permission>
            <unchecked />
            <method>
              <ejb-name>AsyncSenderEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getPrimaryKey</method-name>
              <method-params />
            </method>
            <method>
              <ejb-name>AsyncSenderEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getEJBLocalHome</method-name>
              <method-params />
            </method>
            ...
            <method>
              <ejb-name>AsyncSenderEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>sendAMessage</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            ...
          </method-permission>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 54
        line_end: 56
        excerpt: |
          <security-identity>
            <description></description>
            <use-caller-identity></use-caller-identity>
          </security-identity>
    stack_metadata:
      ejb.authorization: unchecked
      ejb.security_identity: use-caller-identity

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
    description: >
      The error message in the EJBException at line 82 states "askMDBToSendAMessage: Error!" but
      the method is called sendAMessage and is not a Message-Driven Bean (MDB). The misleading
      error message suggests either: (1) this code was copied from or evolved alongside an MDB
      implementation that was later replaced with a session bean, or (2) the error message is
      simply incorrect. The functionality itself is clear (send via session bean), but the error
      message inconsistency warrants clarification from domain experts to ensure error handling
      and logging are not inadvertently pointing to the wrong component in production diagnostics.
