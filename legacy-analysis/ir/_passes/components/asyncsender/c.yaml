  - record_key: NOTIF-ASYNC-0004
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The AsyncSender bean SHALL initialize JMS queue resources (QueueConnectionFactory and
      AsyncSenderQueue) during bean instantiation via the ejbCreate() lifecycle method, resolving
      JNDI references and failing fast if resources are unavailable.
    confidence: high
    confidence_basis: >
      The resource initialization is enforced through both declarative (ejb-jar.xml resource-ref
      and resource-env-ref declarations at lines 58-67) and programmatic (AsyncSenderEJB.ejbCreate
      using ServiceLocator at lines 58-66) sources. Pass B independently identified this requirement;
      Pass A did not explicitly isolate it but confirmed the resource usage context. The combination
      of declaration and implementation means the bean cannot be created if JNDI resolution fails.
    risk_class: operational
    basis: >
      The ejb-jar.xml declares jms/QueueConnectionFactory (res-type javax.jms.QueueConnectionFactory)
      and jms/AsyncSenderQueue (resource-env-ref-type javax.jms.Queue) as required bean resources.
      AsyncSenderEJB.ejbCreate() is invoked by the container when a new bean instance is needed
      (called by AsyncSenderLocalHome.create()). This method uses ServiceLocator to resolve both
      JNDI names (JNDINames.QUEUE_CONNECTION_FACTORY and JNDINames.ASYNC_SENDER_QUEUE) and throws
      EJBException if ServiceLocatorException occurs, ensuring the bean is not available to callers
      if resources cannot be acquired.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 58
        line_end: 67
        excerpt: |
          <resource-ref>
            <res-ref-name>jms/QueueConnectionFactory</res-ref-name>
            <res-type>javax.jms.QueueConnectionFactory</res-type>
            <res-auth>Container</res-auth>
            <res-sharing-scope>Shareable</res-sharing-scope>
          </resource-ref>
          <resource-env-ref>
            <resource-env-ref-name>jms/AsyncSenderQueue</resource-env-ref-name>
            <resource-env-ref-type>javax.jms.Queue</resource-env-ref-type>
          </resource-env-ref>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 58
        line_end: 66
        excerpt: |
          public void ejbCreate( ) throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
              q = serviceLocator.getQueue(JNDINames.ASYNC_SENDER_QUEUE);
            } catch (ServiceLocatorException sle) {
              throw new EJBException("AsyncSenderEJB.ejbCreate failed", sle);
            }
          }
    stack_metadata:
      jndi.factory: QueueConnectionFactory
      jndi.queue: AsyncSenderQueue

  - record_key: NOTIF-ASYNC-0005
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The AsyncSender bean SHALL convert the provided message text to a javax.jms.TextMessage object,
      set the text content, and enqueue it to the AsyncSenderQueue using a QueueSender acquired
      from the transacted QueueSession.
    confidence: high
    confidence_basis: >
      Both passes A and B independently confirmed this behavior; it is the core message transmission
      mechanism. The implementation is deterministic and unconditional: no branches, no optional steps.
      TextMessage is the only message type created by this bean.
    risk_class: operational
    basis: >
      The sendAMessage method creates a TextMessage via session.createTextMessage(), sets its text
      content via jmsMsg.setText(msg), and sends it via qSender.send(jmsMsg). The QueueSender is
      created for the target queue (q) obtained during bean instantiation. This sequence is the only
      mechanism for message transmission in the component.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 77
        line_end: 79
        excerpt: |
          TextMessage jmsMsg = session.createTextMessage();
          jmsMsg.setText(msg);
          qSender.send(jmsMsg);
    stack_metadata:
      jms.message_type: TextMessage

  - record_key: NOTIF-ASYNC-0006
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      When an exception occurs during message transmission (JMS connection failure, session creation
      failure, message send failure, or message creation failure), the AsyncSender bean SHALL throw
      an EJBException wrapping the original exception, and SHALL ensure all JMS connections are closed
      in the finally block regardless of exception outcome.
    confidence: high
    confidence_basis: >
      Error handling is explicitly coded in a try-catch-finally block (AsyncSenderEJB.java lines 73-90).
      Both passes A and B identified this requirement independently. The finally block is unconditional
      and will execute even if an exception is thrown. Resource cleanup (connection.close()) is guarded
      by a null check and its own try-catch to prevent the cleanup itself from masking the original error.
    risk_class: operational
    basis: >
      The sendAMessage method wraps all JMS operations in try-catch-finally. Any Exception caught in
      the catch block (line 80) is re-thrown as EJBException with a descriptive message and the original
      exception as cause, allowing callers to detect and respond to transmission failures. The finally block
      (lines 83-89) unconditionally closes the QueueConnection if it is non-null. Even if closing throws
      an exception, it is caught and silently ignored to prevent masking the original error and ensure
      resource cleanup is best-effort.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 73
        line_end: 90
        excerpt: |
          try {
            qConnect = qFactory.createQueueConnection();
            session = qConnect.createQueueSession(true,0);
            qSender = session.createSender(q);
            TextMessage jmsMsg = session.createTextMessage();
            jmsMsg.setText(msg);
            qSender.send(jmsMsg);
          }catch  (Exception e) {
            e.printStackTrace();
            throw new EJBException("askMDBToSendAMessage: Error!",e);
          } finally {
            try {
              if( qConnect != null ) {
                qConnect.close();
              }
            } catch(Exception e) {}
          }
    stack_metadata:
      error.handling: EJBException

  - record_key: NOTIF-ASYNC-0007
    kind: business-rule
    capability_key: notification-messaging
    requirement: >
      All methods of the AsyncSender bean (sendAMessage and all inherited EJB lifecycle/identity methods)
      SHALL permit access by any authenticated principal without role-based authorization checks
      (unchecked permission), allowing any authorized caller to invoke message sending.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml method-permission section (lines 71-121) uniformly applies an <unchecked/> element
      to all declared methods of AsyncSenderEJB. Both passes A and B independently confirmed this
      authorization model. There are no programmatic authorization checks in the implementation
      (no isCallerInRole calls, no role annotations). The unchecked declaration is the sole source
      of authorization policy for the bean.
    risk_class: operational
    basis: >
      The assembly-descriptor method-permission element (lines 71-121) declares unchecked authorization
      for all AsyncSenderEJB methods: getPrimaryKey, getEJBLocalHome, remove (both home and local),
      isIdentical, sendAMessage, and create. The unchecked element means the container will permit
      the method invocation regardless of the caller's security role. This pattern supports the async
      messaging use case: orders must be transmitted to the queue regardless of the user's assigned role.
      The downstream message listener retains access to the caller's identity (via use-caller-identity
      at lines 54-56) for audit and authorization decisions if needed.
    traces:
