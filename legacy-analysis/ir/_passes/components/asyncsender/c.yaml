records:
  - record_key: NOTIF-ASYNC-0001
    kind: integration
    capability_key: notification-messaging
    requirement: >
      The system SHALL support asynchronous message transmission via JMS (Java Message Service)
      using a Stateless Session Bean that accepts message text and enqueues it to a dedicated queue
      for downstream processing, enabling order notifications to be sent without blocking the
      order creation transaction.
    confidence: high
    confidence_basis: >
      The requirement is enforced through both declarative (ejb-jar.xml: session-type Stateless,
      transaction-type Container, resource declarations, container-transaction with Required attribute)
      and programmatic (AsyncSenderEJB.sendAMessage with JMS connection lifecycle management).
      Both passes A and B independently confirmed this capability. The integration is verified by:
      (1) bean configuration declares Stateless with Container-managed transactions, (2) JMS resource
      references are bound via JNDI in ejb-jar.xml, (3) OrderEJBAction invokes sendAMessage after
      order creation, (4) messaging is transacted at the container level.
    risk_class: operational
    basis: >
      AsyncSender is a Stateless Session Bean (ejb-jar.xml lines 46-68) that manages JMS queue
      connections and sends messages. The bean lifecycle is managed by the EJB container:
      ejbCreate initializes QueueConnectionFactory and Queue references via ServiceLocator lookup
      (AsyncSenderEJB.java lines 58-66), sendAMessage(String) creates transacted connections and
      sends TextMessage objects to the queue (lines 68-90). The bean is invoked from OrderEJBAction
      after order processing (caller passes purchase order as XML via toXML() serialization) and
      operates within the caller's transaction context (container-transaction trans-attribute Required
      at ejb-jar.xml lines 122-132). Message transmission participates in order creation's atomicity:
      if the transaction rolls back, the queued message is also rolled back.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 46
        line_end: 68
        excerpt: |
          <session>
            <display-name>AsyncSenderJAR</display-name>
            <ejb-name>AsyncSenderEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSender</local>
            <ejb-class>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>
            <security-identity>
              <use-caller-identity></use-caller-identity>
            </security-identity>
            <resource-ref>
              <res-ref-name>jms/QueueConnectionFactory</res-ref-name>
              <res-type>javax.jms.QueueConnectionFactory</res-type>
              <res-auth>Container</res-auth>
              <res-sharing-scope>Shareable</res-sharing-scope>
            </resource-ref>
            <resource-env-ref>
              <resource-env-ref-name>jms/AsyncSenderQueue</resource-env-ref-name>
              <resource-env-ref-type>javax.jms.Queue</resource-env-ref-type>
            </resource-env-ref>
          </session>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 90
        excerpt: |
          public void sendAMessage(String msg)  {
            QueueSession session = null;
            QueueConnection qConnect = null;
            QueueSender qSender = null;

            try {
              qConnect = qFactory.createQueueConnection();
              session = qConnect.createQueueSession(true,0);
              qSender = session.createSender(q);
              TextMessage jmsMsg = session.createTextMessage();
              jmsMsg.setText(msg);
              qSender.send(jmsMsg);
            }catch  (Exception e) {
              e.printStackTrace();
              throw new EJBException("askMDBToSendAMessage: Error!",e);
            } finally {
              try {
                if( qConnect != null ) {
                  qConnect.close();
                }
              } catch(Exception e) {}
            }
          }
    stack_metadata:
      ejb.bean: AsyncSenderEJB
      ejb.transaction: Required
      jms.queue: AsyncSenderQueue

  - record_key: NOTIF-ASYNC-0002
    kind: business-rule
    capability_key: notification-messaging
    requirement: >
      GIVEN an order is submitted via OrderEJBAction,
      WHEN the order creation completes successfully,
      THEN the system SHALL serialize the purchase order (containing order ID, user ID, email,
      order date, shipping address, billing address, credit card, and line items) to XML format
      and transmit it to the AsyncSender bean for enqueue to the messaging queue.
    confidence: high
    confidence_basis: >
      Both passes A and B independently confirmed this business rule. The signature of sendAMessage
      accepts a String parameter; the only caller in OrderEJBAction invokes it with purchaseOrder.toXML(),
      establishing XML as the mandated format. The invocation occurs after order construction but before
      cart clearing (OrderEJBAction.perform() lines 140-152), confirming order data serialization is
      prerequisite to messaging. No alternative message formats or serialization paths are present in
      the codebase.
    risk_class: operational
    basis: >
      In OrderEJBAction.perform(), the purchase order is constructed with complete order metadata
      (order ID, user ID, email, shipping info, billing info, credit card, line items each containing
      category, product ID, item ID, line number, quantity, and unit cost). After totaling cart items,
      the code instantiates AsyncSenderLocalHome via service locator, creates an AsyncSender session bean,
      and invokes sender.sendAMessage(purchaseOrder.toXML()). This is the sole integration point for
      AsyncSender in the application, establishing XML serialization as mandatory.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 140
        line_end: 152
        excerpt: |
          try {
            ServiceLocator sl = new ServiceLocator();
            AsyncSenderLocalHome home = (AsyncSenderLocalHome)
              sl.getLocalHome(JNDINames.ASYNCSENDER_LOCAL_EJB_HOME);
            AsyncSender  sender= home.create();
            sender.sendAMessage(purchaseOrder.toXML());
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSender.java
        line_start: 44
        line_end: 47
        excerpt: |
          public interface AsyncSender extends EJBLocalObject {
              public void sendAMessage(String message);
          }
    stack_metadata:
      message.format: XML

  - record_key: NOTIF-ASYNC-0003
    kind: business-rule
    capability_key: notification-messaging
    requirement: >
      The AsyncSender bean SHALL execute message transmission within a container-managed transaction
      with the Required attribute, ensuring that message enqueue is atomic with the order creation
      transaction and is rolled back if order processing fails.
    confidence: high
    confidence_basis: >
      Both declarative (ejb-jar.xml: transaction-type Container, container-transaction trans-attribute Required)
      and programmatic (AsyncSenderEJB.sendAMessage creates transacted QueueSession with true flag)
      evidence independently confirm this constraint. No programmatic transaction overrides are present.
      The configuration appears in assembly-descriptor section (lines 122-132), establishing it as a
      container-enforced invariant.
    risk_class: operational
    basis: >
      ejb-jar.xml declares transaction-type as Container (line 53) and specifies trans-attribute Required
      for sendAMessage in the container-transaction section (lines 122-132). This ensures that the
      message send operation participates in the caller's transaction: if OrderEJBAction's transaction
      rolls back (e.g., due to payment failure or inventory unavailability), the queued message is also
      rolled back, preventing orphaned order notifications for failed transactions. The implementation
      confirms this by explicitly creating a transacted QueueSession (createQueueSession(true, 0) at
      line 75), instructing the JMS provider to join the EJB transaction.
