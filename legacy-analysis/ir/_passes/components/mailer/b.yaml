  - record_key: NOTIF-BUSINESS-0010
    kind: business-rule
    capability_key: notification-messaging
    requirement: >
      When XML document parsing fails, the system SHALL throw an EJBException
      to the container, which will cause the JMS message to be redelivered.
    confidence: high
    confidence_basis: >
      MailerMDB.onMessage() explicitly catches XMLDocumentException at line 86
      and throws EJBException. The Container transaction attribute is "Required"
      (ejb-jar.xml line 79), which means any EJBException causes the transaction
      to roll back and the message to be redelivered by the container.
    risk_class: operational
    basis: >
      MailerMDB.java lines 86-87 show XMLDocumentException is caught and
      re-thrown as EJBException. The ejb-jar.xml assembly-descriptor line 79
      sets trans-attribute to "Required", making the MDB transaction an
      automatic container-managed transaction that will be rolled back on
      EJBException.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 86
        line_end: 90
        excerpt: |
          } catch (XMLDocumentException xde) {
            throw new EJBException("MailerMDB.onMessage" + xde);
          } catch(JMSException je) {
            throw new EJBException("MailerMDB.onMessage" + je);
          }
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 71
        line_end: 81
        excerpt: |
          <assembly-descriptor>
            <container-transaction>
              <method>
                <ejb-name>MailerMDB</ejb-name>
                <method-name>onMessage</method-name>
                <method-params>
                  <method-param>javax.jms.Message</method-param>
                </method-params>
              </method>
              <trans-attribute>Required</trans-attribute>
            </container-transaction>
           </assembly-descriptor>
    stack_metadata:
      ejb.transaction: Required

