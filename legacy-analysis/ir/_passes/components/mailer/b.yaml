  - record_key: NOTIF-REQUIREMENT-0003
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL send email via J2EE Mail Session obtained from the
      application server container via JNDI lookup at
      java:comp/env/mail/MailSession.
    confidence: high
    confidence_basis: >
      The JNDI name is declared in two independent sources: the Java constant
      in JNDINames.java and the resource-ref in ejb-jar.xml. Both specify the
      same JNDI path, confirming the deployment-time configuration and
      runtime lookup are aligned.
    risk_class: operational
    basis: >
      MailHelper.java line 72-73 uses InitialContext to look up the
      MailSession at the JNDI name defined in JNDINames.MAIL_SESSION. The
      JNDINames constant is set to "java:comp/env/mail/MailSession" at line 50.
      The ejb-jar.xml resource-ref at lines 58-63 declares this resource with
      res-type javax.mail.Session.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/util/JNDINames.java
        line_start: 49
        line_end: 51
        excerpt: |
          public static final String MAIL_SESSION =
                "java:comp/env/mail/MailSession";
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 72
        line_end: 73
        excerpt: |
          InitialContext ic = new InitialContext();
          Session session = (Session) ic.lookup(JNDINames.MAIL_SESSION);
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 58
        line_end: 63
        excerpt: |
          <resource-ref>
             <res-ref-name>mail/MailSession</res-ref-name>
             <res-type>javax.mail.Session</res-type>
             <res-auth>Container</res-auth>
             <res-sharing-scope>Shareable</res-sharing-scope>
           </resource-ref>
    stack_metadata:
      ejb.bean: MailHelper

  - record_key: NOTIF-REQUIREMENT-0004
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL set the email sender address using the default
      sender from the J2EE Mail Session configuration.
    confidence: medium
    confidence_basis: >
      The code calls msg.setFrom() with no arguments at MailHelper.java line 75.
      The Javadoc for MimeMessage.setFrom() with no args specifies it uses the
      default sender from the Session properties. No other code path sets a
      sender address. However, no explicit test or configuration validation is
      present to verify the session has a default set at deployment time.
    risk_class: presentational
    basis: >
      MailHelper.java line 75 invokes setFrom() without arguments, which is a
      J2EE Mail API method that relies on the Mail Session to have a default
      sender (mail.from property) configured in the application server.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 74
        line_end: 78
        excerpt: |
          Message msg = new MimeMessage(session);
            msg.setFrom();
            msg.setRecipients(Message.RecipientType.TO,
                     InternetAddress.parse(emailAddress, false));
    stack_metadata:
      ejb.bean: MailHelper

  - record_key: NOTIF-REQUIREMENT-0005
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL accept email recipient addresses as a string parameter
      and parse them using InternetAddress.parse() with strict=false to allow
      multiple recipients in a single string.
    confidence: high
    confidence_basis: >
      The MailHelper.createAndSendMail method directly calls
      InternetAddress.parse(emailAddress, false) at line 77. The false flag
      is the strict parameter in the javax.mail API, which determines whether
      to parse single or multiple addresses. The code clearly intends to
      support multiple recipients.
    risk_class: operational
    basis: >
      MailHelper.java line 76-77 calls InternetAddress.parse(emailAddress,
      false), which is a standard J2EE Mail API call. The false value for
      strict means multiple comma-separated addresses can be parsed.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 76
        line_end: 77
        excerpt: |
          msg.setRecipients(Message.RecipientType.TO,
                   InternetAddress.parse(emailAddress, false));
    stack_metadata:
      ejb.bean: MailHelper

  - record_key: NOTIF-REQUIREMENT-0006
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL set the email content type to text/html and encode
      the message body as UTF-8.
    confidence: high
    confidence_basis: >
      MailHelper.java line 79 hardcodes contentType = "text/html". Line 66 of
      ByteArrayDataSource.java explicitly encodes data as UTF-8. Both are in
      the same code path and both are declarative constants with no overrides.
    risk_class: presentational
    basis: >
      MailHelper.java line 79 sets contentType to "text/html" (no configuration
      option). ByteArrayDataSource at line 66 calls data.getBytes("UTF-8"),
      establishing UTF-8 as the fixed encoding for all mail bodies.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
