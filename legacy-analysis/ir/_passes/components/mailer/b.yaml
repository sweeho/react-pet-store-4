records:
  - record_key: NOTIF-WORKFLOW-0001
    kind: workflow
    capability_key: notification-messaging
    requirement: >
      The system SHALL process mail notifications asynchronously via a
      message-driven bean that listens on a JMS queue for incoming mail
      messages and initiates the send operation.
    confidence: high
    confidence_basis: >
      The MailerMDB class implements MessageDrivenBean and MessageListener
      interfaces with a clearly defined onMessage method that processes
      incoming TextMessages from a JMS queue. The ejb-jar.xml declaratively
      configures the MDB to listen on javax.jms.Queue with Container-managed
      transactions. Both code and deployment descriptor agree.
    risk_class: operational
    basis: >
      MailerMDB is declared in ejb-jar.xml with destination-type set to
      javax.jms.Queue. The onMessage method expects TextMessage objects
      containing XML-serialized mail data. The asynchronous processing
      decouples mail sending from the caller.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 56
        line_end: 65
        excerpt: |
          public class MailerMDB implements MessageDrivenBean, MessageListener {
            private Context context;
            private MessageDrivenContext mdc = null;
            public MailerMDB() {}
            public void ejbCreate() {}
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 47
        line_end: 65
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>MailerMDB</display-name>
            <ejb-name>MailerMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.mailer.ejb.MailerMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
    stack_metadata:
      ejb.bean: MessageDrivenBean
      jms.queue: javax.jms.Queue

  - record_key: NOTIF-REQUIREMENT-0002
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL extract mail metadata (recipient address, subject,
      content) from XML-formatted JMS TextMessages and validate the structure
      against a DTD schema before processing.
    confidence: high
    confidence_basis: >
      The Mail.fromXML() static method in Mail.java explicitly parses XML
      from incoming TextMessage with DTD validation enabled (VALIDATING =
      true). The DTD schema (Mail.dtd) prescribes required elements: Address,
      Subject, Content. Both code and schema are declarative and independent
      sources of truth.
    risk_class: operational
    basis: >
      Mail.java line 54 sets VALIDATING = true. The fromXML method at line 121
      invokes Mail.fromXML(buffer, null, VALIDATING) which validates against
      Mail.dtd. The DTD at line 38 requires Mail element with child elements
      Address, Subject, Content in order.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 54
        line_end: 54
        excerpt: |
          public static final boolean VALIDATING = true;
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 121
        line_end: 137
        excerpt: |
          public static Mail fromXML(String buffer) throws XMLDocumentException {
            return fromXML(buffer, null, VALIDATING);
          }
          public static Mail fromXML(Source source, URL entityCatalogURL, boolean validating) throws XMLDocumentException {
            return fromDOM(XMLDocumentUtils.fromXML(source, DTD_PUBLIC_ID, entityCatalogURL, validating).getDocumentElement());
          }
          public static Mail fromXML(String buffer, URL entityCatalogURL, boolean validating) throws XMLDocumentException {
            try {
              return fromXML(new StreamSource(new StringReader(buffer)), entityCatalogURL, validating);
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 42
        excerpt: |
