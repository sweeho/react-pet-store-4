            </mail-configuration>
          </resource-ref>
    stack_metadata:
      ejb.bean: MailHelper

  - record_key: NOTIF-MSG-0006
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      Email recipients SHALL be parsed from recipient address string using
      javax.mail.internet.InternetAddress.parse() with non-strict RFC parsing mode
    confidence: high
    confidence_basis: >
      Code explicitly calls InternetAddress.parse(emailAddress, false) where false
      disables strict RFC parsing. This is a single authoritative source showing
      non-strict parsing is intentional.
    risk_class: operational
    basis: >
      MailHelper.createAndSendMail calls InternetAddress.parse with strict=false
      parameter.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 76
        line_end: 77
