  - record_key: NOTIF-MSG-0009
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL handle mail failures gracefully by catching MailerAppException
      and suppressing output errors to allow continued JMS message processing
    confidence: medium
    confidence_basis: >
      Exception handling in MailerMDB.onMessage catches MailerAppException but
      comment states "ignore since user probably forgot to set up mail server".
      This indicates known failure mode but suppression behavior may be permissive.
      XMLDocumentException and JMSException are rethrown, showing selective handling.
    risk_class: operational
    basis: >
      MailerMDB.onMessage catches MailerAppException and treats it as non-fatal. Code
      comment indicates mail server misconfiguration is expected but benign failure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 83
        line_end: 90
