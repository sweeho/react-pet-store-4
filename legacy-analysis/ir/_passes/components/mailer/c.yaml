  - record_key: NOTIF-MSG-0008
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      Mail messages SHALL be sent via javax.mail.Transport.send() and MUST complete
      within the scope of a container-managed transaction with Required attribute
    confidence: high
    confidence_basis: >
      Assembly descriptor explicitly declares trans-attribute Required for MailerMDB
      onMessage method in ejb-jar.xml. Transport.send() is called within onMessage
      which is subject to this transaction boundary.
    risk_class: operational
    basis: >
      ejb-jar.xml assembly-descriptor defines container-transaction for MailerMDB
      onMessage with Required attribute. MailHelper.createAndSendMail called from
      onMessage sends via Transport.send().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 71
        line_end: 80
        excerpt: |
          <assembly-descriptor>
            <container-transaction>
              <method>
                <ejb-name>MailerMDB</ejb-name>
                <method-name>onMessage</method-name>
                <method-params>
                  <method-param>javax.jms.Message</method-param>
                </method-params>
              </method>
              <trans-attribute>Required</trans-attribute>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 85
