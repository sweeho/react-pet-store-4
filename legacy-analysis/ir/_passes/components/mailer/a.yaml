      framework: JavaMail (javax.mail)

  - record_key: notification-messaging-req-0004
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL gracefully handle mail server unavailability by catching
      MailerAppException and suppressing the error, allowing the MDB to continue processing
      without rolling back the message transaction.
    confidence: medium
    confidence_basis: >
      The MailerMDB.onMessage method (line 83-85) explicitly catches MailerAppException with
      a comment "ignore since user probably forgot to set up mail server" and does not rethrow.
      This is captured in both the source code comment and the catch block. However, no explicit
      configuration or documentation explains the recovery mechanism, only the comment in code.
    risk_class: operational
    basis: >
      MailerMDB.onMessage (line 83-85) catches MailerAppException with explicit comment and
      empty handler block. MailHelper.createAndSendMail (line 86-89) wraps all exceptions as
      MailerAppException with message "Failure while sending mail". This allows the mailer to
      degrade gracefully if the mail server is misconfigured.
    traces:
