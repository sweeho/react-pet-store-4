  - record_key: notification-messaging-integration-0001
    kind: integration
    capability_key: notification-messaging
    requirement: >
      The system SHALL receive email notifications asynchronously via JMS queue messaging,
      with mail messages queued by order processing workflow transitions (order approval,
      invoice generation, order completion) as part of their state transition logic.
    confidence: high
    confidence_basis: >
      The MailOrderApprovalTransitionDelegate, MailInvoiceMDB, and MailCompletedOrderTD classes
      all implement TransitionDelegate interface and explicitly queue messages to JNDINames.MAIL_SENDER_QUEUE.
      The MailOrderApprovalTransitionDelegate.doTransition (line 80-93) iterates over a collection
      of XML mail messages from TransitionInfo and sends each via mailHelper.sendMessage(xmlMail).
      This is invoked as part of the order state machine in the OPC (Order Processing Center).
    risk_class: operational
    basis: >
      MailOrderApprovalTransitionDelegate (line 55-95) implements TransitionDelegate and maintains
      a Queue obtained from JNDI via JNDINames.MAIL_SENDER_QUEUE. The setup() method (line 66-75)
      initializes QueueConnectionFactory and Queue. The doTransition method (line 80-93) receives
      a TransitionInfo containing xmlMailMessage collection and sends each message via
      mailHelper.sendMessage(xmlMail). This is called as part of the OPC workflow.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/MailOrderApprovalTransitionDelegate.java
        line_start: 38
        line_end: 95
        excerpt: |
          package com.sun.j2ee.blueprints.opc.transitions;
          import javax.jms.*;
          import com.sun.j2ee.blueprints.servicelocator.ServiceLocatorException;
          import com.sun.j2ee.blueprints.servicelocator.ejb.ServiceLocator;
          import com.sun.j2ee.blueprints.processmanager.transitions.*;

          public class MailOrderApprovalTransitionDelegate implements TransitionDelegate {
            private Queue q;
            private QueueConnectionFactory qFactory;
            private QueueHelper mailHelper;

            public MailOrderApprovalTransitionDelegate() {}

            public void setup() throws TransitionException {
              try {
                ServiceLocator serviceLocator = new ServiceLocator();
                qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
                q = serviceLocator.getQueue(JNDINames.MAIL_SENDER_QUEUE);
                mailHelper = new QueueHelper(qFactory, q);
              } catch (ServiceLocatorException se) {
                  throw new TransitionException(se);
              }
            }

            public void doTransition(TransitionInfo info) throws TransitionException {
              String xmlMail = null;
              Collection mailingList = info.getXMLMessageBatch();
              try {
                Iterator it = mailingList.iterator();
                while(it!= null && it.hasNext()) {
                    xmlMail = (String) it.next();
                    mailHelper.sendMessage(xmlMail);
                }
              } catch (JMSException je) {
                  throw new TransitionException(je);
              }
            }
          }
    stack_metadata:
      jms.queue: MAIL_SENDER_QUEUE
      framework: Transition Delegate pattern (OPC)

  - record_key: notification-messaging-workflow-0001
    kind: workflow
    capability_key: notification-messaging
    requirement: >
      The system SHALL implement an asynchronous email notification workflow that receives
      order state transition events and dispatches email notifications to customers without
      impacting order processing latency.
    confidence: medium
    confidence_basis: >
      The mailer component is designed as an asynchronous message consumer (MDB) that listens
      on a JMS queue. The MailOrderApprovalTransitionDelegate queues messages as part of the
      order approval workflow (triggered after order creation). The container-managed transaction
      semantics ensure message receipt atomicity. However, the exact customer notification rules
      (when emails are sent, which events trigger them) are defined in the OPC transition logic,
      not in the mailer component itself.
    risk_class: operational
    basis: >
      The workflow is evident from: (1) MailerMDB implements MessageDrivenBean and MessageListener
      for asynchronous processing, (2) Container-managed transactions (Required) ensure atomicity,
      (3) MailOrderApprovalTransitionDelegate queues messages from order state transitions,
      (4) Error handling suppresses mail server failures to avoid order processing rollback.
      The complete notification rules are in the OPC transition delegates, not captured in mailer
      component itself.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 48
        line_end: 81
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>MailerMDB</display-name>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
          </message-driven>
          <container-transaction>
            <method>
              <ejb-name>MailerMDB</ejb-name>
              <method-name>onMessage</method-name>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/MailOrderApprovalTransitionDelegate.java
        line_start: 77
        line_end: 93
        excerpt: |
          /**
           * send a Mail message to mailer service, so customer gets an email
           */
          public void doTransition(TransitionInfo info) throws TransitionException {
            String xmlMail = null;
            Collection mailingList = info.getXMLMessageBatch();
            try {
              Iterator it = mailingList.iterator();
              while(it!= null && it.hasNext()) {
                  xmlMail = (String) it.next();
                  mailHelper.sendMessage(xmlMail);
              }
            } catch (JMSException je) {
                throw new TransitionException(je);
            }
          }
    stack_metadata:
      ejb.bean: MailerMDB
      ejb.transaction: Required
      jms.queue: MAIL_SENDER_QUEUE

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
    description: >
      The MailerMDB catches MailerAppException and suppresses it silently with a comment
      "ignore since user probably forgot to set up mail server". This behavior conflicts
      with the container-managed transaction model: if the mail server is unavailable,
      the MDB continues processing and the message is implicitly acknowledged. This may
      result in lost notifications. It is unclear whether this is intentional (degraded
      service) or a defect. A human should clarify the intended behavior for mail server
      unavailability and whether messages should be retried, dead-lettered, or persisted.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
    description: >
      The method comment at line 68-72 refers to "opc node to process PurchaseOrders",
      but the mailer component is not specific to purchase orders—it is a general-purpose
      email service that can send any Mail message. The description in ejb-jar.xml at
      line 49 makes the same claim. This suggests the component was originally specialized
      for OPC but was later generalized. The scope of which message types currently use
      the mailer is not visible in the component code itself.
