records:
  - record_key: notification-messaging-req-0001
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL process email messages received on a JMS queue and send them to
      SMTP mail recipients asynchronously without blocking the originating transaction.
    confidence: high
    confidence_basis: >
      Both the EJB deployment descriptor (ejb-jar.xml) and MailerMDB source code implement
      a container-managed message-driven bean that listens on a javax.jms.Queue and invokes
      onMessage() for each text message. Container-managed transactions (Required attribute)
      ensure atomicity of message receipt and mail send.
    risk_class: operational
    basis: >
      The MailerMDB class implements MessageDrivenBean and MessageListener interfaces. The
      ejb-jar.xml declares a message-driven-destination of type javax.jms.Queue with container
      transaction management set to Required. The onMessage method (line 74-91) receives TextMessage,
      parses XML, and delegates to MailHelper.createAndSendMail().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 56
        line_end: 91
        excerpt: |
          public class MailerMDB implements MessageDrivenBean, MessageListener {
            public void onMessage(Message recvMsg) {
              TextMessage textMessage = null;
              String xmlMailMessage = null;
              Mail recMail = null;
              try {
                textMessage = (TextMessage)recvMsg;
                xmlMailMessage = textMessage.getText();
                recMail = Mail.fromXML(xmlMailMessage);
                sendMail(recMail.getAddress(), recMail.getSubject(), recMail.getContent(),  Locale.getDefault());
              } catch (MailerAppException me) {
                //ignore since user probably forgot to set up mail server
              } catch (XMLDocumentException xde) {
                throw new EJBException("MailerMDB.onMessage" + xde);
              } catch(JMSException je) {
                throw new EJBException("MailerMDB.onMessage" + je);
              }
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 48
        line_end: 81
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>MailerMDB</display-name>
            <ejb-name>MailerMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.mailer.ejb.MailerMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
            <resource-ref>
              <res-ref-name>mail/MailSession</res-ref-name>
              <res-type>javax.mail.Session</res-type>
              <res-auth>Container</res-auth>
              <res-sharing-scope>Shareable</res-sharing-scope>
            </resource-ref>
          </message-driven>
          <container-transaction>
            <method>
              <ejb-name>MailerMDB</ejb-name>
              <method-name>onMessage</method-name>
              <method-params>
                <method-param>javax.jms.Message</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.bean: MailerMDB
      jms.queue: javax.jms.Queue (destination-type in ejb-jar.xml)
      ejb.transaction: Required

  - record_key: notification-messaging-req-0002
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL parse email message payloads from XML format containing Address,
      Subject, and Content elements and validate them against a DTD schema.
    confidence: high
    confidence_basis: >
      The Mail class provides static fromXML methods with explicit DTD validation (VALIDATING=true).
      The Mail.fromXML(String) method parses XML using XMLDocumentUtils with DTD_PUBLIC_ID and
      DTD_SYSTEM_ID constants. The DTD file Mail.dtd defines the exact structure required.
      Both MailerMDB and the transition delegates pass XML strings to Mail.fromXML.
    risk_class: operational
    basis: >
      Mail class (line 117-137) implements fromXML with three overloads: Source-based, String-based,
      and with URL entity catalog. The VALIDATING constant is set to true (line 54). DTD constants
      reference the Mail.dtd schema. The Mail.fromXML(String buffer) method at line 121-123 calls
      fromXML(new StreamSource(...), entityCatalogURL, VALIDATING).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 51
        line_end: 137
        excerpt: |
          public class Mail {
            public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD OPC Mail 1.0//EN";
            public static final String DTD_SYSTEM_ID = "/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd";
            public static final boolean VALIDATING = true;
            private String address = null;
            private String subject  = null;
            private String content = null;

            public static Mail fromXML(Source source) throws XMLDocumentException {
              return fromXML(source, null, VALIDATING);
            }
            public static Mail fromXML(String buffer) throws XMLDocumentException {
              return fromXML(buffer, null, VALIDATING);
            }
            public static Mail fromXML(String buffer, URL entityCatalogURL, boolean validating) throws XMLDocumentException {
              try {
                return fromXML(new StreamSource(new StringReader(buffer)), entityCatalogURL, validating);
              } catch (XMLDocumentException exception) {
                System.err.println(exception.getRootCause().getMessage());
                throw new XMLDocumentException(exception);
              }
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 42
        excerpt: |
