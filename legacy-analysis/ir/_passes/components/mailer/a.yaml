  - record_key: notification-messaging-entity-0001
    kind: entity
    capability_key: notification-messaging
    requirement: >
      The Mail entity SHALL contain three string fields: Address (recipient email address),
      Subject (email subject line), and Content (email body text). All three fields are required
      elements in the XML representation.
    confidence: high
    confidence_basis: >
      The Mail class defines three private String fields (address, subject, content) with
      corresponding getter methods. The DTD schema defines all three as required elements
      (<!ELEMENT Mail (Address, Subject, Content)>) with no optionality. The fromDOM method
      extracts all three in sequence without null checks, confirming they are mandatory.
    risk_class: operational
    basis: >
      Mail class (line 51-62) declares three private String fields: address, subject, content
      with corresponding getters (line 75-84). The constructor (line 66-71) accepts all three.
      The Mail.dtd (line 38) defines the strict sequence: Mail contains Address, Subject, Content
      in order. The fromDOM method (line 154-165) parses all three sequentially from the DOM.
    traces:
