  - record_key: notification-messaging-req-0003
    kind: requirement
    capability_key: notification-messaging
    requirement: >
      The system SHALL send email messages via SMTP using a container-managed JavaMail
      Session resource and support HTML content type (text/html) with MIME multipart encoding.
    confidence: high
    confidence_basis: >
      MailHelper.createAndSendMail() uses InitialContext JNDI lookup to obtain a javax.mail.Session
      from the configured resource reference. The method creates MimeMessage, sets recipients using
      InternetAddress parsing, and uses DataHandler with ByteArrayDataSource to set content type as
      text/html (line 79). Transport.send() is used to submit the message to SMTP. The JNDI resource
      is declared in ejb-jar.xml with res-type javax.mail.Session.
    risk_class: operational
    basis: >
      MailHelper.createAndSendMail (line 70-90) performs: (1) JNDI lookup of Session from
      java:comp/env/mail/MailSession (via JNDINames.MAIL_SESSION), (2) creates MimeMessage,
      (3) sets recipients via InternetAddress.parse(), (4) sets content type to text/html,
      (5) uses ByteArrayDataSource and DataHandler for payload, (6) calls Transport.send().
      The ejb-jar.xml resource-ref (line 58-63) declares mail/MailSession as javax.mail.Session
      with Container authentication.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 62
        line_end: 91
        excerpt: |
          public class MailHelper {
            public void createAndSendMail(String emailAddress, String subject, String mailContent, Locale locale) throws MailerAppException {
              try {
                InitialContext ic = new InitialContext();
                Session session = (Session) ic.lookup(JNDINames.MAIL_SESSION);
                Message msg = new MimeMessage(session);
                msg.setFrom();
                msg.setRecipients(Message.RecipientType.TO,
                         InternetAddress.parse(emailAddress, false));
                msg.setSubject(subject);
                String contentType = "text/html";
                StringBuffer sb = new StringBuffer(mailContent);
                msg.setDataHandler(new DataHandler(
                                    new ByteArrayDataSource(sb.toString(), contentType)));
                msg.setHeader("X-Mailer", "JavaMailer");
                msg.setSentDate(new Date());
                Transport.send(msg);
              } catch (Exception e) {
                System.err.print("createAndSendMail exception : " + e);
                throw new MailerAppException("Failure while sending mail");
              }
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/util/JNDINames.java
        line_start: 45
        line_end: 52
        excerpt: |
          public class JNDINames {
            private JNDINames() { }
            public static final String MAIL_SESSION =
                  "java:comp/env/mail/MailSession";
          }
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 58
        line_end: 63
        excerpt: |
          <resource-ref>
            <res-ref-name>mail/MailSession</res-ref-name>
            <res-type>javax.mail.Session</res-type>
            <res-auth>Container</res-auth>
            <res-sharing-scope>Shareable</res-sharing-scope>
          </resource-ref>
