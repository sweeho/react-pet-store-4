  - record_key: CUST-TRANSACTION-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL enforce transactional consistency by applying container-managed
      transactions with trans-attribute Required to all EJB methods (getters/setters) for
      CustomerEJB, AccountEJB, ProfileEJB, ContactInfoEJB, AddressEJB, and CreditCardEJB.
    confidence: high
    confidence_basis: >
      ejb-jar.xml assembly-descriptor defines method-permission and container-transaction elements
      for all entities. method-permission entries declare all methods on Profile, Address, ContactInfo,
      and CreditCard as unchecked (lines 372-399), and extensive method-level permissions and
      transactions are declared for CustomerEJB and CreditCardEJB. This pattern indicates
      transaction management is declaratively enforced at the container level.
    risk_class: operational
    basis: >
      Declarative transaction configuration in ejb-jar.xml assembly-descriptor enforced by
      EJB container at deployment.
