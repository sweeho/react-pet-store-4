  - record_key: CUST-WORKFLOW-0001
    kind: workflow
    capability_key: customer-account
    requirement: >
      WHEN a new Customer is created with a userId, THEN the system SHALL automatically
      create an associated Account with status "Active" via AccountLocalHome.Active constant,
      and the Account SHALL automatically create a nested ContactInfo and CreditCard entity.
    confidence: high
    confidence_basis: >
      CustomerEJB.ejbPostCreate (lines 74-89) shows the deterministic workflow: (1) AccountLocalHome
      lookup and create with AccountLocalHome.Active constant, (2) setAccount call. AccountEJB.ejbPostCreate
      (lines 80-94) for the single-parameter form shows (3) ContactInfoLocalHome lookup and create,
      (4) CreditCardLocalHome lookup and create. This occurs automatically on Account creation unless
      a NamingException is caught.
    risk_class: operational
    basis: >
      Programmatic workflow in ejbPostCreate lifecycle methods called by EJB container.
      The nested creation occurs in both Customer and Account ejbPostCreate methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
            try {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);
              ProfileLocalHome plh = (ProfileLocalHome) ic.lookup("java:comp/env/ejb/Profile");
              ProfileLocal profile = plh.create(ProfileLocalHome.DefaultPreferredLanguage,
              ProfileLocalHome.DefaultFavoriteCategory, ProfileLocalHome.DefaultMyListPreference,
              ProfileLocalHome.DefaultBannerPreference);
              setProfile(profile);
            } catch (NamingException ne) {
              throw new CreateException ("could not lookup ejb. Exception is " + ne.getMessage());
            }
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 94
        excerpt: |
          public void ejbPostCreate(String status) throws CreateException {
            setStatus(status);
            try {
              InitialContext ic = new InitialContext();
              ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
              ContactInfoLocal contactInfo = cih.create();
              setContactInfo(contactInfo);
              CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
              CreditCardLocal creditCard = cch.create();
              setCreditCard(creditCard);
            } catch (javax.naming.NamingException ne) {
              throw new CreateException("ContactInfoEJB error: naming exception looking up contact info or credit card");
            }

