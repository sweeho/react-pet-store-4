  - record_key: CUST-ENTITY-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL maintain a Customer entity identified by a unique userId string as its primary key,
      with container-managed persistence and abstract accessor methods for userId, Account, and Profile relationships.
    confidence: high
    confidence_basis: >
      The Customer entity is declared in ejb-jar.xml with persistence-type Container and cmp-version 2.x
      (lines 46-88). userId is declared as a CMP field (lines 57-60) and primkey-field (line 61).
      CustomerEJB defines abstract getters/setters for userId, Account (via CMR), and Profile (via CMR).
      The primary key class is java.lang.String (line 53).
    risk_class: operational
    basis: >
      CMP declaration in ejb-jar.xml declares the field as persistent; primary key constraint enforced
      by EJB container. Abstract accessors in CustomerEJB are the programmatic interface.
    traces:
