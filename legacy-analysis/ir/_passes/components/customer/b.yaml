  - record_key: cust-workflow-0002
    kind: workflow
    capability_key: customer-account
    requirement: >
      GIVEN an Account is created with a status, WHEN ejbPostCreate is invoked, THEN the system SHALL automatically
      create associated ContactInfo and CreditCard entities, initializing them with empty values.
    confidence: high
    confidence_basis: >
      AccountEJB.ejbPostCreate() explicitly creates ContactInfo and CreditCard via JNDI lookup and calls the no-arg
      create() method on each. This is deterministic and always occurs unless a NamingException occurs. The method
      is part of the EJB lifecycle and guaranteed to be called after ejbCreate.
    risk_class: operational
    basis: >
      The ejbPostCreate method for the single-parameter constructor (String status) performs JNDI lookups and creates
      both ContactInfo and CreditCard entities with no-argument constructors, establishing the relationships.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 94
        excerpt: |
          public void ejbPostCreate(String status) throws CreateException {
            setStatus(status);
            try {
              InitialContext ic = new InitialContext();
              ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
              ContactInfoLocal contactInfo = cih.create();
              setContactInfo(contactInfo);
              CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
              CreditCardLocal creditCard = cch.create();
              setCreditCard(creditCard);
            } catch (javax.naming.NamingException ne) {
              throw new CreateException("ContactInfoEJB error: naming exception");
            }
          }
    stack_metadata:
      ejb.bean: AccountEJB

