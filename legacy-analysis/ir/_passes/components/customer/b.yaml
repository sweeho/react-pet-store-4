              <local>com.sun.j2ee.blueprints.customer.profile.ejb.ProfileLocal</local>
            </ejb-local-ref>
            <ejb-local-ref>
              <ejb-ref-name>ejb/Account</ejb-ref-name>
              <local-home>com.sun.j2ee.blueprints.customer.account.ejb.AccountLocalHome</local-home>
              <local>com.sun.j2ee.blueprints.customer.account.ejb.AccountLocal</local>
            </ejb-local-ref>
          </entity>
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 51
        line_end: 65
        excerpt: |
          public abstract class CustomerEJB implements javax.ejb.EntityBean {
            public abstract String getUserId();
            public abstract void setUserId(String userId);
            public abstract AccountLocal getAccount();
            public abstract void setAccount(AccountLocal account);
            public abstract ProfileLocal getProfile();
            public abstract void setProfile(ProfileLocal profile);
          }
    stack_metadata:
      ejb.bean: CustomerEJB
      persistence_type: CMP 2.x

  - record_key: cust-workflow-0001
    kind: workflow
    capability_key: customer-account
    requirement: >
      GIVEN a new user registers, WHEN the system creates a customer with a userId,
      THEN the system SHALL automatically create an associated Account with status "Active" and a Profile with default settings.
    confidence: high
    confidence_basis: >
      ejbPostCreate method in CustomerEJB explicitly creates Account and Profile entities. The Account is created with
      status "Active" (confirmed via AccountLocalHome.Active constant reference). This behavior is deterministic and
      repeated on every customer creation. No variations or conditional logic found.
    risk_class: operational
    basis: >
      CustomerEJB.ejbPostCreate() uses JNDI to look up AccountLocalHome and ProfileLocalHome, then creates instances
      with specific initial values. The Account is initialized with AccountLocalHome.Active status. The Profile is
      created with four default boolean/string parameters from ProfileLocalHome constants.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
            try {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);
              ProfileLocalHome plh = (ProfileLocalHome) ic.lookup("java:comp/env/ejb/Profile");
              ProfileLocal profile = plh.create(ProfileLocalHome.DefaultPreferredLanguage,
              ProfileLocalHome.DefaultFavoriteCategory, ProfileLocalHome.DefaultMyListPreference,
              ProfileLocalHome.DefaultBannerPreference);
              setProfile(profile);
            } catch (NamingException ne) {
              throw new CreateException ("could not lookup ejb. Exception is " + ne.getMessage());
            }
          }
    stack_metadata:
      ejb.bean: CustomerEJB

