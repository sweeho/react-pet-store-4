    kind: entity
    capability_key: customer-account
    requirement: >
      Customer entity with unique userId as primary key, with relationships to Account and Profile entities.
    confidence: high
    confidence_basis: >
      Defined in ejb-jar.xml as Entity EJB with CMP field userId as primkey-field. Relationships confirmed in
      ejb-jar.xml and verified in CustomerEJB source code with abstract accessor methods getAccount/getProfile.
    risk_class: operational
    basis: >
      The Customer entity is a container-managed EJB with userId as the persistent identifier. The entity
      defines two one-to-one relationships to Account and Profile through CMR fields with cascade-delete.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 46
        line_end: 89
        excerpt: |
          <entity>
            <display-name>CustomerEB</display-name>
            <ejb-name>CustomerEJB</ejb-name>
            <cmp-field>
              <field-name>userId</field-name>
            </cmp-field>
            <primkey-field>userId</primkey-field>
