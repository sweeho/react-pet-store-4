  - record_key: CACCT-TRANSACTION-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL enforce transactional consistency with Required transaction attribute
      for all customer, account, profile, credit card, contact info, and address entity
      operations.
    confidence: high
    confidence_basis: >
      ejb-jar.xml assembly-descriptor defines container-transaction elements for all
      methods on all six entity beans with trans-attribute="Required" (lines 675-1490).
      This ensures all changes are part of an ACID transaction.
    risk_class: operational
    basis: >
      Declarative transaction configuration in ejb-jar.xml enforced by EJB container.
      Required attribute means methods must run in a transaction.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 675
        line_end: 682
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>CustomerEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getAccount</method-name>
              <method-params />
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>

  - record_key: CACCT-ENTITY-0007
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL maintain an Account entity that may be created in two forms:
      (1) with only status parameter, or (2) with status, ContactInfo, and CreditCard
      parameters, with ContactInfo and CreditCard automatically created if not provided.
    confidence: high
    confidence_basis: >
      AccountEJB defines two ejbCreate overloads (lines 70-78): one taking only status,
      one taking status, ContactInfo, and CreditCard. ejbPostCreate for single-parameter
      form (lines 80-94) shows automatic creation of ContactInfo and CreditCard via lookup
      and creation. Both overloads declared in ejb-jar.xml create method-params.
    risk_class: operational
    basis: >
      Overloaded ejbCreate and ejbPostCreate methods show flexible account creation with
      automatic entity dependencies when not provided.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 70
        line_end: 94
        excerpt: |
          public Object ejbCreate(String status, ContactInfoLocal contactInfo, CreditCardLocal creditCard) throws CreateException {
            setStatus(status);
            return null;
          }
          public Object ejbCreate(String status) throws CreateException {
            setStatus(status);
            return null;
          }
          public void ejbPostCreate(String status) throws CreateException {
            setStatus(status);
            try {
              InitialContext ic = new InitialContext();
              ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
              ContactInfoLocal contactInfo = cih.create();
              setContactInfo(contactInfo);
              CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
              CreditCardLocal creditCard = cch.create();
              setCreditCard(creditCard);

