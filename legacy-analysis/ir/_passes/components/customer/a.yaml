  - record_key: CACCT-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      When credit card expiry date is stored as a string in MM/YYYY format, the system
      SHALL provide methods getExpiryMonth() and getExpiryYear() that parse and return
      the month and year components separately, with default values "01" and "2010"
      respectively when the expiry date is null or malformed.
    confidence: medium
    confidence_basis: >
      CreditCardEJB.getExpiryMonth() and getExpiryYear() (lines 88-107) implement parsing
      logic but no comment explains why these defaults are chosen. The bare defaults "01"
      and "2010" are low-confidence literals with no configuration or test evidence. The
      parsing logic itself is clear but the defaults appear arbitrary.
    risk_class: financial
    basis: >
      Bare literal constants in getExpiryMonth (line 95) and getExpiryYear (line 106)
      without comment or configuration. Parsing logic is clear from indexOf and substring
      calls but defaults lack justification.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text before it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }
          public String getExpiryYear() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text after it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());
            }
            return "2010";
          }

