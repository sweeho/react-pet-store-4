  - record_key: CACCT-WORKFLOW-0001
    kind: workflow
    capability_key: customer-account
    requirement: >
      When a customer account is created or updated, the system SHALL populate Account
      ContactInfo with givenName, familyName, telephone, and email fields, and populate
      the associated Address with streetName1, streetName2, city, state, zipCode, and
      country fields, propagating updates from the customer request to the EJB entities.
    confidence: high
    confidence_basis: >
      CustomerEJBAction.updateCustomer method (lines 114-128) demonstrates deep copy logic
      that takes ContactInfo from customer event, retrieves AddressLocal from
      contactInfoLocal, and sets all address fields. This is the authoritative workflow
      for customer account update. Both passes should trace this method.
    risk_class: operational
    basis: >
      Programmatic workflow in CustomerEJBAction, the primary action handler for customer
      operations. The method name and structure show this is the intended flow for
      populating customer data.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CustomerEJBAction.java
        line_start: 114
        line_end: 128
        excerpt: |
          ContactInfo contactInfo = ce.getContactInfo();
          contactInfoLocal.setFamilyName(contactInfo.getFamilyName());
          contactInfoLocal.setGivenName(contactInfo.getGivenName());
          contactInfoLocal.setTelephone(contactInfo.getPhone());
          contactInfoLocal.setEmail(contactInfo.getEmail());
          // deep copy over the address
          Address address = contactInfo.getAddress();
          AddressLocal addressLocal = contactInfoLocal.getAddress();
          addressLocal.setStreetName1(address.getStreetName1());
          addressLocal.setStreetName2(address.getStreetName2());
          addressLocal.setCity(address.getCity());
          addressLocal.setZipCode(address.getZipCode());
          addressLocal.setState(address.getState());
          addressLocal.setCountry(address.getCountry());

