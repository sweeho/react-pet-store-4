records:
  - record_key: CUST-ENTITY-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL maintain ContactInfo entities that store customer contact details
      including family name, given name, telephone, email, and a related address reference.
    confidence: high
    confidence_basis: >
      Declared in both DTD (ContactInfo.dtd defines XML element structure) and EJB deployment
      descriptor (ejb-jar.xml defines CMP 2.x entity with four CMP fields). The entity structure
      appears in abstract schema-name and is enforced at two independent levels (declarative schema
      and Java abstraction layer).
    risk_class: operational
    basis: >
      DTD defines ContactInfo element with required children: FamilyName, GivenName, Address,
      Email, Phone. EJB descriptor declares ContactInfoEJB as entity bean with CMP fields for
      familyName, givenName, email, telephone, and CMR field for address relationship.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/rsrc/schemas/ContactInfo.dtd
        line_start: 38
        line_end: 42
        excerpt: |
          <!ELEMENT ContactInfo (FamilyName, GivenName, Address, Email, Phone)>
          <!ELEMENT FamilyName (#PCDATA)>
          <!ELEMENT GivenName (#PCDATA)>
          <!ELEMENT Email (#PCDATA)>
          <!ELEMENT Phone (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 46
        line_end: 79
        excerpt: |
          <entity>
            <display-name>ContactInfoEB</display-name>
            <ejb-name>ContactInfoEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.contactinfo.ejb.ContactInfoLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.contactinfo.ejb.ContactInfoLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.contactinfo.ejb.ContactInfoEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.Object</prim-key-class>
            <reentrant>False</reentrant>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>ContactInfo</abstract-schema-name>
            <cmp-field>
              <field-name>telephone</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>familyName</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>email</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>givenName</field-name>
            </cmp-field>
    stack_metadata:
      framework: ejb
      ejb.bean: entity
      ejb.persistence: CMP-2.x
      ejb.transaction: Required

  - record_key: CUST-ENTITY-0002
    kind: entity
    capability_key: customer-account
    requirement: >
      ContactInfo entities SHALL maintain a one-to-one relationship with Address entities,
      with cascade delete behavior where deletion of an Address deletes the associated ContactInfo record.
    confidence: high
    confidence_basis: >
      The one-to-one relationship and cascade delete are declared in the ejb-jar.xml deployment
      descriptor under the relationships section. This is a declarative constraint enforced by the
      EJB container, not just code-level behavior.
    risk_class: operational
    basis: >
      EJB deployment descriptor defines an ejb-relation between ContactInfoEJB (multiplicity One)
      and AddressEJB (multiplicity One with cascade-delete). The relationship is bidirectional
      with CMR field "address" on the ContactInfo side.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
        line_start: 126
        line_end: 148
        excerpt: |
          <relationships>
            <ejb-relation>
              <ejb-relation-name></ejb-relation-name>
              <ejb-relationship-role>
                <ejb-relationship-role-name>ContactInfoEJB</ejb-relationship-role-name>
                <multiplicity>One</multiplicity>
                <relationship-role-source>
                  <ejb-name>ContactInfoEJB</ejb-name>
                </relationship-role-source>
                <cmr-field>
                  <cmr-field-name>address</cmr-field-name>
                </cmr-field>
              </ejb-relationship-role>
              <ejb-relationship-role>
                <ejb-relationship-role-name>AddressEJB</ejb-relationship-role-name>
                <multiplicity>One</multiplicity>
                <cascade-delete />
                <relationship-role-source>
                  <ejb-name>AddressEJB</ejb-name>
                </relationship-role-source>
              </ejb-relationship-role>
            </ejb-relation>
          </relationships>
    stack_metadata:
      framework: ejb
      ejb.relationship: one-to-one-cascade-delete

  - record_key: CUST-REQ-0001
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL support creation of new ContactInfo entities with specified values
      for given name, family name, telephone, email, and associated Address reference.
    confidence: high
    confidence_basis: >
      Create methods are declared in both the EJB home interface (ContactInfoLocalHome) and
      implemented in the EJB bean class (ContactInfoEJB). The method signatures appear in two
      independent sources (interface and implementation), both matching.
    risk_class: operational
    basis: >
      ContactInfoLocalHome interface declares create method with parameters: String givenName,
      String familyName, String telephone, String email, AddressLocal address. ContactInfoEJB
      implements ejbCreate with corresponding parameter list and logic to set each field.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoLocalHome.java
        line_start: 49
        line_end: 50
        excerpt: |
          public ContactInfoLocal create(String givenName, String familyName,
                                         String telephone, String email, AddressLocal address) throws CreateException;
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 93
        line_end: 101
        excerpt: |
          public Object ejbCreate(String givenName, String familyName,
                                  String telephone, String email, AddressLocal address)
                                  throws CreateException {
            setGivenName(givenName);
            setFamilyName(familyName);
            setTelephone(telephone);
            setEmail(email);
            return null;
          }
    stack_metadata:
      framework: ejb
      ejb.bean: entity
      ejb.transaction: Required

  - record_key: CUST-REQ-0002
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL support creation of ContactInfo entities from an existing ContactInfo
      data transfer object, including automatic creation of a related Address entity from the
      provided Address reference.
    confidence: high
    confidence_basis: >
      The second create method (taking ContactInfo DTO) is declared in the home interface and
      implemented in the bean with matching signatures. The automatic Address creation logic
      is explicit in ejbPostCreate, using ServiceLocator to obtain AddressLocalHome.
    risk_class: operational
    basis: >
      ContactInfoLocalHome declares create(ContactInfo) method. ContactInfoEJB implements
      ejbCreate(ContactInfo) which extracts fields, and ejbPostCreate(ContactInfo) which looks
      up AddressLocalHome via ServiceLocator and creates a new Address entity from the DTO's
      address reference.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoLocalHome.java
        line_start: 52
        line_end: 52
        excerpt: |
          public ContactInfoLocal create(ContactInfo contactInfo) throws CreateException;
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 109
        line_end: 127
        excerpt: |
          public Object ejbCreate(ContactInfo contactInfo) throws CreateException {
            setGivenName(contactInfo.getGivenName());
            setFamilyName(contactInfo.getFamilyName());
            setTelephone(contactInfo.getPhone());
            setEmail(contactInfo.getEmail());
            return null;
          }

          public void ejbPostCreate(ContactInfo contactInfo) throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create(contactInfo.getAddress());
              setAddress(address);
            } catch (ServiceLocatorException ne) {
              throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
            }
          }
    stack_metadata:
      framework: ejb
      ejb.bean: entity
      ejb.transaction: Required

  - record_key: CUST-REQ-0003
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL support retrieving all contact information fields (family name, given name,
      telephone, email) and the related Address entity for an existing ContactInfo record.
    confidence: high
    confidence_basis: >
      All getter methods are declared in the ContactInfoLocal interface and appear as abstract
      methods in the CMP entity bean. The getData() method aggregates all fields including the
      related address. Methods appear in both declarative configuration (ejb-jar.xml) and
      interface/implementation classes.
    risk_class: operational
    basis: >
      ContactInfoLocal interface declares getFamilyName(), getGivenName(), getTelephone(),
      getEmail(), getAddress() getter methods. ContactInfoEJB declares these as abstract methods
      (CMP fields managed by container). getData() method explicitly retrieves all fields and
      delegates to address.getData() for address information.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoLocal.java
        line_start: 43
        line_end: 61
        excerpt: |
          public interface ContactInfoLocal extends javax.ejb.EJBLocalObject {

            public String getFamilyName();
            public void setFamilyName(String familyName);

            public String getGivenName();
            public void setGivenName(String givenName);

            public AddressLocal getAddress();
            public void setAddress(AddressLocal address);

            public String getTelephone();
            public void setTelephone(String telephone);

            public String getEmail();
            public void setEmail(String email);

            public ContactInfo getData();
          }
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 129
        line_end: 137
        excerpt: |
          public ContactInfo getData() {
            ContactInfo contactInfo = new ContactInfo();
            contactInfo.setGivenName(getGivenName());
            contactInfo.setFamilyName(getFamilyName());
            contactInfo.setPhone(getTelephone());
            contactInfo.setEmail(getEmail());
            contactInfo.setAddress(getAddress().getData());
            return contactInfo;
          }
    stack_metadata:
      framework: ejb
      ejb.bean: entity
      ejb.transaction: Required

