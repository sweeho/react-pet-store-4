  - record_key: CUST-RULE-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      All ContactInfo methods SHALL be accessible without explicit authorization checks
      (unchecked access), allowing any authenticated caller to invoke operations on contact information.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml assembly-descriptor contains a method-permission element specifying "unchecked"
      for all ContactInfoEJB methods. The unchecked element is a declarative statement that security
      checks are not required, making this a guaranteed rule rather than an implementation detail.
    risk_class: operational
    basis: >
      The method-permission section of assembly-descriptor lists all ContactInfoEJB methods with
      an unchecked element (lines 150-290), indicating that no specific security role is required
      for method invocation. The security-identity also specifies "use-caller-identity", delegating
      authorization decisions upstream.
