findings:
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
    description: >
      The abstract-schema-name for ContactInfoEJB is declared as "ContactInfo" but there is no
      corresponding CMP query or EJB QL (Enterprise JavaBeans Query Language) defined in the
      deployment descriptor. The findByPrimaryKey method is declared in the home interface but
      its implementation strategy (database lookup behavior) is not specified in the descriptor.
      A human review is needed to determine if there are additional finder methods or query
      definitions elsewhere in the application configuration.
