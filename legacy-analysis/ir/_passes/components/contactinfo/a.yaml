  - record_key: CUST-REQ-0007
    kind: business-rule
    capability_key: customer-account
    requirement: >
      All ContactInfo data access and modification operations SHALL execute within a transaction
      context with "Required" semantics, ensuring ACID properties across create, read, update, and
      delete operations.
    confidence: high
    confidence_basis: >
      Every single method on ContactInfoEJB is listed in the ejb-jar.xml assembly-descriptor with
      an explicit container-transaction element specifying trans-attribute as "Required". This is
      a declarative, universal constraint applying across all operations, making it a guaranteed
      business rule rather than implementation detail.
    risk_class: operational
    basis: >
      The ejb-jar.xml assembly-descriptor contains 15 separate container-transaction declarations
      for ContactInfoEJB methods, each specifying trans-attribute="Required". This includes all
      getters, setters, create methods, and remove methods. No method is excepted from this rule.
    traces:
