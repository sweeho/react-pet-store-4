schemaVersion: 1
program:
  key: SWHR4-N-0001
  title: React Pet Store 4
  source: extraction
capabilities:
  - slug: site-shell
    title: Bootstrap, landing page and shared site shell
    order: 1
    dependsOn: []
    change:
      dir: openspec/changes/swhr4-i-0002-bootstrap-landing-page-and
      specCapabilities: [site-shell]
    canvas:
      problem: "Every storefront, administration and supplier screen needs one frame to sit in. Without a shared shell each capability invents its own banner, navigation and error handling, and nothing owns the home page customers arrive at."
      solution: "A shared site shell on the pinned Vite React + Nitro stack: the Home page as the entry to browsing, a banner on every storefront page with the search box, Account, Cart and Sign in or Sign out links and English, Japanese and Chinese language switches, a Pets panel listing the five categories, and shared empty, loading and general-error frames."
      userStories:
        - "As a shopper, I want a home page that shows the five pet categories, so I can start browsing straight away."
        - "As a shopper, I want the search box, Account, Cart and Sign in links on every page, so I can move around the store from anywhere."
        - "As a shopper, I want to switch the site between English, Japanese and Chinese from any page, so I can shop in my own language."
        - "As a shopper, I want a clear error page with a way back to Home when something fails on the server, so I am never stranded."
      acceptanceCriteria:
        - "Home shows the five categories (Birds, Cats, Dogs, Fish, Reptiles) as the entry to browsing, plus a pet-tips banner when enabled."
        - "Every storefront page carries the banner with the search box, Account, Cart, Sign in or Sign out, and English, Japanese and Chinese language switches."
        - "A Pets panel lists the five categories on every storefront page, and a My List panel appears when enabled."
        - "A server failure renders the General error page with a link back to Home."
        - "Values rendered into pages are escaped, so user-supplied text cannot inject markup."
      outOfScope:
        - "Catalogue administration: categories, products and items are reference data loaded at install."
        - "A Java Web Start desktop client or any other non-browser client."
      screens:
        - "Home: picture of the five categories as the entry to browsing, plus a pet-tips banner when enabled."
        - "Storefront banner and Pets panel: search box, Account, Cart, Sign in or Sign out, language switches for English, Japanese and Chinese; Pets panel of the five categories and My List panel when enabled."
        - "General error: a server failure, with a way back to Home."

  - slug: product-catalog
    title: Product Catalog
    order: 2
    dependsOn: [site-shell]
    change:
      dir: openspec/changes/swhr4-i-0003-product-catalog
      specCapabilities: [product-catalog]
    canvas:
      problem: "A shopper wants to find a specific pet quickly and see what it costs, in their own language, without creating an account just to look around."
      solution: "A locale-aware, read-only catalogue of category, product and item with per-locale prices, paged listings and any-keyword search, open to anonymous visitors in English, Japanese and Chinese."
      userStories:
        - "As a shopper, I want to browse from a category to its products to an item, so I can find the pet I want."
        - "As a shopper, I want to search by any keyword and page through the matches, so I can find an item without browsing the whole catalogue."
        - "As a shopper, I want the catalogue content and prices shown in my locale, so I can shop in English, Japanese or Chinese."
        - "As a shopper, I want to browse and search without signing in, so I only create an account when I buy."
      acceptanceCriteria:
        - "Category, product and item listings are paged, with Previous and Next shown only when a page exists in that direction."
        - "Item detail shows the photograph, list price, customer price, description and Add to Cart, with a note that availability is confirmed after ordering."
        - "Search matches any of the entered keywords, pages the results with the keywords preserved, and shows an explicit no-results message for an empty query or no matches."
        - "Catalogue content and prices are served per locale (en_US, ja_JP, zh_CN); each locale carries its own price and nothing is converted between locales."
        - "Non-Latin search input round-trips through request and response encoding, and prices are formatted per locale."
        - "All catalogue screens are reachable without signing in."
      outOfScope:
        - "Catalogue administration (adding, editing or deleting categories, products or items)."
        - "Customer-facing stock levels; availability is resolved after ordering and never shown before."
        - "Currency conversion between locales."
      screens:
        - "Category listing: products in a category with short descriptions, paged, with Previous and Next shown only when a page exists in that direction."
        - "Product listing: items for a product with description, price and Add to Cart, paged."
        - "Item detail: photograph, list price, customer price, description and Add to Cart, with a note that availability is confirmed after ordering."
        - "Search results: matching items with description, price and Add to Cart, paged with the keywords preserved, and an explicit no-results message for an empty query or no matches."

  - slug: customer-account
    title: Customer Account
    order: 3
    dependsOn: [site-shell]
    change:
      dir: openspec/changes/swhr4-i-0004-customer-account
      specCapabilities: [customer-account]
    canvas:
      problem: "A shopper must be identified to place an order and have their contact, card and preferences on file, but must be able to see and change only their own account."
      solution: "Sign-in, account creation with duplicate-name rejection, a remembered user name, and protected account screens to view and edit contact details, the stored card and profile preferences (language, favourite category, MyList, pet tips)."
      userStories:
        - "As a new shopper, I want to create an account with my contact, card and profile details in one form, so I can check out."
        - "As a returning shopper, I want to sign in and have my user name remembered on request, so signing in is quick."
        - "As a shopper, I want to review and edit my contact details, card and preferences, so my next order uses current information."
        - "As a shopper, I want my language, favourite category, MyList and pet-tips preferences kept, so the store is personalised to me."
      acceptanceCriteria:
        - "Creating an account with a user name that already exists shows the Duplicate account screen and creates no account."
        - "Failed sign-in shows the Sign-in failed screen, which states the credentials were not found and invites a retry."
        - "The user name is remembered on request; the password is never remembered."
        - "Account overview and Edit account require sign-in, and a customer can read and write only their own account."
        - "Edit account shows current values, and the user name and password cannot be changed."
        - "Card numbers are tokenised and never stored or shown in full; only the last four digits are displayed."
        - "Card expiry years offer a rolling window starting at the current year."
        - "The storefront session expires after 15 minutes idle."
      outOfScope:
        - "Self-service password reset or any lost-password recovery path."
        - "Customer order history."
      screens:
        - "Sign in: returning-customer form (user name remembered on request, password never) beside a new-customer form (user name, password, password repeated)."
        - "Sign-in failed: states the credentials were not found and invites a retry."
        - "Create account: contact information, credit card information and profile information (language, favourite category, MyList, pet tips) in one form."
        - "Duplicate account: states the user name is taken, and no account is created."
        - "Account overview: read-only view of contact details, card and profile preferences, with a link to Edit account."
        - "Edit account: the account form with current values, where the user name and password cannot be changed."

  - slug: shopping-cart
    title: Shopping Cart
    order: 4
    dependsOn: [product-catalog]
    change:
      dir: openspec/changes/swhr4-i-0005-shopping-cart
      specCapabilities: [shopping-cart]
    canvas:
      problem: "A shopper collects items while browsing and needs to adjust what and how much they are buying before they commit, without having to sign in first."
      solution: "A session-scoped cart with add, remove and batch quantity update (a zero quantity removes the line), a locale-priced subtotal, emptied on sign-out or session expiry."
      userStories:
        - "As a shopper, I want to add items to a cart from listings, item detail and search results, so I can buy several pets in one order."
        - "As a shopper, I want to change several quantities and apply them with one Update Cart, so adjusting my order is quick."
        - "As a shopper, I want to remove a line or set it to zero, so I can drop an item I no longer want."
        - "As a shopper, I want to see each unit price and the total in my locale, so I know what I will pay."
      acceptanceCriteria:
        - "Adding an item already in the cart increases that line's quantity."
        - "Update Cart applies all edited quantities together, and a zero quantity removes the line."
        - "Each line shows a link to the item, Remove, an editable quantity and the unit price, and the cart shows the total, Update Cart and Check Out."
        - "An empty cart shows 'Your Shopping Cart is Empty.' and offers no checkout."
        - "The cart does not require sign-in and is emptied on sign-out or session expiry."
      outOfScope:
        - "Stock reservation or availability checks when adding to the cart."
        - "Persisting the cart across sessions."
      screens:
        - "Shopping cart: one line per item with a link to the item, Remove, an editable quantity and the unit price, plus the total, Update Cart and Check Out. When empty it shows 'Your Shopping Cart is Empty.' and offers no checkout."

  - slug: checkout-payment
    title: Checkout & Payment
    order: 5
    dependsOn: [shopping-cart, customer-account]
    change:
      dir: openspec/changes/swhr4-i-0006-checkout-payment
      specCapabilities: [checkout-payment]
    canvas:
      problem: "Turning a cart into an order must be quick for the shopper and must never wait on approval, the supplier or e-mail, or an order could be lost or a customer blocked."
      solution: "A checkout form capturing separate billing and shipping addresses pre-filled from the account, using the stored account card, rejecting an empty cart, and handing the order off to processing without waiting on it before showing the confirmation."
      userStories:
        - "As a shopper, I want to be sent to sign in only when I check out and then returned to Checkout, so I can browse anonymously."
        - "As a shopper, I want billing and shipping addresses pre-filled from my account, so checkout takes as few steps as possible."
        - "As a shopper, I want a confirmation with my order number, notification e-mail address and total, so I have a record of my order."
      acceptanceCriteria:
        - "Checkout requires sign-in; an anonymous shopper is sent to Sign in and returned to Checkout afterwards."
        - "Billing and shipping information are pre-filled from the account and required, except the second address line."
        - "Checkout shows the card that will be used (last four digits only) and the order total."
        - "Submitting an order with an empty cart shows the Empty-cart checkout error and creates no order."
        - "The confirmation shows 'Your order is complete' with the order number, the notification e-mail address and the total, and does not wait on approval, fulfilment or e-mail."
      outOfScope:
        - "Real payment processing: no authorisation, charge or decline path."
        - "Tax calculation; the order total is the sum of the line items."
        - "Shipping carriers, rates or tracking."
      screens:
        - "Checkout: billing information and shipping information, both pre-filled from the account and required except the second address line, plus the card that will be used and the order total."
        - "Empty-cart checkout error: shown when an order is submitted with nothing in the cart."
        - "Order confirmation: 'Your order is complete' with the order number, the e-mail address notifications go to and the total."

  - slug: order-management
    title: Order Management
    order: 6
    dependsOn: [checkout-payment]
    change:
      dir: openspec/changes/swhr4-i-0007-order-management
      specCapabilities: [order-management]
    canvas:
      problem: "An order moves through approval, fulfilment and notification over time, so it needs a durable record that later account changes cannot rewrite and that no step can lose."
      solution: "A purchase order record with a generated order number, its own copy of the billing and shipping addresses and card, per-line unit price and quantity shipped, the order total and the locale, carrying exactly one status."
      userStories:
        - "As a shopper, I want my order to keep the prices and addresses I ordered with, so later account or price changes do not alter it."
        - "As an administrator, I want every order to carry one clear status, so I know which orders need a decision."
        - "As supplier staff, I want each line to track quantity shipped separately from quantity ordered, so partial shipments are recorded correctly."
      acceptanceCriteria:
        - "Each submitted order gets a generated order number and is never lost, even when approval, the supplier or e-mail is unavailable."
        - "An order stores its own copy of the billing and shipping addresses and card, so later account changes do not rewrite it."
        - "Each line item keeps the unit price at the time of ordering and tracks quantity shipped separately from quantity ordered."
        - "The order total is the sum of the line items, and the order records its locale."
        - "Every order carries exactly one status: Pending, Approved, Denied, Partly shipped or Completed; Denied is terminal and Completed requires every line shipped in full."
      outOfScope:
        - "Customer order history."
        - "Returns, refunds or cancellations; an order cannot be changed once submitted."
        - "Shipment tracking; Completed is the final status."

  - slug: notification-messaging
    title: Notification & Messaging
    order: 7
    dependsOn: [order-management]
    change:
      dir: openspec/changes/swhr4-i-0008-notification-messaging
      specCapabilities: [notification-messaging]
    canvas:
      problem: "After the confirmation screen the shopper has no view of their order, so e-mail is their only source of status, and a mail outage must not hold up order processing."
      solution: "Queued customer e-mail on approval, denial, each shipment and completion, sent to the address on the order, where a mail outage delays e-mail but never blocks order processing."
      userStories:
        - "As a shopper, I want an e-mail when my order is approved or denied, so I know whether the store will honour it."
        - "As a shopper, I want an e-mail for each shipment and when my order is completed, so I know what has been sent without returning to the site."
      acceptanceCriteria:
        - "A customer e-mail is queued when an order is approved, when it is denied, on each shipment and on completion."
        - "E-mail goes to the address shown on the order confirmation."
        - "A mail outage never blocks or fails order approval, fulfilment or status changes; queued e-mail is sent once mail is available."
        - "E-mail content follows the order's locale."
      outOfScope:
        - "Channels other than e-mail."
        - "Shipment tracking links."

  - slug: order-approval
    title: Order Approval
    order: 8
    dependsOn: [order-management]
    change:
      dir: openspec/changes/swhr4-i-0009-order-approval
      specCapabilities: [order-approval]
    canvas:
      problem: "High-value orders carry real money risk and need a human decision, but review effort must scale with risk rather than order volume."
      solution: "Automatic approval below a locale-specific order-total threshold; otherwise the order stays Pending until an administrator decision, which releases it to the supplier (Approved) or ends it (Denied)."
      userStories:
        - "As a shopper placing an ordinary order, I want it approved automatically, so it ships without waiting for a person."
        - "As an administrator, I want only high-value orders held for me, so my review effort goes where the risk is."
        - "As an administrator, I want my decision to release an approved order to the supplier or end a denied one, so the order moves on without further steps."
      acceptanceCriteria:
        - "An en_US order under 500 or a ja_JP order under 50,000 is approved automatically; any other order, including every zh_CN order, is held as Pending."
        - "Approving a Pending order releases it to the supplier for fulfilment."
        - "Denying a Pending order ends it; Denied is terminal."
        - "Only Pending orders can be approved or denied."
        - "A slow or busy review queue never stops customers from ordering."
      outOfScope:
        - "Fraud or credit checks beyond the order-total threshold."
        - "A configurable rule set considering customer age, destination or item category."
        - "The administrator review screens (owned by admin-operations)."

  - slug: inventory-fulfillment
    title: Inventory & Fulfillment
    order: 9
    dependsOn: [order-approval]
    change:
      dir: openspec/changes/swhr4-i-0010-inventory-fulfillment
      specCapabilities: [inventory-fulfillment]
    canvas:
      problem: "Approved orders must be filled from stock that may not exist yet, automatically and with no one watching the queue, while a slow supplier must never stop customers ordering."
      solution: "A supplier inventory of record that fills each approved order line from stock with partial shipment, retries waiting orders whenever stock is updated, and sends an invoice back to order processing for what shipped."
      userStories:
        - "As a shopper, I want what is in stock shipped now when only part of my order can be filled, so I am not waiting on the whole order."
        - "As an administrator, I want approved orders completed automatically once stock exists, so nobody has to watch the queue."
        - "As supplier staff, I want a stock update to release orders that were waiting on it, so restocking drives fulfilment."
      acceptanceCriteria:
        - "An approved order has each line filled from recorded inventory, and inventory is decremented by the quantity shipped."
        - "When only some lines or quantities can be filled, what is in stock ships and the order becomes Partly shipped."
        - "An order becomes Completed only when every line has shipped in full."
        - "Committing an inventory update retries every order waiting on stock."
        - "Each shipment produces an invoice back to order processing for what shipped, which updates quantity shipped and status."
        - "A slow or unavailable supplier delays fulfilment but never blocks ordering or loses an order."
        - "The supplier receives the shipping details needed to ship an order."
      outOfScope:
        - "Multiple suppliers or sourcing decisions."
        - "Stock reservation at order time."
        - "Reconciling recorded inventory against physical stock."
        - "The supplier sign-in and inventory screen (owned by supplier-integration)."

  - slug: admin-operations
    title: Admin Operations
    order: 10
    dependsOn: [order-approval]
    change:
      dir: openspec/changes/swhr4-i-0011-admin-operations
      specCapabilities: [admin-operations]
    canvas:
      problem: "Administrators review held orders in batches and are the only role with a view of trading performance, and they need both in the browser behind their own sign-in."
      solution: "An authenticated browser-based administrator area with order review queues (batch approve or deny, committed together) and sales charts by category over a date range."
      userStories:
        - "As an administrator, I want to stage approve or deny decisions on several pending orders and commit them together, so I can work in batches."
        - "As an administrator, I want to see non-pending orders read-only, so I can check what has already been decided."
        - "As an administrator, I want revenue share and units ordered by pet category over a chosen period, so I can see what is selling."
      acceptanceCriteria:
        - "Every administration screen requires administrator sign-in, a failed sign-in shows an error, and the session expires after 54 minutes idle."
        - "Process pending orders lets each pending order be set to Approved or Denied, and all decisions are sent together on Commit."
        - "View non-pending orders is read-only and includes Partly shipped orders."
        - "Both tabs show order number, customer, date, amount and status, sortable by any column; data loads on Refresh, and refreshing with uncommitted decisions asks for confirmation."
        - "Sales reporting fetches for a start and end date and shows a pie chart of each category's share of revenue and a bar chart of quantity per category; an unreadable date is reported and nothing is fetched."
        - "An administrator cannot edit orders, customers or the catalogue."
      outOfScope:
        - "A Java Web Start or other desktop client."
        - "Editing orders, customers or the catalogue."
        - "Supplier inventory screens."
      screens:
        - "Admin sign in: user name and password, with an error on failure."
        - "Admin welcome: entry to order review and sales reporting, and sign-out."
        - "Admin — order review: a Process pending orders tab, where each pending order is set to Approved or Denied and all decisions are sent together on Commit, and a read-only View non-pending orders tab. Both tabs show order number, customer, date, amount and status, sortable by any column. Data is loaded on Refresh, and refreshing with uncommitted decisions asks for confirmation."
        - "Admin — sales reporting: start and end date with a fetch action, a pie chart of each category's share of revenue and a bar chart of quantity per category. An unreadable date is reported and nothing is fetched."

  - slug: supplier-integration
    title: Supplier Integration
    order: 11
    dependsOn: [inventory-fulfillment]
    change:
      dir: openspec/changes/swhr4-i-0012-supplier-integration
      specCapabilities: [supplier-integration]
    canvas:
      problem: "Supplier staff keep recorded stock matching real stock, and their updates release orders that could not be filled before, so they need a simple, authenticated way to update quantities."
      solution: "An authenticated supplier area where staff view inventory and replace quantities for the rows they flag, with each commit triggering fulfilment of waiting orders."
      userStories:
        - "As supplier staff, I want to see every item with its current quantity, so I can compare recorded stock with real stock."
        - "As supplier staff, I want to update only the rows I flag and submit them once, so I can restock several items together."
        - "As supplier staff, I want my submit to release orders waiting on stock, so restocking gets orders shipped."
      acceptanceCriteria:
        - "Every supplier screen requires supplier sign-in with a role separate from the administrator role, a failed sign-in shows an error, and the session expires after 54 minutes idle."
        - "The inventory screen lists every item with its current quantity, a new-quantity field and an Update flag per row, and one Submit."
        - "On Submit only flagged rows are saved, and an entered quantity replaces the stored figure."
        - "Each Submit triggers fulfilment of orders waiting on stock and returns to Supplier home."
        - "Supplier staff have no view of orders or customer accounts."
      outOfScope:
        - "Multiple suppliers."
        - "Feedback on which orders an inventory commit released."
        - "Reconciling recorded inventory against physical stock."
      screens:
        - "Supplier sign in: user name and password, with an error on failure."
        - "Supplier home: purpose of the area, Display inventory and sign-out."
        - "Supplier — inventory: every item with its current quantity, a new-quantity field and an Update flag per row, and one Submit. Only flagged rows are saved, and an entered quantity replaces the stored figure."
